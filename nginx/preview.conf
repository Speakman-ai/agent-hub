# nginx/preview.conf — Wildcard subdomain routing for PR preview containers.
#
# Deployment:
#   1. Copy to /etc/nginx/sites-enabled/preview.conf
#   2. Set AGENT_HUB_PREVIEW_DOMAIN in config.json (e.g., "preview.example.com")
#   3. DNS: wildcard A record *.preview.example.com → server IP
#   4. TLS: wildcard cert for *.preview.example.com (Let's Encrypt / ACM)
#   5. nginx -t && systemctl reload nginx
#
# Security note:
#   Preview container traffic bypasses the main Agent Hub API key
#   authentication. This is intentional — preview containers serve
#   their own isolated Agent Hub instances and are not part of the
#   main API surface. If previews should be restricted, add HTTP
#   basic auth or IP allowlisting in this nginx block.
#
# How it works:
#   - Requests to preview-pr-{N}.preview.example.com are proxied to the
#     Agent Hub server (localhost:3051)
#   - The server's preview proxy middleware reads the Host header, looks up
#     the running container for PR #{N}, and forwards the request to
#     the container's port (4000-4999)
#   - WebSocket upgrades are passed through with proper headers
#
# This is a two-hop proxy: nginx → Agent Hub server → preview container.
# The server-side proxy handles the container lookup and routing logic,
# keeping nginx config static (no dynamic upstream blocks needed).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Preview subdomain server block ────────────────────────────────
#
# Matches: preview-pr-*.preview.example.com
# Replace "preview.example.com" with your actual preview domain.

server {
    listen 80;
    listen 443 ssl;
    server_name ~^preview-pr-\d+\.preview\.example\.com$;

    # ── TLS ────────────────────────────────────────────────────────
    # Replace with your actual cert paths (e.g., Let's Encrypt wildcard).
    # ssl_certificate     /etc/letsencrypt/live/preview.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/preview.example.com/privkey.pem;

    # Redirect HTTP → HTTPS (uncomment when TLS is configured)
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }

    # ── WebSocket passthrough ─────────────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:3051;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── All other traffic (API + static assets) ───────────────────
    location / {
        proxy_pass http://127.0.0.1:3051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;

        # Support large uploads (e.g., file attachments in chat)
        client_max_body_size 50m;
    }

    # ── Gzip ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
