# docker-compose.preview.yml — Preview environment with snapshot DB
#
# Usage:
#   1. Create a snapshot:
#      npx tsx scripts/preview-snapshot.ts snapshot --filename preview.db
#      — or —
#      npx tsx scripts/preview-snapshot.ts seed --filename preview.db
#
#   2. Copy snapshot to a local directory (or use the default snapshots dir):
#      cp ~/.agent-hub/data/snapshots/preview.db ./snapshots/preview.db
#
#   3. Start the preview:
#      docker compose -f docker-compose.preview.yml up --build
#
# The preview container mounts the snapshot as read-only at /data/agent-hub.db.
# The server copies it to a writable location on startup so it can open WAL mode.
# Changes inside the preview are fully disposable — the source snapshot is never
# modified.

services:
  preview-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agent-hub-preview-server
    restart: 'no'
    volumes:
      # Mount the snapshot read-only; the entrypoint copies it to a writable path
      - ${PREVIEW_SNAPSHOT:-./snapshots/preview.db}:/snapshot/agent-hub.db:ro
    environment:
      - NODE_ENV=preview
      - AGENT_HUB_DATA_DIR=/data
      - AGENT_HUB_PORT=3051
      - AGENT_HUB_HOST=0.0.0.0
      # Preview-specific: copy the read-only snapshot to the writable data dir
      # on startup so WAL mode works. The real DB is never touched.
    entrypoint: >
      sh -c "
        cp /snapshot/agent-hub.db /data/agent-hub.db &&
        chmod 644 /data/agent-hub.db &&
        exec node_modules/.bin/tsx index.ts
      "
    expose:
      - '3051'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3051/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  preview-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: agent-hub-preview-client
    restart: 'no'
    ports:
      - '${PREVIEW_PORT:-8080}:80'
    depends_on:
      preview-server:
        condition: service_healthy
