####
# Agent Hub infrastructure monitoring — cross-account read-only role.
#
# CloudFormation equivalent of `agent-hub-monitoring-role.tf`. The permission
# policy below is the same document as `agent-hub-monitoring-policy.json`;
# CloudFormation has no `file()`, so it is restated inline and a doc test
# (`server/infra/infra-iam-policy.test.ts`) fails the build if the two ever
# disagree.
#
# Intrinsics are written long-form (`Ref:`, not `!Ref`) so the template parses
# with a stock YAML parser as well as with CloudFormation.
####
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Read-only role Agent Hub assumes to collect infrastructure telemetry. Grants
  metadata and CloudWatch metric reads only — no data-plane access.

Parameters:
  AgentHubCollectorRoleArn:
    Type: String
    Description: >-
      Role ARN Agent Hub assumes from. Pin the trust to this one principal
      rather than the whole account — trusting an account trusts every user and
      role in it. Use the role ARN, never the assumed-role session ARN.
    AllowedPattern: '^arn:aws[a-z0-9-]*:iam::\d{12}:role/.+$'

  AgentHubExternalId:
    Type: String
    Description: >-
      External ID from the project's AWS settings module in Agent Hub. Unique
      per project and generated by the Hub — do not invent one. Not a secret;
      its job is uniqueness per tenant.
    MinLength: 2
    MaxLength: 1224
    AllowedPattern: '^[\w+=,.@:/-]+$'

  RoleName:
    Type: String
    Default: AgentHubMonitoring

Resources:
  AgentHubMonitoringPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Metadata and metric reads Agent Hub collectors call. No data-plane reads.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AgentHubCallerIdentity
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
            Resource: '*'
          - Sid: AgentHubResourceInventory
            Effect: Allow
            Action:
              - ec2:DescribeRegions
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
              - ec2:DescribeVolumes
              - ec2:DescribeNatGateways
              - ec2:DescribeTags
              - ecs:ListClusters
              - ecs:DescribeClusters
              - ecs:ListServices
              - ecs:DescribeServices
              - rds:DescribeDBInstances
              - rds:DescribeDBClusters
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetHealth
              - lambda:ListFunctions
              - lambda:GetFunctionConfiguration
              - s3:ListAllMyBuckets
              - s3:GetBucketLocation
              - s3:GetBucketTagging
            Resource: '*'
          - Sid: AgentHubMetricRead
            Effect: Allow
            Action:
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
            Resource: '*'
          - Sid: AgentHubAlarmRead
            Effect: Allow
            Action:
              - cloudwatch:DescribeAlarms
            Resource: '*'
          - Sid: AgentHubTagRead
            Effect: Allow
            Action:
              - tag:GetResources
            Resource: '*'
          - Sid: AgentHubQuotaRead
            Effect: Allow
            Action:
              - servicequotas:ListServiceQuotas
              - servicequotas:GetServiceQuota
            Resource: '*'
          - Sid: AgentHubCostExplorerRead
            Effect: Allow
            Action:
              - ce:GetCostAndUsage
            Resource: '*'
          - Sid: AgentHubHealthRead
            Effect: Allow
            Action:
              - health:DescribeEvents
              - health:DescribeEventDetails
              - health:DescribeAffectedEntities
            Resource: '*'

  AgentHubMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: RoleName
      Description: Read-only telemetry access for Agent Hub infrastructure monitoring.
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - Ref: AgentHubMonitoringPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Ref: AgentHubCollectorRoleArn
            Action: sts:AssumeRole
            Condition:
              # StringEquals, never StringEqualsIfExists: the ...IfExists
              # operators evaluate true when the key is absent, which would
              # admit an AssumeRole call carrying no external ID at all.
              StringEquals:
                sts:ExternalId:
                  Ref: AgentHubExternalId
              ArnEquals:
                aws:PrincipalArn:
                  Ref: AgentHubCollectorRoleArn

Outputs:
  AgentHubMonitoringRoleArn:
    Description: Paste this into the project's assume-role AWS profile in Agent Hub.
    Value:
      Fn::GetAtt:
        - AgentHubMonitoringRole
        - Arn
