        - schema:
            type: string
          required: true
          name: projectId
          in: path
        - schema:
            type: string
            description: Look-back window in days; positive integer (default 30, max 365).
          required: false
          description: Look-back window in days; positive integer (default 30, max 365).
          name: windowDays
          in: query
      responses:
        "200":
          description: Flake statistics for the window.
          content:
            application/json:
