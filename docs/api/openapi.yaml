    BoardResponse:
      type: object
      properties:
        board:
          $ref: "#/components/schemas/KanbanBoard"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/KanbanColumn"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/KanbanCardEnriched"
        epics:
          type: array
          items:
            $ref: "#/components/schemas/KanbanEpic"
        phases:
          type: array
          items:
            $ref: "#/components/schemas/KanbanPhase"
          description: All phases on the board, ordered by position within their epic.
        specItems:
          type: array
          items:
            $ref: "#/components/schemas/KanbanEpicSpecItem"
          description: Architecture spec decisions for epics — resolved via spike tickets/sessions.
        counts:
          type: object
          additionalProperties:
            type: integer
          description: "Total card count per column, keyed by column id (`{ [columnId]: total }`). Always present. Lets a client decide whether a column has more cards than the page in `cards` and fetch the rest via GET /board/columns/:columnId/cards."
        cursors:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: "Per-column next-page cursor, keyed by column id (`{ [columnId]: nextCursor|null }`). Present only when `?limit=N` is supplied. A non-null value is the opaque keyset cursor to pass as `cursor` to GET /board/columns/:columnId/cards for the next page; null means the first page is the last page. Lets a client seed per-column infinite scroll from this one request without reconstructing the opaque cursor."
      required:
        - board
        - columns
        - cards
        - epics
        - counts
      description: "Full board state: board metadata + columns + cards (with blocker graph) + epics + per-column counts. When the request omits `?limit`, `cards` carries the full board (backward compatible). When `?limit=N` is supplied, `cards` carries only the first N cards per column (ordered by position, id), bounding the payload."
    PaginatedColumnCards:
      type: object
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/KanbanCardEnriched"
        nextCursor:
          type: string
          nullable: true
          description: Opaque keyset cursor for the next page, or null on the final page. Echo it back as the `cursor` query param to fetch the following page.
        total:
          type: integer
          description: Total card count in this column.
      required:
        - cards
        - nextCursor
        - total
      description: One keyset-paginated page of a column's cards (with blocker graph attached).
    BoardErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
