                    nullable: true
                    properties:
                      type:
                        type: string
                        enum:
                          - agenthub_preview
                      kind:
                        type: string
                        enum:
                          - preview_starting
                          - preview
                          - preview_failed
                      sessionId:
                        type: string
                      previewId:
                        type: string
                      target:
                        type: string
                        enum:
                          - client
                      route:
                        type: string
                      previewUrl:
                        type: string
