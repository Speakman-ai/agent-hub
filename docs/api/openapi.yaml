        assignee:
          type: string
          nullable: true
        labels:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        github_issue_url:
          type: string
          nullable: true
        pr_url:
          type: string
          nullable: true
        review_status:
          type: string
          nullable: true
