  /api/projects/{projectId}/security-audit/fix:
    post:
      tags:
        - Projects
      summary: Open a Dependabot-style bump PR for all fixable findings, optionally by severity
      description: "Opens (or refreshes) the single rolling native bump PR carrying every open fixable npm finding for the project. Pass `minSeverity` to narrow to a severity threshold (`high` = critical AND high); omit it to fix every fixable finding. All bumps share one rolling branch, so each call sets the PR contents to its scope. Requires gitHost: agenthub, a wired native PR service, and the Admin role. Idempotent."
