        "202":
          description: Dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                  status:
                    type: string
                    enum:
                      - dispatched
                required:
                  - sessionId
                  - status
                description: The intake session has been spawned. Result is the session id; the kanban card lands when the session completes.
        "400":
          description: Validation failed (missing title, bad severity, malformed multipart).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugReportsErrorResponse"
        "413":
          description: Screenshot exceeds 5 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugReportsErrorResponse"
        "429":
          description: Per-IP rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugReportsErrorResponse"
        "500":
          description: Intake agent missing or handler threw.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugReportsErrorResponse"
