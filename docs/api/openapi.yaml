          example: https://d-1234567890.awsapps.com/start/
        sso_region:
          type: string
          description: AWS region code, e.g. `us-east-2`.
          example: us-east-2
        sso_role_name:
          type: string
          description: IAM Identity Center role to assume.
        region:
          type: string
          description: AWS region code, e.g. `us-east-2`.
          example: us-east-2
        output:
          type: string
          description: AWS CLI default output format; defaults to `json` on render.
      required:
        - sso_account_id
        - sso_start_url
