    DeviceTokenResponse:
      type: object
      properties:
        token:
          type: string
        platform:
          type: string
        enabledEvents:
          type: array
          nullable: true
          items:
            type: string
        supportedEvents:
          type: array
          items:
            type: string
      required:
        - token
        - platform
        - enabledEvents
        - supportedEvents
      description: Push-token preferences and supported event list.
    UsageResponse:
      type: object
      properties:
        totals:
          type: object
          properties:
            sessions:
              type: integer
            messages:
              type: integer
            tokens:
              type: integer
            cost_usd:
              type: number
          additionalProperties:
            nullable: true
        byAgent:
          type: array
          items:
            type: object
            properties:
              agent_id:
                type: string
              agent_name:
                type: string
              agent_color:
                type: string
            required:
              - agent_id
              - agent_name
              - agent_color
            additionalProperties:
              nullable: true
        byDay:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
            required:
              - day
            additionalProperties:
              nullable: true
        recentSessions:
          type: array
          items:
            type: object
            properties:
              agent_id:
                type: string
              agent_name:
                type: string
              agent_color:
                type: string
            required:
              - agent_id
              - agent_name
              - agent_color
            additionalProperties:
              nullable: true
      required:
        - totals
        - byAgent
        - byDay
        - recentSessions
      description: Aggregated usage rollup. Cost de-dup of the Claude CLI cumulative `total_cost_usd` happens in `usage-aggregation.ts`.
    NotesErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: number
              message:
                type: string
            required:
              - path
              - message
      required:
        - error
      description: Error envelope for notes routes.
    Note:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        content:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - project_id
        - title
        - content
        - created_at
        - updated_at
      description: A single project note row.
    PreviewSecretRow:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        key:
          type: string
        kind:
          type: string
          enum:
            - plain
            - secret
          description: "`plain` values are returned in clear on GET. `secret` values are masked on GET (return the `••••••••` sentinel) and only decrypted at spawn time inside `loadProjectEnvForSpawn`."
        value:
          type: string
          description: Decrypted value for `plain` kind; the `••••••••` MASK sentinel for `secret` kind. Never the plaintext of a secret-kind row.
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - project_id
        - key
        - kind
        - value
        - created_at
        - updated_at
      description: One per-project secret row as returned by GET / PUT. `secret`-kind rows mask the value field; the only path that decrypts a secret is the spawn-time `loadProjectEnvForSpawn` (no caller-facing read).
    PreviewSecretsListResponse:
      type: object
      properties:
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/PreviewSecretRow"
      required:
        - secrets
      description: Current secrets for the project, sorted by key. `secret`-kind values are masked.
    PreviewSecretsPutRequest:
      type: object
      properties:
        secrets:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: Env var name. Same validation rules as the URL `:key` param.
              value:
                type: string
                description: New plaintext value, OR the MASK sentinel (`••••••••`) for an existing `secret`-kind row to preserve its ciphertext without re-sending the plaintext.
              kind:
                type: string
                enum:
                  - plain
                  - secret
                description: Defaults to `secret` when omitted.
            required:
              - key
              - value
            description: One entry in a bulk-replace PUT body.
          description: Full replacement set. Keys not present in the array are removed. Send the MASK sentinel for an existing secret-kind row to preserve its current ciphertext.
      required:
        - secrets
      description: Body for PUT /secrets.
    PreviewSecretsImportRequest:
      type: object
      properties:
        env:
          type: string
          description: "`.env`-style blob. Supports `KEY=value`, quoted values, `export KEY=value`, comments and blank lines. Multi-line values and shell-expansion are NOT supported."
        mode:
          type: string
          enum:
            - replace
            - merge
          description: "`replace` (default) — wipe existing keys and install the parsed set. `merge` — keep existing keys, parsed entries win on conflict."
        defaultKind:
          type: string
          enum:
            - plain
            - secret
          description: Kind to assign to each parsed entry; defaults to `secret`.
      required:
        - env
      description: Body for POST /secrets/import.
    PreviewSecretsImportResponse:
      type: object
      properties:
        imported:
          type: integer
          description: Count of parsed entries that made it into the write.
        mode:
          type: string
          enum:
            - replace
            - merge
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/PreviewSecretRow"
      required:
        - imported
        - mode
        - secrets
      description: Outcome of the import. `secrets` reflects the post-import state.
    PreviewSecretsErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Error envelope for preview-secrets routes.
    ProjectAwsSsoProfile:
      type: object
      properties:
        sso_account_id:
          type: string
          description: 12-digit AWS account id.
          example: "123456789012"
        sso_start_url:
          type: string
          description: IAM Identity Center start URL (`https://…`).
          example: https://d-1234567890.awsapps.com/start/
        sso_region:
          type: string
          description: AWS region code, e.g. `us-east-2`.
          example: us-east-2
        sso_role_name:
          type: string
          description: IAM Identity Center role to assume.
        region:
          type: string
          description: AWS region code, e.g. `us-east-2`.
          example: us-east-2
        output:
          type: string
          description: AWS CLI default output format; defaults to `json` on render.
      required:
        - sso_account_id
        - sso_start_url
        - sso_region
        - sso_role_name
        - region
      description: One AWS IAM Identity Center (SSO) profile stanza. Rendered into the per-spawn `AWS_CONFIG_FILE` as a `[profile <name>]` section. Not credentials — SSO tokens still live under the spawning user's `~/.aws/sso/cache`.
    ProjectAwsSsoProfilesMap:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/ProjectAwsSsoProfile"
      description: Map of profile name → profile stanza.
    ProjectAwsProfilesResponse:
      type: object
      properties:
        profiles:
          $ref: "#/components/schemas/ProjectAwsSsoProfilesMap"
      required:
        - profiles
      description: Current AWS SSO profiles configured on the project.
    ProjectAwsProfilesRequest:
      type: object
      properties:
        profiles:
          anyOf:
            - $ref: "#/components/schemas/ProjectAwsSsoProfilesMap"
            - type: array
              items:
                nullable: true
          description: "Replacement set of profiles. Accepts either a `{ name: stanza }` map or an array of `{ name, ...stanza }` objects. Pass `{}` to clear all profiles."
      required:
        - profiles
      description: Body for PUT /aws-profiles.
    ProjectAwsErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Error envelope for project-aws routes.
    ProjectAwsSsoStatusResponse:
      anyOf:
        - type: object
          properties:
            profile:
              type: string
            loggedIn:
              type: boolean
              enum:
                - true
            account:
              type: string
            arn:
              type: string
            userId:
              type: string
          required:
            - profile
            - loggedIn
        - type: object
          properties:
            profile:
              type: string
            loggedIn:
              type: boolean
              enum:
                - false
            error:
              type: string
            needsLogin:
              type: boolean
          required:
            - profile
            - loggedIn
      description: "`aws sts get-caller-identity` result for the named profile. `loggedIn: false` with `needsLogin: true` means the cached SSO token is missing or expired and the caller should POST /aws-sso/login."
    ProjectAwsSsoLoginRequest:
      type: object
      properties:
        profile:
          type: string
          description: Configured profile name to log in.
      required:
        - profile
      description: Body for POST /aws-sso/login.
    ProjectAwsSsoLoginResponse:
      anyOf:
        - type: object
          properties:
            ok:
              type: boolean
              enum:
                - true
            loginId:
              type: string
              description: Server-local id for this login attempt — useful for log correlation.
            profile:
              type: string
            loginUrl:
              type: string
              description: IAM Identity Center device-authorization URL the user must open in a browser. Present on the standard happy path where the URL surfaces within ~30 seconds.
            completed:
              type: boolean
              description: True when `aws sso login --no-browser` finished entirely server-side (rare — usually the user completes the device flow in a browser before the CLI exits).
            output:
              type: string
              description: Tail of the CLI stdout/stderr (capped) for diagnostic purposes.
          required:
            - ok
            - loginId
            - profile
        - type: object
          properties:
            ok:
              type: boolean
              enum:
                - false
            loginId:
              type: string
            profile:
              type: string
            error:
              type: string
            output:
              type: string
          required:
            - ok
            - loginId
            - profile
            - error
      description: Outcome of the browser-less `aws sso login` spawn. Only one login proc runs per server at a time; if a second request arrives while a previous one is still running the previous proc is killed and a new one is spawned.
    ProjectOrderResponse:
      type: object
      properties:
        projectIds:
          type: array
          items:
            type: string
          description: Caller-visible project ids in their persisted order after the reorder commit.
      required:
        - projectIds
      description: Confirmation of the new project order. Mirrors the visibility-filtered slice the caller would see from GET /api/projects.
    ProjectOrderErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Error envelope returned when the reorder payload is malformed or references projects the caller cannot see.
    ProjectDetail:
      type: object
      properties:
        id:
          type: string
          description: Project slug — unique within the install.
        name:
          type: string
          description: Human-readable project name.
        cwd:
          type: string
          description: Absolute path to the project working directory on disk.
        githubRepo:
          type: string
          nullable: true
          description: GitHub repo in `owner/repo` form (e.g. `Speakman-ai/agent-hub`). Empty/null when the project has no GitHub remote.
        webhookConfigured:
          type: boolean
          nullable: true
          description: Whether this project has at least one enabled webhook_configs row. `true` — at least one enabled row delivers events. `false` — `githubRepo` is set but no enabled row exists; PR events will NOT reach the reviewer pipeline. Drives the missing-webhook UI banner. `null` — `githubRepo` is unset (non-GitHub remote or scratch project); webhook config is not applicable.
      required:
        - id
        - name
        - webhookConfigured
      additionalProperties:
        nullable: true
      description: Project detail response. Includes the full Project shape stored in `projects.json` plus the derived `webhookConfigured` flag. Additional fields beyond the documented ones (agents, githubWorkflow, prEnv, …) flow through via passthrough — schematise as that legacy surface migrates onto the schema-first contract.
    ProjectDetailErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Error envelope returned when the project slug is unknown.
    WebhookConfigRow:
      type: object
      properties:
        id:
          type: number
        project_id:
          type: string
        repo_url:
          type: string
        secret:
          type: string
          nullable: true
        events:
          type: string
          description: JSON-encoded event-toggle map.
        enabled:
          type: number
          description: 1 if enabled, 0 if disabled.
        author_allowlist:
          type: string
          description: JSON-encoded array of GitHub logins whose PRs trigger the reviewer.
        created_at:
          type: string
        updated_at:
          type: string
          nullable: true
      required:
        - id
        - project_id
        - repo_url
        - secret
        - events
        - enabled
        - author_allowlist
        - created_at
        - updated_at
      description: Persisted webhook_configs row.
    WebhookRegistrationResult:
      anyOf:
        - type: object
          properties:
            ok:
              type: boolean
              enum:
                - true
            skipped:
              type: boolean
              enum:
                - true
            reason:
              type: string
            message:
              type: string
            hookId:
              type: number
            url:
              type: string
            events:
              type: array
              items:
                type: string
            updated:
              type: boolean
          required:
            - ok
        - type: object
          properties:
            ok:
              type: boolean
              enum:
                - false
            error:
              type: string
          required:
            - ok
            - error
      description: 'Outcome of the GitHub-side webhook registration. `skipped: true` with `reason: "github_app_installed"` means the GitHub App already delivers events for this repo, so no per-repo registration is needed — the local `webhook_configs` row is still created for UI clarity.'
    WebhookAutoConfigureResponse:
      type: object
      properties:
        config:
          $ref: "#/components/schemas/WebhookConfigRow"
        registration:
          $ref: "#/components/schemas/WebhookRegistrationResult"
      required:
        - config
        - registration
      description: "Auto-configure result: the created `webhook_configs` row plus the registration outcome from GitHub."
    WebhookAutoConfigureErrorResponse:
      type: object
      properties:
        error:
          type: string
        existingConfigId:
          type: number
      required:
        - error
      description: Error envelope. `existingConfigId` is set on 409 conflicts to point the UI at the row already in place.
    WebhookHmacFailureEntry:
      type: object
      properties:
        ts:
          type: integer
        repoFullName:
          type: string
        eventLabel:
          type: string
        deliveryId:
          type: string
          nullable: true
        triedSources:
          type: string
        isAppDelivery:
          type: boolean
        healAttempted:
          type: boolean
        healResult:
          type: string
          enum:
            - ok
            - failed
            - skipped
        healError:
          type: string
      required:
        - ts
        - repoFullName
        - eventLabel
        - deliveryId
        - triedSources
        - isAppDelivery
        - healAttempted
      description: One GitHub webhook delivery that failed HMAC signature verification. Entries are kept in an in-memory ring buffer; restart-volatile.
    WebhookHmacFailureList:
      type: object
      properties:
        failures:
          type: array
          items:
            $ref: "#/components/schemas/WebhookHmacFailureEntry"
      required:
        - failures
    WikiPage:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        category:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - project_id
        - title
        - slug
        - content
        - category
        - updated_by
        - created_at
        - updated_at
      description: A wiki page row (includes full content).
    WikiPageListItem:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - project_id
        - title
        - slug
        - category
        - updated_by
        - created_at
        - updated_at
      description: A wiki page list item (content omitted for payload size). Returned by `GET /wiki` bare and `?category=` paths.
    WikiSearchHit:
      allOf:
        - $ref: "#/components/schemas/WikiPageListItem"
        - type: object
          properties:
            snippet:
              type: string
            rank:
              type: number
      description: A wiki page returned from the legacy FTS5 search path (`GET /wiki?q=`). Adds the highlighted `snippet` and bm25-ish `rank`. Content is not included.
    WikiHybridSearchResult:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        score:
          type: number
        ftsScore:
          type: number
        semanticScore:
          type: number
        matchedChunk:
          type: string
        snippet:
          type: string
      required:
        - id
        - project_id
        - title
        - slug
        - category
        - updated_by
        - created_at
        - updated_at
        - score
      description: A hit from the hybrid/semantic/fts wiki search. `score` is the blended ranking; `ftsScore` / `semanticScore` are the per-mode components; `matchedChunk` is the highest-scoring chunk on the page (semantic / hybrid only).
    WikiSearchResponse:
      type: object
      properties:
        mode:
          type: string
          enum:
            - hybrid
            - semantic
            - fts
        query:
          type: string
        geminiConfigured:
          type: boolean
        results:
          type: array
          items:
            $ref: "#/components/schemas/WikiHybridSearchResult"
      required:
        - mode
        - geminiConfigured
        - results
      description: Envelope returned by `GET /wiki/search`. `geminiConfigured` reports whether the server has a Gemini API key (semantic + hybrid modes fall back to FTS when false).
    WikiBackfillResult:
      type: object
      properties:
        projectId:
          type: string
        total:
          type: integer
        embedded:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              pageId:
                type: string
              error:
                type: string
            required:
              - pageId
              - error
      required:
        - projectId
        - total
        - embedded
        - skipped
        - errors
      description: Result of a project-wide wiki re-embedding pass. `total` is the count of pages scanned; `embedded` increments per successfully chunk-and-embed; `skipped` counts pages skipped because the embed client could not be invoked; `errors` lists per-page failures.
    WikiErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: number
              message:
                type: string
            required:
              - path
              - message
      required:
        - error
      description: Error envelope. `details` is populated for 400 schema-validation errors with one entry per failing Zod issue.
  parameters: {}
paths:
  /api/agents:
    get:
      tags:
        - Agents
      summary: List all agents (enriched with last-activity / last-message)
      responses:
        "200":
          description: Array of agents enriched with last-activity metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentEnriched"
    post:
      tags:
        - Agents
      summary: Create a new agent under an existing project
      description: Returns 400 for missing/invalid id (must be alphanumeric + hyphens) or missing projectId, 404 if the project does not exist, 409 if the id collides with an existing agent.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  pattern: ^[a-zA-Z0-9-]+$
                projectId:
                  type: string
                  minLength: 1
                name:
                  type: string
                engine:
                  type: string
                model:
                  type: string
                systemPrompt:
                  type: string
                color:
                  type: string
                avatar:
                  type: string
                role:
                  type: string
                heartbeat:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    interval:
                      type: string
                    prompt:
                      type: string
                browserToolsEnabled:
                  type: boolean
                browserViewportWidth:
                  type: number
                  nullable: true
                browserViewportHeight:
                  type: number
                  nullable: true
                browserPageLoadTimeoutMs:
                  type: number
                  nullable: true
              required:
                - id
                - projectId
      responses:
        "201":
          description: Created agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEnriched"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "409":
          description: Agent id already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
  /api/agents/{agentId}:
    patch:
      tags:
        - Agents
      summary: Partially update an agent
      description: Omitted keys preserve the existing value. `browserViewportWidth` / `browserViewportHeight` / `browserPageLoadTimeoutMs` accept `null` to clear the override.
      parameters:
        - schema:
            type: string
            description: Agent ID.
          required: true
          description: Agent ID.
          name: agentId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                engine:
                  type: string
                model:
                  type: string
                systemPrompt:
                  type: string
                color:
                  type: string
                avatar:
                  type: string
                heartbeat:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    interval:
                      type: string
                    prompt:
                      type: string
                active:
                  type: boolean
                reviewer:
                  type: string
                role:
                  type: string
                canReview:
                  type: boolean
                delegationEnabled:
                  type: boolean
                browserToolsEnabled:
                  type: boolean
                browserViewportWidth:
                  type: number
                  nullable: true
                browserViewportHeight:
                  type: number
                  nullable: true
                browserPageLoadTimeoutMs:
                  type: number
                  nullable: true
      responses:
        "200":
          description: Updated agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEnriched"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "404":
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
    delete:
      tags:
        - Agents
      summary: Hard-delete an agent and its dependent rows
      description: Stops the in-memory heartbeat, transactionally clears every child store keyed by `agent_id` (sessions cascade messages/delegations/handoffs/skill_invocations/background_tasks/message_queue/checkpoints via FK ON DELETE CASCADE), drops the agent from `projects.json`, refreshes the project room, and best-effort removes the on-disk agent workspace. Returns 204 on success.
      parameters:
        - schema:
            type: string
            description: Agent ID.
          required: true
          description: Agent ID.
          name: agentId
          in: path
      responses:
        "204":
          description: Agent and dependent rows removed.
        "404":
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "500":
          description: Internal cleanup failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
  /api/agents/bulk-engine:
    post:
      tags:
        - Agents
      summary: Bulk-set engine (and optionally model) on every agent in every project
      description: Falls back to the engine's default model when `model` is missing or not in the engine's allowlist. Returns the count of agents updated.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                engine:
                  type: string
                  minLength: 1
                model:
