                properties:
                  output:
                    type: string
                  grade:
                    type: object
                    properties:
                      graded:
                        type: boolean
                      passed:
                        type: boolean
                      assertionResults:
                        type: array
                        items:
                          type: object
                          properties:
                            assertion:
                              type: object
                              properties:
