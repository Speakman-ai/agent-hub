      description: Reorders `projects.json` so the caller-visible slice matches the supplied id list. Projects the caller cannot see (e.g. private projects owned by other users) keep their absolute slot — only the visible subset is permuted. Broadcasts `projects_updated` over the WebSocket on success so other open clients refresh their sidebars.
