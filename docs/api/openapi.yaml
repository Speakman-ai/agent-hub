  /api/projects/{projectId}/support-requests:
    options:
      tags:
        - Support Requests
      summary: CORS preflight (returns 204)
      parameters:
        - schema:
            type: string
            description: Project slug or id.
          required: true
          description: Project slug or id.
          name: projectId
          in: path
      responses:
        "204":
          description: CORS preflight OK.
    post:
      tags:
        - Support Requests
      summary: Public support-request intake (multipart)
      description: Unauthenticated, rate-limited (10 / hour per IP). Body must be `multipart/form-data` with at minimum `type` (`bug` | `feature_request`) and `title`. `severity` drives support-queue ordering. For `bug` requests, an optional `sessionReplayUrl` reference and/or `sessionReplay` attachment (≤25 MB) may be supplied. Spawns a session for the project `intake` agent to land a kanban card under the `support-request` epic.
      parameters:
        - schema:
            type: string
            description: Project slug or id.
          required: true
          description: Project slug or id.
          name: projectId
          in: path
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SupportRequestFormFields"
      responses:
        "202":
          description: Dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                  status:
                    type: string
                    enum:
                      - dispatched
                required:
                  - sessionId
                  - status
                description: The intake session has been spawned. Result is the session id; the kanban card lands when the session completes.
        "400":
          description: Validation failed (bad/missing type, missing title, bad severity, session replay on a non-bug request, malformed multipart).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestsErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestsErrorResponse"
        "413":
          description: Payload too large — session-replay attachment over 25 MB, or the whole multipart body over 26 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestsErrorResponse"
        "429":
          description: Per-IP rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestsErrorResponse"
        "500":
          description: Project has no intake agent or handler threw.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestsErrorResponse"
  /api/projects/{projectId}/wiki:
    get:
      tags:
        - Wiki
      summary: List wiki pages (optionally filtered or FTS-searched)
      description: When `?q=` is set, returns FTS5 hits (`WikiSearchHit[]` — list-item fields + `snippet` + `rank`, no `content`). When `?category=` is set, returns pages in that category (`WikiPageListItem[]`, no `content`). Otherwise returns every page in the project (`WikiPageListItem[]`, no `content`). `limit` only applies to the `?q=` path; the bare and category responses are unpaginated. Invalid `?limit=` values (non-numeric) and other schema violations return 400.
      parameters:
        - schema:
            type: string
            description: Project ID (slug).
          required: true
          description: Project ID (slug).
          name: projectId
          in: path
        - schema:
            type: string
          required: false
          name: q
          in: query
        - schema:
            type: string
          required: false
          name: category
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Wiki pages (shape depends on the query params — see description).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WikiPageListItem"
        "400":
          description: Query parameter validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
    post:
      tags:
        - Wiki
      summary: Create a wiki page
      description: Slug is derived from `title` via lowercase + non-alphanumeric squash. Returns 409 when the resulting slug collides with an existing page on the same project.
      parameters:
        - schema:
            type: string
            description: Project ID (slug).
          required: true
          description: Project ID (slug).
          name: projectId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                content:
                  type: string
                category:
                  type: string
                updatedBy:
                  type: string
              required:
                - title
      responses:
        "201":
          description: New page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiPage"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
        "409":
          description: Slug collision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
  /api/projects/{projectId}/wiki/search:
    get:
      tags:
