openapi: 3.0.3
info:
  title: Agent Hub REST API
  version: 1.21.3
  description: |-
    REST API for **Agent Hub** — a full-stack platform for managing AI
    agent sessions, kanban boards, per-project wikis, heartbeats, and
    cron jobs.

    ### Authentication
    Most endpoints require one of:
    - A session cookie issued by `POST /api/auth/login`.
    - A user-owned API key minted via `POST /api/auth/keys`, sent as
      `Authorization: Bearer ahub_…` or `X-API-Key: ahub_…`.
    - The break-glass instance API key (`X-API-Key`), set via
      `~/.agent-hub/data/config.json` `apiKey`. Treated as Owner across
      every org — use only for automation / sub-agent spawn.

    ### Realtime
    Live updates (chat streaming, kanban / wiki events, cron output)
    are delivered over WebSocket on the same port as HTTP. This
    document covers the REST surface only.
  contact:
    name: Agent Hub
    url: https://github.com/Speakman-ai/agent-hub
  license:
    name: Proprietary
servers:
  - url: http://localhost:3051
    description: Local development server
  - url: https://hub.example.com
    description: Self-hosted production deployment (operator-defined)
security:
  - bearerAuth: []
  - apiKeyHeader: []
  - cookieAuth: []
tags:
  - name: Health
    description: Liveness and runtime info.
  - name: Auth
    description: Sign-in, API keys, per-user credential management.
  - name: Projects
    description: Project CRUD and metadata.
  - name: Agents
    description: Agent configuration under a project.
  - name: Sessions
    description: Chat sessions and message history.
  - name: Board
    description: Per-project kanban boards (columns, cards, epics, comments).
  - name: Wiki
    description: Per-project wiki with FTS5 + semantic search.
  - name: Heartbeats
    description: Per-agent scheduled check-ins.
  - name: Crons
    description: Project-scoped automated jobs.
  - name: Admin
    description: Owner-only administrative endpoints.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ahub_...
      description: "User-owned API key minted via `POST /api/auth/keys`. Send as `Authorization: Bearer ahub_...`."
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: Either a per-user `ahub_*` key or the break-glass instance API key from `~/.agent-hub/data/config.json` (`apiKey`).
    cookieAuth:
      type: apiKey
      in: cookie
      name: agent_hub_session
      description: Session cookie issued by `POST /api/auth/login`.
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
      required:
        - error
      description: Standard error envelope used across the API.
    ZodIssue:
      type: object
      properties:
        path:
          type: array
          items:
            anyOf:
              - type: string
              - type: number
        message:
          type: string
        code:
          type: string
      required:
        - path
        - message
      description: A single Zod validation issue. Returned on 400 responses caused by request-body shape errors.
    ZodErrorResponse:
      type: object
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ZodIssue"
      required:
        - error
      description: A 400 response produced by Zod body/query validation. `issues` lists each field that failed.
    UserSummary:
      type: object
      properties:
        id:
          type: string
          nullable: true
        username:
          type: string
        role:
          type: string
          enum:
            - Owner
            - Admin
            - User
        createdAt:
          anyOf:
            - type: string
            - type: number
            - nullable: true
      required:
        - username
        - role
    TokenResponse:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            role:
              type: string
              enum:
                - Owner
                - Admin
                - User
          required:
            - username
            - role
      required:
        - token
        - expiresAt
        - user
    AuthSetupBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    AuthLoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    AuthCreateUserBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum:
            - Owner
            - Admin
            - User
      required:
        - username
        - password
    AuthUpdateUserRoleBody:
      type: object
      properties:
        role:
          type: string
          enum:
            - Owner
            - Admin
            - User
      required:
        - role
    AuthPasswordResetBody:
      type: object
      properties:
        newPassword:
          type: string
      required:
        - newPassword
    CreateApiKeyBody:
      type: object
      properties:
        name:
          type: string
        expiresInDays:
          anyOf:
            - type: number
            - type: string
            - nullable: true
          description: 1–3650 days, or null/omitted to never expire. Strings are coerced to numbers.
      required:
        - name
    CreateInviteBody:
      type: object
      properties:
        role:
          type: string
          enum:
            - Owner
            - Admin
            - User
        email:
          type: string
          nullable: true
        ttlHours:
          type: number
    AcceptInviteBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    UpdateClaudeAuthBody:
      type: object
      properties:
        anthropicApiKey:
          type: string
          nullable: true
        claudeCodeOAuthToken:
          type: string
          nullable: true
        claudeCodeOAuthExpiresAt:
          type: string
          nullable: true
      description: Per-user Claude credentials. Each field is whitelisted before reaching the DB — unknown keys are silently dropped.
    UpdateSingleKeyAuthBody:
      type: object
      properties:
        apiKey:
          type: string
          nullable: true
      description: Per-user single-key engine credentials (Cursor / Gemini / Codex).
    UpsertSkillCredentialBody:
      type: object
      properties:
        skill_id:
          type: string
        key_name:
          type: string
        agent_id:
          type: string
        value:
          type: string
      required:
        - skill_id
        - key_name
        - agent_id
    ClaudeLoginBody:
      type: object
      properties:
        method:
          type: string
        email:
          type: string
        sso:
          type: boolean
    ClaudeCallbackBody:
      type: object
      properties:
        code:
          type: string
          description: OAuth authorization code from Anthropic.
      required:
        - code
    ApiKeyOnlyBody:
      type: object
      properties:
        apiKey:
          type: string
          nullable: true
    ApiKeyRequiredBody:
      type: object
      properties:
        apiKey:
          type: string
          minLength: 1
      required:
        - apiKey
    OauthTokenBody:
      type: object
      properties:
        oauthToken:
          type: string
          nullable: true
    GithubConnectTokenBody:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
        - token
    KanbanBoard:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        created_at:
          type: string
      required:
        - id
        - project_id
        - name
        - created_at
      description: A project kanban board (one per project).
    KanbanColumn:
      type: object
      properties:
        id:
          type: string
        board_id:
          type: string
        name:
          type: string
        position:
          type: integer
        color:
          type: string
          nullable: true
        created_at:
          type: string
      required:
        - id
        - board_id
        - name
        - position
        - color
        - created_at
      description: A column on a kanban board (To Do, In Progress, …).
    KanbanCard:
      type: object
      properties:
        id:
          type: string
        column_id:
          type: string
        board_id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum:
            - low
            - medium
            - high
            - urgent
        assignee:
          type: string
          nullable: true
        labels:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        github_issue_url:
          type: string
          nullable: true
        pr_url:
          type: string
          nullable: true
        review_status:
          type: string
          nullable: true
          enum:
            - awaiting_review
            - reviewing
            - approved
            - changes_requested
            - null
        created_by:
          type: string
          nullable: true
        position:
          type: integer
        epic_id:
          type: string
          nullable: true
        documented:
          type: integer
        dispatched_by_autonomous:
          type: integer
        assign_model:
          type: string
          nullable: true
        pr_base_branch:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - column_id
        - board_id
        - title
        - description
        - priority
        - assignee
        - labels
        - session_id
        - github_issue_url
        - pr_url
        - review_status
        - created_by
        - position
        - epic_id
        - documented
        - dispatched_by_autonomous
        - created_at
        - updated_at
      description: A kanban card (task / ticket).
    KanbanBlockerLink:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        column_id:
          type: string
        done:
          type: boolean
      required:
        - id
        - title
        - column_id
        - done
      description: A blocker / blocked-by relationship view. `done` is derived from the referenced card's column ("Done"-ish columns resolve the link).
    KanbanCardEnriched:
      allOf:
        - $ref: "#/components/schemas/KanbanCard"
        - type: object
          properties:
            blockers:
              type: array
              items:
                $ref: "#/components/schemas/KanbanBlockerLink"
            blocks:
              type: array
              items:
                $ref: "#/components/schemas/KanbanBlockerLink"
          required:
            - blockers
            - blocks
      description: A card with its blocker graph attached (used by GET /board).
    KanbanEpic:
      type: object
      properties:
        id:
          type: string
        board_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
        autonomous:
          type: integer
        autonomous_interval:
          type: integer
        autonomous_max_concurrent:
          type: integer
        autonomous_model:
          type: string
          nullable: true
        orchestration_budgets_json:
          type: string
          nullable: true
        pr_base_branch:
          type: string
          nullable: true
        position:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - board_id
        - name
        - description
        - color
        - autonomous
        - autonomous_interval
        - autonomous_max_concurrent
        - autonomous_model
        - position
        - created_at
        - updated_at
      description: A kanban epic — a group of related cards.
    KanbanCardComment:
      type: object
      properties:
        id:
          type: string
        card_id:
          type: string
        author:
          type: string
        content:
          type: string
        created_at:
          type: string
      required:
        - id
        - card_id
        - author
        - content
        - created_at
      description: A comment posted to a kanban card.
    BoardResponse:
      type: object
      properties:
        board:
          $ref: "#/components/schemas/KanbanBoard"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/KanbanColumn"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/KanbanCardEnriched"
        epics:
          type: array
          items:
            $ref: "#/components/schemas/KanbanEpic"
      required:
        - board
        - columns
        - cards
        - epics
      description: "Full board state: board metadata + columns + cards (with blocker graph) + epics."
    BoardErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: number
              message:
                type: string
            required:
              - path
              - message
        path:
          type: array
          items:
            type: string
      required:
        - error
      description: Error envelope. `details` is populated for 400 schema-validation errors; `path` is populated for the 409 cycle error from the blocker endpoint.
    WikiPage:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        category:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - project_id
        - title
        - slug
        - content
        - category
        - updated_by
        - created_at
        - updated_at
      description: A wiki page row (includes full content).
    WikiPageListItem:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - project_id
        - title
        - slug
        - category
        - updated_by
        - created_at
        - updated_at
      description: A wiki page list item (content omitted for payload size). Returned by `GET /wiki` bare and `?category=` paths.
    WikiSearchHit:
      allOf:
        - $ref: "#/components/schemas/WikiPageListItem"
        - type: object
          properties:
            snippet:
              type: string
            rank:
              type: number
      description: A wiki page returned from the legacy FTS5 search path (`GET /wiki?q=`). Adds the highlighted `snippet` and bm25-ish `rank`. Content is not included.
    WikiHybridSearchResult:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        score:
          type: number
        ftsScore:
          type: number
        semanticScore:
          type: number
        matchedChunk:
          type: string
        snippet:
          type: string
      required:
        - id
        - project_id
        - title
        - slug
        - category
        - updated_by
        - created_at
        - updated_at
        - score
      description: A hit from the hybrid/semantic/fts wiki search. `score` is the blended ranking; `ftsScore` / `semanticScore` are the per-mode components; `matchedChunk` is the highest-scoring chunk on the page (semantic / hybrid only).
    WikiSearchResponse:
      type: object
      properties:
        mode:
          type: string
          enum:
            - hybrid
            - semantic
            - fts
        query:
          type: string
        geminiConfigured:
          type: boolean
        results:
          type: array
          items:
            $ref: "#/components/schemas/WikiHybridSearchResult"
      required:
        - mode
        - geminiConfigured
        - results
      description: Envelope returned by `GET /wiki/search`. `geminiConfigured` reports whether the server has a Gemini API key (semantic + hybrid modes fall back to FTS when false).
    WikiBackfillResult:
      type: object
      properties:
        projectId:
          type: string
        total:
          type: integer
        embedded:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              pageId:
                type: string
              error:
                type: string
            required:
              - pageId
              - error
      required:
        - projectId
        - total
        - embedded
        - skipped
        - errors
      description: Result of a project-wide wiki re-embedding pass. `total` is the count of pages scanned; `embedded` increments per successfully chunk-and-embed; `skipped` counts pages skipped because the embed client could not be invoked; `errors` lists per-page failures.
    WikiErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: number
              message:
                type: string
            required:
              - path
              - message
      required:
        - error
      description: Error envelope. `details` is populated for 400 schema-validation errors with one entry per failing Zod issue.
  parameters: {}
paths:
  /api/auth/status:
    get:
      tags:
        - Auth
      summary: Public auth status (used by the login screen).
      responses:
        "200":
          description: Whether auth is configured and which secrets are present.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authConfigured:
                    type: boolean
                  username:
                    type: string
                    nullable: true
                  role:
                    type: string
                    nullable: true
                    enum:
                      - Owner
                      - Admin
                      - User
                      - null
                  jwtConfigured:
                    type: boolean
                  apiKeyConfigured:
                    type: boolean
                  needsMigration:
                    type: boolean
                  activeOrgIsLocal:
                    type: boolean
                required:
                  - authConfigured
                  - username
                  - role
                  - jwtConfigured
                  - apiKeyConfigured
                  - needsMigration
                  - activeOrgIsLocal
  /api/auth/setup:
    post:
      tags:
        - Auth
      summary: First-run setup — provisions the Owner user.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSetupBody"
      responses:
        "200":
          description: Setup succeeded; Owner token returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  token:
                    type: string
                  expiresAt:
                    type: string
                  user:
                    type: object
                    properties:
                      username:
                        type: string
                      role:
                        type: string
                        enum:
                          - Owner
                          - Admin
                          - User
                    required:
                      - username
                      - role
                required:
                  - ok
                  - token
                  - expiresAt
                  - user
        "400":
          description: Invalid body or domain validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZodErrorResponse"
        "409":
          description: Auth already configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Issue a JWT for an existing user.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginBody"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid body shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZodErrorResponse"
        "401":
          description: Wrong credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No membership in active org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Auth not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate-limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Identity of the currently authenticated caller.
      responses:
        "200":
          description: Caller summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    nullable: true
                    properties:
                      username:
                        type: string
                      role:
                        type: string
                        nullable: true
                        enum:
                          - Owner
                          - Admin
                          - User
                          - null
                    required:
                      - username
                      - role
                  authConfigured:
                    type: boolean
                  role:
                    type: string
                    nullable: true
                    enum:
                      - Owner
                      - Admin
                      - User
                      - null
                  orgId:
                    type: string
                    nullable: true
                required:
                  - user
                  - authConfigured
                  - role
                  - orgId
  /api/auth/me/claude-auth:
    get:
      tags:
        - Auth
      summary: Per-user Claude credentials (masked).
      responses:
        "200":
          description: Stored credentials with masking.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  nullable: true
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Auth
      summary: Update per-user Claude credentials.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClaudeAuthBody"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  nullable: true
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZodErrorResponse"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me/cursor-auth:
    get:
      tags:
        - Auth
      summary: Per-user cursor credentials (masked).
      responses:
        "200":
          description: Stored credentials with masking.
          content:
            application/json:
              schema:
                type: object
                properties:
                  engine:
                    type: string
                  apiKey:
                    type: string
                    nullable: true
                  updatedAt:
                    anyOf:
                      - type: string
                      - type: number
                      - nullable: true
                  hostConfigFallback:
                    type: object
                    properties:
                      apiKey:
                        type: boolean
                    required:
                      - apiKey
                required:
                  - engine
                  - apiKey
                  - hostConfigFallback
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Auth
      summary: Update per-user cursor credentials.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSingleKeyAuthBody"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  engine:
                    type: string
                  apiKey:
                    type: string
                    nullable: true
                  updatedAt:
                    anyOf:
                      - type: string
                      - type: number
                      - nullable: true
                  hostConfigFallback:
                    type: object
                    properties:
                      apiKey:
                        type: boolean
                    required:
                      - apiKey
                required:
                  - engine
                  - apiKey
                  - hostConfigFallback
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
