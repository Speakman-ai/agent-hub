        dispatched_by_autonomous:
          type: integer
        orphaned_at:
          type: string
          nullable: true
          description: Set when the card's working session was closed/archived but the card had already progressed (PR, finalize run, advanced column, comments, or epic), so it was kept and flagged rather than deleted as an abandoned stub. NULL for live cards.
        assign_model:
          type: string
          nullable: true
        assign_engine:
          type: string
          nullable: true
          description: Optional engine override pinned at assign / update time. One of "claude-code", "cursor-agent", "gemini-cli", or "codex-cli". Overrides the assignee agent's shared engine at session spawn.
