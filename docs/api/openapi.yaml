    post:
      tags:
        - Audit
      summary: Persist the user-chosen roster (and create custom agents)
      description: "Custom tracks (`custom: true`) get a freshly-created agent row id `<projectId>-<trackId>`. Idempotent: re-running with the same custom track refreshes label/role rather than colliding. AGENTS.md in the project workspace is rewritten between roster markers."
      parameters:
        - schema:
            type: string
            description: Project slug or id.
          required: true
          description: Project slug or id.
          name: projectId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tracks:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                      label:
                        type: string
                      agentId:
                        type: string
                        nullable: true
                      custom:
                        type: boolean
                      agentName:
                        type: string
                        maxLength: 80
                    required:
                      - id
                  minItems: 1
                  description: "Each track must have **either** a non-empty `agentId` XOR `custom: true` (not both, not neither)."
              required:
                - tracks
      responses:
        "200":
          description: Persisted roster. `tracks` echoes the resolved roster; `agents` lists the created/refreshed/bound agents so the client can hydrate display names without a follow-up `GET /api/agents`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tracks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        agentId:
                          type: string
                        custom:
                          type: boolean
                        agentName:
                          type: string
                      required:
                        - id
                        - label
                        - agentId
                        - custom
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        role:
                          type: string
                          nullable: true
                      required:
                        - id
                        - name
                  updatedAt:
                    type: string
                required:
                  - tracks
                  - agents
                  - updatedAt
        "400":
          description: Invalid payload (XOR violation, unknown agentId, agentName too long, etc.).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditErrorResponse"
