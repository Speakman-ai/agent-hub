        - Support
      summary: List support tickets across all projects, ordered by severity
      description: Aggregates every project’s support tickets into one severity-ordered list (critical → low, then newest). Optional `status`, `projectId`, and `unread` query filters compose and are applied server-side.
      parameters:
        - schema:
            type: string
            enum:
              - new
              - investigating
              - converted
              - closed
              - duplicate
              - wont_do
            description: Filter to a single lifecycle status.
          required: false
          description: Filter to a single lifecycle status.
          name: status
          in: query
        - schema:
            type: string
            description: Scope to a single project (404 if unknown).
          required: false
          description: Scope to a single project (404 if unknown).
          name: projectId
          in: query
        - schema:
            type: string
            enum:
              - "0"
              - "1"
              - "true"
              - "false"
            description: When `true`/`1`, keep only unread tickets (read_at IS NULL) — the dashboard "needs triage" view.
          required: false
          description: When `true`/`1`, keep only unread tickets (read_at IS NULL) — the dashboard "needs triage" view.
