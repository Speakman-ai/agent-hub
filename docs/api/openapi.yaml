  /api/projects/{projectId}/support-tickets/{id}/convert:
    post:
      tags:
        - Support
      summary: Convert a support ticket into a To Do kanban card
      description: Creates a To Do card from the ticket (title/description, severity→priority, support,<type> labels), then flags the source ticket `converted` and marks it read (it is retained, not deleted). Re-converting an already-converted ticket 409s rather than creating a duplicate card. An optional body carries an auto-merge preference and a note onto the new card.
      parameters:
        - schema:
            type: string
            description: Project slug or id.
          required: true
          description: Project slug or id.
          name: projectId
          in: path
        - schema:
            type: string
            description: Support ticket id.
          required: true
          description: Support ticket id.
          name: id
          in: path
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                autoMerge:
                  type: boolean
                  nullable: true
                  description: Per-card auto-merge preference to stamp on the new card. true → the card (and any session later assigned to it) defaults to "Auto Merge"; false → "Build and Push". Carried over to the board so the assign UI pre-populates the checkbox. Omit to leave the card with no explicit preference (project default).
                comment:
                  type: string
                  nullable: true
                  maxLength: 4000
                  description: Optional note (max 4000 characters) recorded as a comment on the new card (e.g. context for whoever picks it up).
              description: Optional auto-merge preference and note to attach to the new card.
      responses:
        "201":
          description: Ticket converted to a new card; the source ticket is retained as converted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertSupportTicketResponse"
        "404":
          description: Project or ticket not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketErrorResponse"
        "409":
          description: Support ticket already converted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketErrorResponse"
        "500":
          description: Board has no columns to place the card in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketErrorResponse"
