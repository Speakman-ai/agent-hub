      description: "Returns the full project record from `projects.json` plus the derived `webhookConfigured` flag the missing-webhook UI banner depends on. The response is a superset of the `Project` row shape — extra fields flow through via `passthrough()` while the schema-first migration is in progress. Visibility-filtered: private projects only resolve for their owner (and the local-bypass / Owner-via-admin paths); other callers see a 404."
