      description: Creates the hosted bare repo (importing from GitHub via repoUrl, from the project cwd, or empty), rewrites the project cwd origin to the hosted repo, and flips gitHost to agenthub. The import runs in the background — poll GET /git-host for progress. Requires Admin.
