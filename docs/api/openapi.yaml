      description: "Returns a short-lived single-use ticket the SPA appends to the preview iframe `src` as `?ticket=…`. Browsers cannot attach `Authorization: Bearer …` to an iframe top-level navigation, so this endpoint is the bridge between the SPA's JWT session and the preview proxy. The ticket is bound to (sessionId, caller) and ~60 s TTL; on first hit the proxy consumes the ticket and writes a path-scoped HttpOnly cookie so sub-resources (.js/.css/images) authenticate automatically."
      parameters:
        - schema:
            type: string
            description: Session UUID.
          required: true
          description: Session UUID.
          name: sessionId
          in: path
      responses:
        "200":
          description: Ticket minted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                    description: Single-use opaque token (prefixed `ahpt_`). Append as `?ticket=…`.
                  ttlSeconds:
                    type: integer
                    description: Seconds the ticket remains valid before it must be re-minted.
                required:
                  - ticket
                  - ttlSeconds
        "404":
          description: Session not found or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionErrorResponse"
  /api/sessions/{sessionId}/preview/stop:
