openapi: 3.0.3
info:
  title: Agent Hub REST API
  version: 2.27.5
  description: |-
    REST API for **Agent Hub** — a full-stack platform for managing AI
    agent sessions, kanban boards, per-project wikis, heartbeats, and
    cron jobs.

    ### Authentication
    Most endpoints require one of:
    - A session cookie issued by `POST /api/auth/login`.
    - A user-owned API key minted via `POST /api/auth/keys`, sent as
      `Authorization: Bearer ahub_…` or `X-API-Key: ahub_…`.
    - The break-glass instance API key (`X-API-Key`), set via
      `~/.agent-hub/data/config.json` `apiKey`. Treated as Owner across
      every org — use only for automation / sub-agent spawn.

    ### Realtime
    Live updates (chat streaming, kanban / wiki events, cron output)
    are delivered over WebSocket on the same port as HTTP. This
    document covers the REST surface only.
  contact:
    name: Agent Hub
    url: https://github.com/Speakman-ai/agent-hub
  license:
    name: Proprietary
servers:
  - url: http://localhost:3051
    description: Local development server
  - url: https://hub.example.com
    description: Self-hosted production deployment (operator-defined)
security:
  - bearerAuth: []
  - apiKeyHeader: []
  - cookieAuth: []
tags:
  - name: Health
    description: Liveness and runtime info.
  - name: Auth
    description: Sign-in, API keys, per-user credential management.
  - name: Projects
    description: Project CRUD and metadata.
  - name: Agents
    description: Agent configuration under a project.
  - name: Sessions
    description: Chat sessions and message history.
  - name: Board
    description: Per-project kanban boards (columns, cards, epics, comments).
  - name: Wiki
    description: Per-project wiki with FTS5 + semantic search.
  - name: Heartbeats
    description: Per-agent scheduled check-ins.
  - name: Crons
    description: Project-scoped automated jobs.
  - name: Admin
    description: Owner-only administrative endpoints.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ahub_...
      description: "User-owned API key minted via `POST /api/auth/keys`. Send as `Authorization: Bearer ahub_...`."
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: Either a per-user `ahub_*` key or the break-glass instance API key from `~/.agent-hub/data/config.json` (`apiKey`).
    cookieAuth:
      type: apiKey
      in: cookie
      name: agent_hub_session
      description: Session cookie issued by `POST /api/auth/login`.
  schemas:
    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        engine:
          type: string
        model:
          type: string
        systemPrompt:
          type: string
        color:
          type: string
        avatar:
          type: string
        role:
          type: string
        reviewer:
          type: string
        canReview:
          type: boolean
        isDev:
          type: boolean
          description: Whether this agent accepts autonomously-dispatched kanban tickets. Default Dev roles (dev/lead) are always eligible and out-of-band roles (docs/intake/reviewer) never are, regardless of this field; for other agents an explicit `false` opts out and `undefined` preserves pre-flag eligibility.
        active:
          type: boolean
        delegationEnabled:
          type: boolean
        browserToolsEnabled:
          type: boolean
        browserViewportWidth:
          type: integer
        browserViewportHeight:
          type: integer
        browserPageLoadTimeoutMs:
          type: integer
        heartbeat:
          type: object
          properties:
            enabled:
              type: boolean
            interval:
              type: string
            prompt:
              type: string
          required:
            - enabled
            - interval
            - prompt
      required:
        - id
        - name
        - engine
      description: An agent. Many additional optional fields exist on the row (subAgents, hooks, mcpServers, …) — only the stable, documented surface is enumerated here.
    AgentEnriched:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          properties:
            lastActivity:
              type: string
              nullable: true
            lastMessage:
              type: object
              nullable: true
              properties:
                role:
                  type: string
                content:
                  type: string
                created_at:
                  type: string
              required:
                - role
                - content
                - created_at
      description: Agent shape + the most-recent session timestamp and a truncated last message.
    AgentsBulkEngineResponse:
      type: object
      properties:
        updated:
          type: integer
        engine:
          type: string
        model:
          type: string
      required:
        - updated
        - engine
        - model
      description: Result of POST /api/agents/bulk-engine.
    AgentErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: number
              message:
                type: string
            required:
              - path
              - message
      required:
        - error
      description: Error envelope. `details` is populated for 400 schema-validation errors with one entry per failing Zod issue.
    Artifact:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        filename:
          type: string
        contentType:
          type: string
        size:
          type: integer
        storageKind:
          type: string
          enum:
            - local
            - s3
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
        url:
          type: string
          description: Relative URL to download/view the artifact bytes.
      required:
        - id
        - sessionId
        - filename
        - contentType
        - size
        - storageKind
        - createdBy
        - createdAt
        - url
      description: Metadata for one session artifact.
    ArtifactList:
      type: object
      properties:
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
      required:
        - artifacts
      description: All artifacts generated in a session, newest first.
    ArtifactErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Error envelope.
    AuditErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: number
              message:
                type: string
            required:
              - path
              - message
      required:
        - error
      description: Error envelope for audit/roster routes.
    AuditReport:
      type: object
      properties: {}
      additionalProperties:
        nullable: true
      description: Post-scaffold audit report. Concrete shape lives in `server/audit/audit-service.ts`.
    TrackSuggestion:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        agentId:
          type: string
          nullable: true
        score:
          type: number
      required:
        - id
        - label
        - agentId
      additionalProperties:
        nullable: true
      description: Keyword-matched track → agent suggestion.
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
      required:
        - error
      description: Standard error envelope used across the API.
    ZodIssue:
      type: object
      properties:
        path:
          type: array
          items:
            anyOf:
              - type: string
              - type: number
        message:
          type: string
        code:
          type: string
      required:
        - path
        - message
      description: A single Zod validation issue. Returned on 400 responses caused by request-body shape errors.
    ZodErrorResponse:
      type: object
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ZodIssue"
      required:
        - error
      description: A 400 response produced by Zod body/query validation. `issues` lists each field that failed.
    UserSummary:
      type: object
      properties:
        id:
          type: string
          nullable: true
        username:
          type: string
        role:
          type: string
          enum:
            - Owner
            - Admin
            - User
        createdAt:
          anyOf:
            - type: string
            - type: number
            - nullable: true
      required:
        - username
        - role
    TokenResponse:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            role:
              type: string
              enum:
                - Owner
                - Admin
                - User
          required:
            - username
            - role
      required:
        - token
        - expiresAt
        - user
    AuthSetupBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    AuthLoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    AuthCreateUserBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum:
            - Owner
            - Admin
            - User
      required:
        - username
        - password
    AuthUpdateUserRoleBody:
      type: object
      properties:
        role:
          type: string
          enum:
            - Owner
            - Admin
            - User
      required:
        - role
    AuthPasswordResetBody:
      type: object
      properties:
        newPassword:
          type: string
      required:
        - newPassword
    CreateApiKeyBody:
      type: object
      properties:
        name:
          type: string
        expiresInDays:
          anyOf:
            - type: number
            - type: string
            - nullable: true
          description: 1–3650 days, or null/omitted to never expire. Strings are coerced to numbers.
      required:
        - name
    CreateInviteBody:
      type: object
      properties:
        role:
          type: string
          enum:
            - Owner
            - Admin
            - User
        email:
          type: string
          nullable: true
        ttlHours:
          type: number
    AcceptInviteBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    UpdateClaudeAuthBody:
      type: object
      properties:
        anthropicApiKey:
          type: string
          nullable: true
        claudeCodeOAuthToken:
          type: string
          nullable: true
        claudeCodeOAuthExpiresAt:
          type: string
          nullable: true
      description: Per-user Claude credentials. Each field is whitelisted before reaching the DB — unknown keys are silently dropped.
    UpdateSingleKeyAuthBody:
      type: object
      properties:
        apiKey:
          type: string
          nullable: true
      description: Per-user single-key engine credentials (Cursor / Gemini / Codex).
    UpsertSkillCredentialBody:
      type: object
      properties:
        skill_id:
          type: string
        key_name:
          type: string
        agent_id:
          type: string
        value:
          type: string
      required:
        - skill_id
        - key_name
      description: "Upsert a per-user skill credential. `agent_id` is optional: omit it when setting a personal credential for a bundled default skill from the Account page."
    AgentEngineOverrideEntry:
      type: object
      properties:
        engine:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
      required:
        - engine
      description: A per-agent engine override on the caller. The optional `model` further pins a specific CLI model id within that engine; when omitted the per-engine default (or hub fallback) is used.
    PutAgentEngineOverridesBody:
      type: object
      properties:
        agentEngineOverrides:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AgentEngineOverrideEntry"
      required:
        - agentEngineOverrides
    PutAgentModelOverridesBody:
      type: object
      properties:
        agentModelOverrides:
          type: object
          additionalProperties:
            type: string
      required:
        - agentModelOverrides
      description: 'Caller-scoped map of agentId → model id — the per-user "default model" picked from the agent / reviewer model dropdown. Pass `{ agentModelOverrides: {} }` to clear. Each model must be valid for some configured engine; pass an empty string to drop a single agent entry.'
    PutAgentModelOverrideEntryBody:
      type: object
      properties:
        model:
          type: string
          minLength: 1
      required:
        - model
      description: Set the caller's per-user default model for a single agent (path `:agentId`). Merges server-side, so it never disturbs other agents' picks or another tab's concurrent edit. Use DELETE on the same path to clear.
    ClaudeLoginBody:
      type: object
      properties:
        method:
          type: string
        email:
          type: string
        sso:
          type: boolean
    ClaudeCallbackBody:
      type: object
      properties:
        code:
          type: string
          description: OAuth authorization code from Anthropic.
      required:
        - code
    ApiKeyOnlyBody:
      type: object
      properties:
        apiKey:
          type: string
          nullable: true
    ApiKeyRequiredBody:
      type: object
      properties:
        apiKey:
          type: string
          minLength: 1
      required:
        - apiKey
    OauthTokenBody:
      type: object
      properties:
        oauthToken:
          type: string
          nullable: true
    GithubConnectTokenBody:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
        - token
    ReviewerThread:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        file_path:
          type: string
        line_start:
          type: integer
          nullable: true
        line_end:
          type: integer
          nullable: true
        body:
          type: string
        author:
          type: string
        created_at:
          type: integer
      required:
        - id
        - run_id
        - file_path
        - line_start
        - line_end
        - body
        - author
        - created_at
      description: One diff-anchored finding produced by the cold-eye reviewer agent during the review phase of a Finalize run.
    ReviewerThreadsResponse:
      type: object
      properties:
        run_id:
          type: string
        reviewer_verdict:
          type: string
          nullable: true
          enum:
            - approved
            - changes_requested
            - null
          description: Reviewer verdict for the run (`approved` / `changes_requested`); `null` while the review phase is still pending.
        threads:
          type: array
          items:
            $ref: "#/components/schemas/ReviewerThread"
      required:
        - run_id
        - reviewer_verdict
        - threads
      description: All reviewer threads for a finalize run, ordered by `file_path ASC, line_start ASC, created_at ASC` so the side-panel can group by file without re-sorting.
    FinalizeRun:
      type: object
      properties:
        id:
          type: string
        card_id:
          type: string
        session_id:
          type: string
          nullable: true
        project_id:
          type: string
        branch:
          type: string
        head_sha:
          type: string
        idempotency_key:
          type: string
        status:
          type: string
          enum:
            - queued
            - rebasing
            - reviewing
            - running
            - dispatching
            - pushing
            - ready_to_push
            - pushed
            - failed
            - timed_out
            - infra_error
            - cancelled
            - stalled_no_response
        phase:
          type: string
          nullable: true
          enum:
            - rebase
            - review
            - tasks
            - dispatching
            - push
            - null
        trigger_source:
          type: string
          enum:
            - ui_button
            - agent_block
        worktree_path:
          type: string
          nullable: true
        triggered_by_user_id:
          type: string
        author_name:
          type: string
        author_email:
          type: string
        reviewer_verdict:
          type: string
          nullable: true
          enum:
            - approved
            - changes_requested
            - null
        failure_reason:
          type: string
          nullable: true
        failed_step_index:
          type: integer
          nullable: true
        failed_step_name:
          type: string
          nullable: true
        failed_step_exit_code:
          type: integer
          nullable: true
        retry_of_run_id:
          type: string
          nullable: true
        active_seconds_consumed:
          type: integer
        started_at:
          type: integer
        ended_at:
          type: integer
          nullable: true
        pr_url:
          type: string
          nullable: true
      required:
        - id
        - card_id
        - session_id
        - project_id
        - branch
        - head_sha
        - idempotency_key
        - status
        - phase
        - trigger_source
        - worktree_path
        - triggered_by_user_id
        - author_name
        - author_email
        - reviewer_verdict
        - failure_reason
        - failed_step_index
        - failed_step_name
        - failed_step_exit_code
        - retry_of_run_id
        - active_seconds_consumed
        - started_at
        - ended_at
        - pr_url
      description: A single finalize_runs row.
    FinalizeRunStep:
      type: object
      properties:
        index:
          type: integer
        name:
          type: string
        state:
          type: string
          enum:
            - queued
            - running
            - passed
            - failed
            - skipped
        exitCode:
          type: integer
          nullable: true
        startedAt:
          type: integer
          nullable: true
        endedAt:
          type: integer
          nullable: true
      required:
        - index
        - name
        - state
        - exitCode
        - startedAt
        - endedAt
      description: One CI step row from a Finalize run.
    FinalizePhaseSummary:
      type: object
      properties:
        run_id:
          type: string
        status:
          type: string
        mode:
          type: string
          enum:
            - full
            - checks
            - review
        head_sha:
          type: string
        validated_head_sha:
          type: string
          nullable: true
        ended_at:
          type: integer
          nullable: true
      required:
        - run_id
        - status
        - mode
        - head_sha
        - validated_head_sha
        - ended_at
      description: Done-state for one Finalize phase (checks or review). Resolved from the latest run that exercised that phase — either a phase-scoped run or a combined `full` run.
    LatestFinalizeRunForSessionResponse:
      type: object
      properties:
        run:
          allOf:
            - $ref: "#/components/schemas/FinalizeRun"
            - nullable: true
              description: "`null` when the session has never triggered a Finalize run."
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FinalizeRunStep"
          description: Persisted CI step states for the latest run; empty when no run.
        currentHeadSha:
          type: string
          nullable: true
          description: The session worktree's live `git rev-parse HEAD` at request time, or `null` when the worktree is missing or HEAD could not be resolved.
        stale:
          type: boolean
          description: True when the latest run's `head_sha` no longer matches the worktree's current HEAD — i.e. the agent committed new work after this run finished, so the run's results predate the current code. Clients (and `finalize.sh latest`) should surface this and trigger a fresh run rather than acting on the stale results. Fail-safe `false` when HEAD cannot be resolved.
        phases:
          type: object
          properties:
            checks:
              allOf:
                - $ref: "#/components/schemas/FinalizePhaseSummary"
                - nullable: true
            review:
              allOf:
                - $ref: "#/components/schemas/FinalizePhaseSummary"
                - nullable: true
          required:
            - checks
            - review
          description: Independent per-phase done-state powering the split "Run Tests" / "Reviewer" buttons. Each is `null` until that phase has run for the session.
      required:
        - run
        - steps
        - currentHeadSha
        - stale
        - phases
      description: Latest Finalize run for a given session.
    FinalizeErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Error envelope for finalize routes.
    StartFinalizeRunRequest:
      type: object
      properties:
        mode:
          type: string
          enum:
            - full
            - checks
            - review
          description: Which phases to run. `full` (default — the one Finalize button) = rebase + reviewer + checks. `checks` / `review` are legacy single-phase modes retained for back-compat and automation; the UI only sends `full`. Folded into the idempotency key so historical single-phase rows keep their own keys.
      description: Optional `mode` selects which phases run (defaults to `full`). The rest of the run is keyed off the card, its linked session, and the resolved HEAD SHA.
    StartFinalizeRunResponse:
      type: object
      properties:
        run_id:
          type: string
          nullable: true
          description: The `finalize_runs.id` for this run. `null` only when the run started but the row was not visible within the synchronous poll window (the 202 fallback).
        status:
          type: string
          enum:
            - queued
            - rebasing
            - reviewing
            - running
            - dispatching
            - pushing
            - ready_to_push
            - pushed
            - failed
            - timed_out
            - infra_error
            - cancelled
            - stalled_no_response
          description: Status of the run at response time — `queued` for fresh starts.
        reused:
          type: boolean
          description: True when the idempotency key matched an existing terminal row and that row was returned as-is.
      required:
        - run_id
        - status
        - reused
      description: A new or reused Finalize run.
    StartFinalizeRunPending:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
          description: Acknowledgement marker for the 202 fallback envelope.
        run_id:
          nullable: true
          description: Always `null` on the 202 path — the row was not visible within the synchronous poll window. Clients fall back to the WS event stream or `GET /api/sessions/:sessionId/finalize-runs/latest` to discover the id.
        status:
          type: string
          enum:
            - queued
          description: Always `queued` on the 202 path.
        message:
          type: string
          description: Human-readable note explaining the fallback.
      required:
        - ok
        - run_id
        - status
        - message
      description: Fallback envelope returned when the orchestrator fired but the row insert was not visible within ~300ms. Distinct shape from `StartFinalizeRunResponse` so OpenAPI clients can branch on it.
    StartFinalizeRunInFlight:
      type: object
      properties:
        error:
          type: string
          enum:
            - in_flight
        run_id:
          type: string
        status:
          type: string
          enum:
            - queued
            - rebasing
            - reviewing
            - running
            - dispatching
            - pushing
            - ready_to_push
            - pushed
            - failed
            - timed_out
            - infra_error
            - cancelled
            - stalled_no_response
        message:
          type: string
      required:
        - error
        - run_id
        - status
        - message
      description: Conflict envelope returned when a non-terminal Finalize run already exists for the same (project, branch, head_sha).
    CancelFinalizeRunRequest:
      type: object
      properties: {}
      description: Body is empty.
    PushFinalizeRunRequest:
      type: object
      properties:
        force:
          type: boolean
          description: Operator override — push even when gates have not passed.
      description: Optional push overrides.
    FinalizeStepOutputLine:
      type: object
      properties:
        stream:
          type: string
          enum:
            - stdout
            - stderr
        text:
          type: string
        created_at:
          type: string
      required:
        - stream
        - text
        - created_at
    FinalizeStepOutputResponse:
      type: object
      properties:
        run_id:
          type: string
        step_index:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/FinalizeStepOutputLine"
        truncated:
          type: boolean
        total_lines:
          type: integer
      required:
        - run_id
        - step_index
        - lines
    CancelFinalizeRunResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
        status:
          type: string
          enum:
            - cancelled
      required:
        - ok
        - status
      description: Cancellation confirmation.
    CancelFinalizeRunTerminal:
      type: object
      properties:
        error:
          type: string
          enum:
            - terminal
        status:
          type: string
          enum:
            - queued
            - rebasing
            - reviewing
            - running
            - dispatching
            - pushing
            - ready_to_push
            - pushed
            - failed
            - timed_out
            - infra_error
            - cancelled
            - stalled_no_response
        message:
          type: string
      required:
        - error
        - status
        - message
      description: Conflict envelope returned when the run is already in a terminal state.
    FinalizeMetricHistogramSummary:
      type: object
      properties:
        count:
