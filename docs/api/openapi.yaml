      summary: Root README of an Agent Hub-hosted repo branch
      description: "Returns the root-level README (path + raw markdown content) of the given branch, defaulting to the default branch. `readme` is null when the repo has no root README. Repository-page surface; 404 unless gitHost: agenthub. Content is capped at 512 KiB."
