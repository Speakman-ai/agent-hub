  /api/projects/{projectId}/security-audit/scan:
    post:
      tags:
        - Projects
      summary: Run a dependency security scan now
      description: "Scans the Hub-hosted repo (default branch unless `ref` is given): parses npm lockfiles, queries the OSV advisory database, persists findings with de-dupe, and opens a kanban card for genuinely new findings. Persistence is restricted to the default-branch tip — scanning any other `ref` is a read-only dry run (`dryRun: true`, nothing written). Requires gitHost: agenthub and the Admin role."
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ref:
                  type: string
                  minLength: 1
                  description: Branch/commit. Defaults to default branch.
                generateCard:
                  type: boolean
                  description: Open a card for new findings (default true).
                autoPr:
                  type: boolean
                  description: "Force-open Dependabot-style bump PRs for fixable findings, even when the project has not set securityAutoPr.enabled. An explicit Autofix click is its own opt-in. Still requires gitHost: agenthub and a wired native PR service; ignored otherwise."
              additionalProperties: false
      responses:
        "200":
          description: Scan summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ref:
                    type: string
                  dryRun:
                    type: boolean
                    description: "True when the scanned ref is not the default-branch tip: the scan ran for visibility but persisted nothing (no findings, no sweep, no card). new/updated/fixed/suppressed/cardId are all empty in this case."
                  scannedManifests:
                    type: array
                    items:
                      type: string
                  failedManifests:
                    type: array
                    items:
                      type: string
                    description: Lockfiles matched but unreadable/unparsable this scan (findings preserved).
                  truncated:
                    type: boolean
                    description: True when more lockfiles existed than the per-scan cap; overflow not scanned.
                  dependencyCount:
                    type: number
                  vulnerableFindings:
                    type: number
                    description: Vulnerable dependency occurrences detected this scan (persisted or not).
                  newFindings:
                    type: number
                  reopened:
                    type: number
                    description: Previously-fixed findings that reappeared this scan (regressions).
                  updated:
                    type: number
                  fixed:
                    type: number
                  suppressed:
                    type: number
                  cardId:
                    type: string
                    nullable: true
                  autoPr:
                    type: object
                    nullable: true
                    properties:
                      opened:
                        type: array
                        items:
                          type: object
                          properties:
                            branch:
                              type: string
                            manifestPath:
                              type: string
                            packageName:
                              type: string
                            fromVersions:
                              type: array
                              items:
                                type: string
                            toVersion:
                              type: string
                            advisoryIds:
                              type: array
                              items:
                                type: string
                            severity:
                              type: string
                              enum:
                                - critical
                                - high
                                - medium
                                - low
                                - unknown
                            prNumber:
                              type: number
                            prUrl:
                              type: string
                            prCreated:
                              type: boolean
                            branchUpdated:
                              type: boolean
                          required:
                            - branch
                            - manifestPath
                            - packageName
                            - fromVersions
                            - toVersion
                            - advisoryIds
                            - severity
                            - prNumber
                            - prUrl
                            - prCreated
                            - branchUpdated
                      skipped:
                        type: array
                        items:
                          type: object
                          properties:
                            manifestPath:
                              type: string
                            packageName:
                              type: string
                            toVersion:
                              type: string
                            reason:
                              type: string
                              enum:
                                - lockfile_missing
                                - lockfile_unchanged
                                - error
                            detail:
                              type: string
                          required:
                            - manifestPath
                            - packageName
                            - toVersion
                            - reason
                    required:
                      - opened
                      - skipped
                    description: "Auto-PR generation result when the project opted in (securityAutoPr.enabled) and the repo is Hub-hosted: native bump PRs opened/refreshed and bumps skipped (with reason). null when auto-PR was not requested or this was a dry run."
                required:
                  - ref
                  - dryRun
                  - scannedManifests
                  - failedManifests
                  - truncated
                  - dependencyCount
                  - vulnerableFindings
                  - newFindings
                  - reopened
                  - updated
                  - fixed
                  - suppressed
                  - cardId
                  - autoPr
        "400":
          description: Invalid request body, or the requested ref does not resolve.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "403":
          description: Caller lacks the Admin role.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "404":
          description: Unknown project.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "409":
          description: Project is not Hub-hosted or repo is empty.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "500":
          description: Scan failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
