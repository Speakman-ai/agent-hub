            schema:
              type: object
              properties:
                minSeverity:
                  type: string
                  enum:
                    - critical
                    - high
                    - medium
                    - low
                  description: "Only fix findings at or above this severity (threshold, not exact): `high` fixes critical AND high. Omit to fix every fixable finding regardless of severity."
              additionalProperties: false
      responses:
        "200":
          description: Bump PR opened/refreshed, or skips with reasons (empty when nothing matched).
          content:
            application/json:
              schema:
                type: object
                properties:
                  opened:
                    type: array
                    items:
                      type: object
                      properties:
                        branch:
                          type: string
                        manifestPath:
                          type: string
                        packageName:
                          type: string
                        fromVersions:
                          type: array
                          items:
                            type: string
                        toVersion:
                          type: string
                        advisoryIds:
                          type: array
                          items:
                            type: string
                        severity:
                          type: string
                          enum:
                            - critical
                            - high
                            - medium
                            - low
                            - unknown
                        prNumber:
                          type: number
                        prUrl:
                          type: string
                        prCreated:
                          type: boolean
                        branchUpdated:
                          type: boolean
                      required:
                        - branch
                        - manifestPath
                        - packageName
                        - fromVersions
                        - toVersion
                        - advisoryIds
                        - severity
                        - prNumber
                        - prUrl
                        - prCreated
                        - branchUpdated
