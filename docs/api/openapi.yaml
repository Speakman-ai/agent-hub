  /api/projects/{projectId}/finalize/environment-draft:
    get:
      tags:
        - Finalize
      summary: Scan project for Finalize ci.yaml setup signals
      description: Admin+. Returns the same draft shape embedded in the setup wizard kickoff (stack, workflows, env vars, proposed ci.yaml). Used by Settings → Finalize to show required secrets without spawning a wizard session.
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
      responses:
        "200":
          description: Draft scan result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft:
                    $ref: "#/components/schemas/FinalizeSetupDraft"
                  projectId:
                    type: string
                required:
                  - draft
                  - projectId
        "400":
          description: Project has no cwd configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeWizardErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeWizardErrorResponse"
  /api/projects/{projectId}/finalize/setup-wizard:
    post:
      tags:
        - Finalize
      summary: Spawn the Finalize ci.yaml setup wizard
      description: |-
        Admin+. Scans the project (README, package manifests, .github/workflows,
        Makefile, package.json scripts) and spawns a **worktree-backed** chat
        session (`use_worktree=1`) loaded with the `finalize-setup` skill. The
        session provisions its own git clone on a fresh `agent-hub/…` branch so
        the agent can author `.agent-hub/ci.yaml`, verify the pipeline locally,
        push, and open a PR. The pre-built `proposedCiYaml` is embedded in the
        kickoff prompt.
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
              description: Body is empty.
      responses:
        "201":
          description: Wizard session spawned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeWizardStartResponse"
        "400":
          description: Project has no cwd configured, or no agents to host the wizard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeWizardErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeWizardErrorResponse"
        "500":
          description: Wizard agent could not be resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeWizardErrorResponse"
  /api/projects/{projectId}/finalize/setup-apply:
    post:
      tags:
        - Finalize
      summary: Commit a wizard-generated ci.yaml to the worktree
      description: |-
        Admin+. Validates `ci_yaml_content` against the v1/v2 schema, writes
        `<worktree>/.agent-hub/ci.yaml`, and commits the file to the worktree
        branch. Target resolution order: (1) request body's `session_id` when
        supplied (the setup wizard passes its own id), (2) the most-recent
        project session that has a worktree, (3) auto-provision a dedicated
        `[Finalize Config]` session + worktree when none exists.
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeSetupApplyRequest"
      responses:
        "200":
          description: Committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeSetupApplyResponse"
        "400":
          description: "Payload invalid: missing content, invalid v1 schema, no worktree-bearing session found, or worktree path is unreadable."
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/FinalizeWizardErrorResponse"
                  - $ref: "#/components/schemas/FinalizeSetupApplyInvalidConfig"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeWizardErrorResponse"
        "500":
          description: Write or commit failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeWizardErrorResponse"
  /api/projects/{projectId}/finalize/wizard-complete:
    post:
      tags:
        - Finalize
      summary: Notify the UI that the Finalize wizard has finished
      description: User+. Broadcasts `finalize_wizard_complete` for the Settings panel so it can refresh state.
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
