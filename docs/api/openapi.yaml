  /api/projects/{projectId}/wiki:
    get:
      tags:
        - Wiki
      summary: List wiki pages (optionally filtered or FTS-searched)
      description: When `?q=` is set, returns FTS5 hits (`WikiSearchHit[]` — list-item fields + `snippet` + `rank`, no `content`). When `?category=` is set, returns pages in that category (`WikiPageListItem[]`, no `content`). Otherwise returns every page in the project (`WikiPageListItem[]`, no `content`). `limit` only applies to the `?q=` path; the bare and category responses are unpaginated. Invalid `?limit=` values (non-numeric) and other schema violations return 400.
      parameters:
        - schema:
            type: string
            description: Project ID (slug).
          required: true
          description: Project ID (slug).
          name: projectId
          in: path
        - schema:
            type: string
          required: false
          name: q
          in: query
        - schema:
            type: string
          required: false
          name: category
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Wiki pages (shape depends on the query params — see description).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WikiPageListItem"
        "400":
          description: Query parameter validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
    post:
      tags:
        - Wiki
      summary: Create a wiki page
      description: Slug is derived from `title` via lowercase + non-alphanumeric squash. Returns 409 when the resulting slug collides with an existing page on the same project.
      parameters:
        - schema:
            type: string
            description: Project ID (slug).
          required: true
          description: Project ID (slug).
          name: projectId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                content:
                  type: string
                category:
                  type: string
                updatedBy:
                  type: string
              required:
                - title
      responses:
        "201":
          description: New page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiPage"
        "400":
          description: Validation failed.
