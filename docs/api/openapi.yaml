                      finishedAt:
                        type: number
                      error:
                        type: string
                      importedFrom:
                        type: string
                        enum:
                          - github
                          - cwd
                          - empty
                    required:
                      - status
                      - startedAt
                  mirror:
                    type: object
                    nullable: true
                    properties:
                      enabled:
                        type: boolean
                      refs:
                        type: string
                        enum:
