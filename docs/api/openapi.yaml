      description: Error envelope. `details` is populated for 400 schema-validation errors; `path` is populated for the 409 cycle error from the blocker endpoint.
    Session:
      type: object
      properties:
        id:
          type: string
        agent_id:
          type: string
        name:
          type: string
        engine:
          type: string
        checkpoint_rewind_supported:
          type: boolean
          description: "True when the session engine supports Claude Code checkpoint file rewind (`POST /api/sessions/{sessionId}/rewind`). Today only `claude-code`. Other engines return HTTP 400 with `code: checkpoint_rewind_unsupported_engine` from that endpoint."
        model:
          type: string
        use_worktree:
          type: integer
        ask_mode:
          type: integer
        react_loop_enabled:
          type: integer
          nullable: true
        session_mode:
          type: string
          nullable: true
          enum:
            - chat
            - design
            - scoping
            - null
          description: "Session mode picker dimension: `chat` (default), `design`, or `scoping`. NULL/absent on legacy rows → treated as `chat`. `design` loads the design skill; `scoping` loads kanban planning with a live epic flowchart panel. Set via `PATCH /api/sessions/{sessionId}` or `PUT .../mode`."
        reasoning_effort:
          type: string
          nullable: true
          enum:
            - high
            - pro
            - null
          description: 'Codex reasoning ("thinking") preset: `high` (default) or `pro` (→ xhigh). NULL/absent on legacy rows and non-Codex sessions; treated as `high`.'
        worktree_path:
          type: string
          nullable: true
        worktree_branch:
          type: string
          nullable: true
        engine_session_id:
          type: string
          nullable: true
        cron_id:
          type: integer
          nullable: true
        deleted_at:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        owner_user_id:
          type: string
          nullable: true
        orchestration_phase:
          type: string
          nullable: true
        orchestration_meta:
          type: string
          nullable: true
        max_turns:
          type: integer
        linked_design_id:
          type: string
          nullable: true
          description: Optional Design Studio design id linked to this session. When set, the web client renders the design's live canvas in a preview pane beside the chat. Set/cleared via `PUT /api/sessions/{sessionId}/linked-design`. Not a foreign key — a stale id (design since deleted) is tolerated and ignored at render time.
        linked_epic_id:
          type: string
          nullable: true
          description: Epic linked for scoping mode. When `session_mode` is `scoping`, the web client renders a live Epic → Phase → Ticket flowchart for this epic. Set/cleared via `PUT /api/sessions/{sessionId}/linked-epic`.
        state:
          type: string
          enum:
            - waiting_for_user_input
            - working
            - running_tests
            - reviewing
            - pending_checks
            - pending_push
            - pushed
            - merged
          description: Always-on lifecycle state of the session — exactly one value, surfaced as a single status icon in the clients. Resolved server-side at read time from active-task / Finalize-run / Done-column signals (see `server/session-state.ts`) and present on enriched session payloads (list, detail, `session_created`). The server also backfills the persisted `sessions.state` cache and emits a dedicated `session_state` WebSocket push at production signal boundaries (chat turn start/end, linked-card auto-close, kanban move to Done). Clients keep Finalize phases live from `finalize_run_phase_changed` and use `session_state` for persisted seed / terminal updates such as `merged`.
        agents:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              color:
                type: string
              position:
                type: integer
              role:
                type: string
                enum:
                  - executor
                  - advisor
              projectId:
                type: string
              projectName:
                type: string
            required:
              - id
              - name
              - color
              - position
              - role
        advisor_count:
          type: integer
      required:
        - id
        - agent_id
        - name
        - engine
        - checkpoint_rewind_supported
        - model
        - use_worktree
        - ask_mode
        - created_at
        - updated_at
      description: A chat session row. Booleans are stored as 0/1 SQLite ints for `use_worktree`, `ask_mode`, `react_loop_enabled`. `use_worktree` is always 1 for user-created sessions; the column is preserved for legacy rows and internal shared-checkout callers.
