    WikiPage:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        category:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - project_id
        - title
        - slug
        - content
        - category
        - updated_by
        - created_at
        - updated_at
      description: A wiki page row (includes full content).
    WikiPageListItem:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - project_id
        - title
        - slug
        - category
        - updated_by
        - created_at
        - updated_at
      description: A wiki page list item (content omitted for payload size). Returned by `GET /wiki` bare and `?category=` paths.
    WikiSearchHit:
      allOf:
        - $ref: "#/components/schemas/WikiPageListItem"
        - type: object
          properties:
            snippet:
              type: string
            rank:
              type: number
      description: A wiki page returned from the legacy FTS5 search path (`GET /wiki?q=`). Adds the highlighted `snippet` and bm25-ish `rank`. Content is not included.
    WikiHybridSearchResult:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        score:
          type: number
        ftsScore:
          type: number
        semanticScore:
          type: number
        matchedChunk:
          type: string
        snippet:
          type: string
      required:
        - id
        - project_id
        - title
        - slug
        - category
        - updated_by
        - created_at
        - updated_at
        - score
      description: A hit from the hybrid/semantic/fts wiki search. `score` is the blended ranking; `ftsScore` / `semanticScore` are the per-mode components; `matchedChunk` is the highest-scoring chunk on the page (semantic / hybrid only).
    WikiSearchResponse:
      type: object
      properties:
        mode:
          type: string
          enum:
            - hybrid
            - semantic
            - fts
        query:
          type: string
        geminiConfigured:
          type: boolean
        results:
          type: array
          items:
            $ref: "#/components/schemas/WikiHybridSearchResult"
      required:
        - mode
        - geminiConfigured
        - results
      description: Envelope returned by `GET /wiki/search`. `geminiConfigured` reports whether the server has a Gemini API key (semantic + hybrid modes fall back to FTS when false).
    WikiBackfillResult:
      type: object
      properties:
        projectId:
          type: string
        total:
          type: integer
        embedded:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              pageId:
                type: string
              error:
