                    additionalProperties:
                      nullable: true
                  token:
                    type: object
                    nullable: true
                    additionalProperties:
                      nullable: true
                  apiKey:
                    type: object
                    properties:
                      configured:
                        type: boolean
                      source:
                        type: string
                        nullable: true
                        enum:
                          - environment
                          - config
                          - null
                    required:
                      - configured
                      - source
                  oauthToken:
                    type: object
                    properties:
                      configured:
                        type: boolean
                      source:
                        type: string
                        nullable: true
                        enum:
                          - environment
                          - config
                          - null
                      masked:
                        type: string
                        nullable: true
                    required:
                      - configured
                      - source
                      - masked
                  activeMethod:
                    type: string
                    enum:
                      - api-key
                      - oauth
                      - none
