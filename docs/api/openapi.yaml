    CreateSkillBody:
      anyOf:
        - type: object
          properties:
            name:
              type: string
              description: "Skill slug + frontmatter name: lowercase letters, digits and hyphens. On PUT it must match the `:skillId` path segment (rename is not supported)."
              example: jira-triage
            description:
              type: string
              description: Trigger text — the single most important field. State WHAT the skill does and WHEN to use it.
              example: Triage Jira issues. TRIGGER when the user mentions Jira tickets or sprint triage.
