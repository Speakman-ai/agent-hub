          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardErrorResponse"
    post:
      tags:
        - Board
      summary: Create a kanban card
      description: Creates a card in the given column. Returns the existing card unchanged if (a) a card with the same case-insensitive title already exists on this board, or (b) `sessionId` is already linked to a card on this board.
      parameters:
        - schema:
            type: string
            description: Project ID (slug).
          required: true
          description: Project ID (slug).
          name: projectId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                columnId:
                  type: string
                  minLength: 1
                description:
                  type: string
                  nullable: true
                priority:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
                    - urgent
                assignee:
                  type: string
                  nullable: true
                labels:
                  type: string
                  nullable: true
                sessionId:
                  type: string
                  nullable: true
                githubIssueUrl:
                  type: string
                  nullable: true
                createdBy:
                  type: string
                  nullable: true
              required:
                - title
                - columnId
      responses:
        "200":
          description: Card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanCard"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardErrorResponse"
