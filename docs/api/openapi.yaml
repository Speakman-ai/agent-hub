  /api/projects/{projectId}/aws-profiles:
    get:
      tags:
        - Projects
      summary: List AWS SSO profiles configured on a project
      description: Returns the project's AWS IAM Identity Center profile map. Not credentials — only the static stanza fields (`sso_account_id`, `sso_start_url`, `sso_region`, `sso_role_name`, `region`). SSO tokens themselves live under the spawning user's `~/.aws/sso/cache` and are never returned.
      parameters:
        - schema:
            type: string
            description: Project slug (e.g. `agent-hub`).
          required: true
          description: Project slug (e.g. `agent-hub`).
          name: projectId
          in: path
      responses:
        "200":
          description: Profile map (may be empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAwsProfilesResponse"
        "404":
          description: Project not found, or the caller cannot see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAwsErrorResponse"
    put:
      tags:
        - Projects
      summary: Replace the AWS SSO profiles configured on a project
      description: Wholesale replace the project's AWS SSO profile map. Pass an empty map to clear all profiles. After a successful save the server regenerates the on-disk `AWS_CONFIG_FILE` template that future spawns reference.
      parameters:
        - schema:
            type: string
            description: Project slug (e.g. `agent-hub`).
          required: true
          description: Project slug (e.g. `agent-hub`).
          name: projectId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAwsProfilesRequest"
      responses:
        "200":
          description: Profiles saved. Returns the normalized map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAwsProfilesResponse"
        "400":
          description: Validation failed — bad profile name, invalid account id / region / URL, or duplicate keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAwsErrorResponse"
        "404":
          description: Project not found, or the caller cannot see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAwsErrorResponse"
  /api/projects/{projectId}/aws-sso/status:
    get:
      tags:
        - Projects
      summary: Check whether the cached SSO token for a profile is still valid
      description: Runs `aws sts get-caller-identity --profile <name>` against the project's rendered `AWS_CONFIG_FILE` and reports whether the cached SSO token can authenticate. Use this from the UI to decide whether to surface a "Log in" CTA, and from agents to decide whether to call `POST /aws-sso/login` before making AWS calls.
      parameters:
        - schema:
            type: string
            description: Project slug (e.g. `agent-hub`).
          required: true
          description: Project slug (e.g. `agent-hub`).
          name: projectId
          in: path
        - schema:
            type: string
            description: Configured profile name.
          required: true
          description: Configured profile name.
          name: profile
          in: query
      responses:
        "200":
          description: Identity check ran. Inspect `loggedIn` to know whether the token is valid — a 200 is also returned for the "not logged in" case so callers can branch on the body without try/catch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAwsSsoStatusResponse"
        "400":
          description: Project has no AWS SSO profiles configured, or the profile name is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAwsErrorResponse"
        "404":
          description: Project not found, or the caller cannot see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAwsErrorResponse"
  /api/projects/{projectId}/aws-sso/login:
    post:
      tags:
        - Projects
      summary: Start a browser-less AWS SSO device-authorization flow
      description: |-
        Spawns `aws sso login --profile <name> --no-browser` server-side, watches its output for the IAM Identity Center device URL, and returns the URL to the caller. The user then opens that URL in their own browser to complete the device flow; once they do, the cached SSO token at `~/.aws/sso/cache` becomes valid and subsequent `GET /aws-sso/status` calls report `loggedIn: true`.

        Only one login proc runs per server at a time: a second request kills the previous proc before spawning a new one. The 30-second URL-extraction timeout also kills the proc so no orphaned `aws` processes accumulate.
      parameters:
        - schema:
            type: string
            description: Project slug (e.g. `agent-hub`).
          required: true
          description: Project slug (e.g. `agent-hub`).
          name: projectId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAwsSsoLoginRequest"
      responses:
        "200":
          description: "Login proc spawned. On the happy path the response carries `loginUrl`; on rare immediate completion it carries `completed: true`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAwsSsoLoginResponse"
        "400":
          description: Project has no AWS SSO profiles configured, or the profile name is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAwsErrorResponse"
        "404":
          description: Project not found, or the caller cannot see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAwsErrorResponse"
        "500":
          description: Login proc failed — exited non-zero, errored on spawn, or timed out without surfacing a device URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAwsSsoLoginResponse"
  /api/projects/order:
    put:
      tags:
        - Projects
      summary: Reorder the caller-visible project list
      description: Reorders `projects.json` so the caller-visible slice matches the supplied id list. Projects the caller cannot see (e.g. private projects owned by other users) keep their absolute slot — only the visible subset is permuted. Broadcasts `projects_updated` over the WebSocket on success so other open clients refresh their sidebars.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projectIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  description: Permutation of the caller-visible project ids. Must cover the same set GET /api/projects returns for this user — no missing ids, no extras, no duplicates.
              required:
                - projectIds
              description: Body for PUT /api/projects/order — the new project order.
      responses:
        "200":
          description: Reorder accepted; returns the new caller-visible order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOrderResponse"
        "400":
          description: Validation failed — body shape was wrong, an id was unknown or inaccessible, an id was missing, or duplicates were supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOrderErrorResponse"
