              type: string
            homeSource:
              type: string
              enum:
                - caller
                - host
                - per-user
              description: "Which HOME's SSO token cache produced this identity: 'caller' (the requesting user's per-user HOME), 'host' (the shared break-glass/operator HOME), or 'per-user' (the caller's per-user HOME for a not-logged-in result)."
          required:
            - profile
            - loggedIn
            - homeSource
        - type: object
          properties:
            profile:
              type: string
            loggedIn:
              type: boolean
              enum:
                - false
            error:
              type: string
            needsLogin:
              type: boolean
            homeSource:
              type: string
              enum:
                - caller
                - host
                - per-user
              description: "Which HOME the caller should log into to authenticate this profile: 'per-user' (the requesting user's own HOME) or 'host' (the shared break-glass/operator HOME). Run POST /aws-sso/login under that HOME. (Not the last-probed HOME — both caller and host caches were checked and neither held a valid token.)"
          required:
            - profile
            - loggedIn
            - homeSource
      description: "`aws sts get-caller-identity` result for the named profile. The caller HOME is probed first, then the shared host HOME as a fallback (never other users’ per-user HOMEs). `homeSource` reports where the reported identity (or last failed probe) lives. `loggedIn: false` with `needsLogin: true` means the cached SSO token is missing or expired and the caller should POST /aws-sso/login."
    ProjectAwsSsoLoginRequest:
      type: object
      properties:
        profile:
          type: string
          description: Configured profile name to log in.
      required:
        - profile
      description: Body for POST /aws-sso/login.
    ProjectAwsSsoLoginResponse:
      anyOf:
        - type: object
          properties:
            ok:
              type: boolean
              enum:
                - true
            loginId:
              type: string
              description: Server-local id for this login attempt — useful for log correlation.
            profile:
              type: string
            loginUrl:
              type: string
              description: IAM Identity Center device-authorization URL the user must open in a browser. Present on the standard happy path where the URL surfaces within ~30 seconds.
            completed:
              type: boolean
              description: True when `aws sso login --no-browser` finished entirely server-side (rare — usually the user completes the device flow in a browser before the CLI exits).
            output:
              type: string
              description: Tail of the CLI stdout/stderr (capped) for diagnostic purposes.
          required:
            - ok
            - loginId
            - profile
        - type: object
          properties:
            ok:
              type: boolean
              enum:
                - false
            loginId:
              type: string
            profile:
              type: string
            error:
              type: string
            output:
              type: string
          required:
            - ok
            - loginId
            - profile
            - error
      description: Outcome of the browser-less `aws sso login` spawn. Only one login proc runs per server at a time; if a second request arrives while a previous one is still running the previous proc is killed and a new one is spawned.
    ProjectOrderResponse:
      type: object
      properties:
        projectIds:
          type: array
          items:
            type: string
          description: Caller-visible project ids in their persisted order after the reorder commit.
      required:
        - projectIds
      description: Confirmation of the new project order. Mirrors the visibility-filtered slice the caller would see from GET /api/projects.
    ProjectOrderErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Error envelope returned when the reorder payload is malformed or references projects the caller cannot see.
    ProjectDetail:
      type: object
      properties:
        id:
          type: string
          description: Project slug — unique within the install.
        name:
          type: string
          description: Human-readable project name.
        cwd:
          type: string
          description: Absolute path to the project working directory on disk.
        githubRepo:
          type: string
          nullable: true
          description: GitHub repo in `owner/repo` form (e.g. `Speakman-ai/agent-hub`). Empty/null when the project has no GitHub remote.
        webhookConfigured:
          type: boolean
          nullable: true
          description: Whether this project has at least one enabled webhook_configs row. `true` — at least one enabled row delivers events. `false` — `githubRepo` is set but no enabled row exists; PR events will NOT reach the reviewer pipeline. Drives the missing-webhook UI banner. `null` — `githubRepo` is unset (non-GitHub remote or scratch project); webhook config is not applicable.
      required:
        - id
        - name
        - webhookConfigured
      additionalProperties:
        nullable: true
      description: Project detail response. Includes the full Project shape stored in `projects.json` plus the derived `webhookConfigured` flag. Additional fields beyond the documented ones (agents, githubWorkflow, prEnv, …) flow through via passthrough — schematise as that legacy surface migrates onto the schema-first contract.
    ProjectDetailErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Error envelope returned when the project slug is unknown.
    WebhookConfigRow:
      type: object
      properties:
        id:
          type: number
        project_id:
          type: string
        repo_url:
          type: string
        secret:
          type: string
          nullable: true
        events:
          type: string
          description: JSON-encoded event-toggle map.
        enabled:
          type: number
          description: 1 if enabled, 0 if disabled.
        author_allowlist:
          type: string
          description: JSON-encoded array of GitHub logins whose PRs trigger the reviewer.
        created_at:
          type: string
        updated_at:
          type: string
          nullable: true
      required:
        - id
        - project_id
        - repo_url
        - secret
        - events
        - enabled
        - author_allowlist
        - created_at
        - updated_at
      description: Persisted webhook_configs row.
    WebhookRegistrationResult:
      anyOf:
        - type: object
          properties:
            ok:
              type: boolean
              enum:
                - true
            skipped:
              type: boolean
              enum:
                - true
            reason:
              type: string
            message:
              type: string
            hookId:
              type: number
            url:
              type: string
            events:
              type: array
              items:
                type: string
            updated:
              type: boolean
          required:
            - ok
        - type: object
          properties:
            ok:
              type: boolean
              enum:
                - false
            error:
              type: string
          required:
            - ok
            - error
      description: 'Outcome of the GitHub-side webhook registration. `skipped: true` with `reason: "github_app_installed"` means the GitHub App already delivers events for this repo, so no per-repo registration is needed — the local `webhook_configs` row is still created for UI clarity.'
    WebhookAutoConfigureResponse:
      type: object
      properties:
        config:
          $ref: "#/components/schemas/WebhookConfigRow"
        registration:
          $ref: "#/components/schemas/WebhookRegistrationResult"
      required:
        - config
        - registration
      description: "Auto-configure result: the created `webhook_configs` row plus the registration outcome from GitHub."
    WebhookAutoConfigureErrorResponse:
      type: object
      properties:
        error:
          type: string
        existingConfigId:
          type: number
      required:
        - error
      description: Error envelope. `existingConfigId` is set on 409 conflicts to point the UI at the row already in place.
    UserFacingRelease:
      type: object
      properties:
        version:
          type: string
        tag:
          type: string
        publishedAt:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        summary:
          type: string
        sections:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              items:
                type: array
                items:
                  type: object
                  properties:
                    text:
                      type: string
                    hash:
                      type: string
                      nullable: true
                  required:
                    - text
                    - hash
            required:
              - title
              - items
      required:
        - version
        - tag
        - publishedAt
        - url
        - summary
        - sections
      description: Single release with user-facing changelog sections.
    ReleasesListResponse:
      type: object
      properties:
        repo:
          type: string
        source:
          type: string
          enum:
            - github
            - git
        currentVersion:
          type: string
        selected:
          allOf:
            - $ref: "#/components/schemas/UserFacingRelease"
            - nullable: true
        releases:
          type: array
          items:
            type: object
            properties:
              version:
                type: string
              tag:
                type: string
              publishedAt:
                type: string
                nullable: true
              url:
                type: string
                nullable: true
              summary:
                type: string
            required:
              - version
              - tag
              - publishedAt
              - url
              - summary
      required:
        - repo
        - source
        - currentVersion
        - selected
        - releases
      description: Release history for the Agent Hub repo.
    SupportRequestsErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Error envelope for support-request intake.
    SupportRequestFormFields:
      type: object
      properties:
        type:
          type: string
          enum:
            - bug
            - feature_request
          description: Kind of support request.
        title:
          type: string
          minLength: 1
          maxLength: 200
        severity:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
          default: medium
          description: Used for support-queue ordering (critical first).
        description:
          type: string
        sourceUrl:
          type: string
        userAgent:
          type: string
        appVersion:
          type: string
        clientType:
          type: string
          enum:
            - web
            - electron
            - mobile
        contactEmail:
          type: string
        currentAgentId:
          type: string
        sessionReplayUrl:
          type: string
          description: Reference (URL/id) to a session replay. Only valid when `type` is `bug`.
        sessionReplay:
          type: string
          format: binary
          description: Optional session-replay attachment (rrweb JSON, zip, or short capture, ≤25 MB). Sent as a binary file part. Only valid when `type` is `bug`.
      required:
        - type
        - title
      description: Multipart form fields for the support-request intake. Documentation-only; the handler reads multipart bytes directly because the body is `application/octet-stream` to express.
    WikiPage:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        category:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - project_id
        - title
        - slug
        - content
        - category
        - updated_by
        - created_at
        - updated_at
      description: A wiki page row (includes full content).
    WikiPageListItem:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - project_id
        - title
        - slug
        - category
        - updated_by
        - created_at
        - updated_at
      description: A wiki page list item (content omitted for payload size). Returned by `GET /wiki` bare and `?category=` paths.
    WikiSearchHit:
      allOf:
        - $ref: "#/components/schemas/WikiPageListItem"
        - type: object
          properties:
            snippet:
              type: string
            rank:
              type: number
      description: A wiki page returned from the legacy FTS5 search path (`GET /wiki?q=`). Adds the highlighted `snippet` and bm25-ish `rank`. Content is not included.
    WikiHybridSearchResult:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        score:
          type: number
        ftsScore:
          type: number
        semanticScore:
          type: number
        matchedChunk:
          type: string
        snippet:
          type: string
      required:
        - id
        - project_id
        - title
        - slug
        - category
        - updated_by
        - created_at
        - updated_at
        - score
      description: A hit from the hybrid/semantic/fts wiki search. `score` is the blended ranking; `ftsScore` / `semanticScore` are the per-mode components; `matchedChunk` is the highest-scoring chunk on the page (semantic / hybrid only).
    WikiSearchResponse:
      type: object
      properties:
        mode:
          type: string
          enum:
            - hybrid
            - semantic
            - fts
        query:
          type: string
        geminiConfigured:
          type: boolean
        results:
          type: array
          items:
            $ref: "#/components/schemas/WikiHybridSearchResult"
      required:
        - mode
        - geminiConfigured
        - results
      description: Envelope returned by `GET /wiki/search`. `geminiConfigured` reports whether the server has a Gemini API key (semantic + hybrid modes fall back to FTS when false).
    WikiBackfillResult:
      type: object
      properties:
        projectId:
          type: string
        total:
          type: integer
        embedded:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              pageId:
                type: string
              error:
                type: string
            required:
              - pageId
              - error
      required:
        - projectId
        - total
        - embedded
        - skipped
        - errors
      description: Result of a project-wide wiki re-embedding pass. `total` is the count of pages scanned; `embedded` increments per successfully chunk-and-embed; `skipped` counts pages skipped because the embed client could not be invoked; `errors` lists per-page failures.
    WikiErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: number
              message:
                type: string
            required:
              - path
              - message
      required:
        - error
      description: Error envelope. `details` is populated for 400 schema-validation errors with one entry per failing Zod issue.
  parameters: {}
paths:
  /api/agents:
    get:
      tags:
        - Agents
      summary: List all agents (enriched with last-activity / last-message)
      responses:
        "200":
          description: Array of agents enriched with last-activity metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentEnriched"
    post:
      tags:
        - Agents
      summary: Create a new agent under an existing project
      description: Returns 400 for missing/invalid id (must be alphanumeric + hyphens) or missing projectId, 404 if the project does not exist, 409 if the id collides with an existing agent.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  pattern: ^[a-zA-Z0-9-]+$
                projectId:
                  type: string
                  minLength: 1
                name:
                  type: string
                engine:
                  type: string
                model:
                  type: string
                systemPrompt:
                  type: string
                color:
                  type: string
                avatar:
                  type: string
                role:
                  type: string
                heartbeat:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    interval:
                      type: string
                    prompt:
                      type: string
                browserToolsEnabled:
                  type: boolean
                browserViewportWidth:
                  type: number
                  nullable: true
                browserViewportHeight:
                  type: number
                  nullable: true
                browserPageLoadTimeoutMs:
                  type: number
                  nullable: true
                allowedSkills:
                  type: array
                  nullable: true
                  items:
                    type: string
              required:
                - id
                - projectId
      responses:
        "201":
          description: Created agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEnriched"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "409":
          description: Agent id already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
  /api/agents/{agentId}:
    patch:
      tags:
        - Agents
      summary: Partially update an agent
      description: Omitted keys preserve the existing value. `browserViewportWidth` / `browserViewportHeight` / `browserPageLoadTimeoutMs` accept `null` to clear the override.
      parameters:
        - schema:
            type: string
            description: Agent ID.
          required: true
          description: Agent ID.
          name: agentId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                engine:
                  type: string
                model:
                  type: string
                systemPrompt:
                  type: string
                color:
                  type: string
                avatar:
                  type: string
                heartbeat:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    interval:
                      type: string
                    prompt:
                      type: string
                active:
                  type: boolean
                reviewer:
                  type: string
                role:
                  type: string
                canReview:
                  type: boolean
                delegationEnabled:
                  type: boolean
                browserToolsEnabled:
                  type: boolean
                browserViewportWidth:
                  type: number
                  nullable: true
                browserViewportHeight:
                  type: number
                  nullable: true
                browserPageLoadTimeoutMs:
                  type: number
                  nullable: true
                allowedSkills:
                  type: array
                  nullable: true
                  items:
                    type: string
      responses:
        "200":
          description: Updated agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEnriched"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "404":
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
    delete:
      tags:
        - Agents
      summary: Hard-delete an agent and its dependent rows
      description: Stops the in-memory heartbeat, transactionally clears every child store keyed by `agent_id` (sessions cascade messages/delegations/handoffs/skill_invocations/background_tasks/message_queue/checkpoints via FK ON DELETE CASCADE), drops the agent from `projects.json`, refreshes the project room, and best-effort removes the on-disk agent workspace. Returns 204 on success.
      parameters:
        - schema:
            type: string
            description: Agent ID.
          required: true
          description: Agent ID.
          name: agentId
          in: path
      responses:
        "204":
          description: Agent and dependent rows removed.
        "404":
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "500":
          description: Internal cleanup failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
  /api/agents/bulk-engine:
    post:
      tags:
        - Agents
      summary: Bulk-set engine (and optionally model) on every agent in every project
      description: Falls back to the engine's default model when `model` is missing or not in the engine's allowlist. Returns the count of agents updated.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                engine:
                  type: string
                  minLength: 1
                model:
                  type: string
              required:
                - engine
      responses:
        "200":
          description: Bulk-engine result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsBulkEngineResponse"
        "400":
          description: Validation failed or unknown engine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
  /api/agents/{agentId}/memory:
    put:
      tags:
        - Agents
      summary: Replace the agent memory file (MEMORY.md) contents
      parameters:
        - schema:
            type: string
            description: Agent ID.
          required: true
          description: Agent ID.
          name: agentId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
              required:
                - content
      responses:
        "200":
          description: Acknowledgment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
        "400":
          description: Validation failed or workspace not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "404":
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
  /api/sessions/{sessionId}/artifacts:
    get:
      tags:
        - Artifacts
      summary: List a session’s generated artifacts
      description: Returns metadata for every document an agent generated in this session, newest first. The bytes are fetched separately via the per-artifact content endpoint.
      parameters:
        - schema:
            type: string
            description: Session ID.
          required: true
          description: Session ID.
          name: sessionId
          in: path
      responses:
        "200":
          description: Artifact list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactList"
        "404":
          description: Session not found / not owned by caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
    post:
      tags:
        - Artifacts
      summary: Upload an artifact to a session
      description: Stores a raw file body as a session artifact. Send the bytes as the request body with `Content-Type` set to the file’s MIME type and `x-filename` set to the display name. Used by agents (via the agent-hub artifact script) and the web UI. Rejects executables/native binaries and bodies over 100 MB.
      parameters:
        - schema:
            type: string
            description: Session ID.
          required: true
          description: Session ID.
          name: sessionId
          in: path
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Raw file bytes.
      responses:
        "200":
          description: Created artifact metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "400":
          description: Empty body or rejected content type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
        "404":
          description: Session not found / not owned by caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
        "413":
          description: File exceeds the 100 MB limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
        "500":
          description: Storage write failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
  /api/sessions/{sessionId}/artifacts/{artifactId}/content:
    get:
      tags:
        - Artifacts
      summary: Download or view an artifact’s bytes
      description: "Streams the artifact bytes with `X-Content-Type-Options: nosniff`. Inert types render inline by default; pass `?download=1` for an attachment disposition. Active/scriptable content (HTML, SVG, XML, JS) is always forced to download with a neutral `application/octet-stream` type so it cannot execute in the app origin. When the backend is S3 and `?redirect=1` is set (non-active content only), responds 302 to a short-lived presigned URL instead of proxying the bytes. The store is resolved from the artifact row’s recorded backend, so reads survive a later storage reconfiguration."
      parameters:
        - schema:
            type: string
            description: Session ID.
          required: true
          description: Session ID.
          name: sessionId
          in: path
        - schema:
            type: string
            description: Artifact ID.
          required: true
          description: Artifact ID.
          name: artifactId
          in: path
      responses:
        "200":
          description: Artifact bytes.
        "302":
          description: Redirect to a presigned download URL (S3 backend, redirect=1).
        "404":
          description: Session or artifact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
        "500":
          description: Storage read failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
        "503":
          description: Artifact’s recorded storage backend is unavailable / unrecoverable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
  /api/sessions/{sessionId}/artifacts/{artifactId}:
    delete:
      tags:
        - Artifacts
      summary: Delete an artifact
      description: Deletes the artifact bytes from object storage FIRST, then removes the metadata row. If the storage delete fails the request fails (502) and nothing is removed, so the bytes are never orphaned without a record to retry. Resolves the row’s recorded backend, so it works after a storage reconfiguration.
      parameters:
        - schema:
            type: string
            description: Session ID.
          required: true
          description: Session ID.
          name: sessionId
          in: path
        - schema:
            type: string
            description: Artifact ID.
          required: true
          description: Artifact ID.
          name: artifactId
          in: path
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "404":
          description: Session or artifact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
        "502":
          description: Object-store deletion failed; nothing was removed (safe to retry).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
        "503":
          description: Artifact’s recorded storage backend is unavailable / unrecoverable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
