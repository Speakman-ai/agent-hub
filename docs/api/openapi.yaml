            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOrderResponse"
        "400":
          description: Validation failed — body shape was wrong, an id was unknown or inaccessible, an id was missing, or duplicates were supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOrderErrorResponse"
