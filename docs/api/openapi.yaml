          type: number
        baselinePassed:
          type: number
        improvedCount:
          type: number
          description: Objective evals that went baseline-fail → with-skill-pass.
        results:
          type: array
          items:
            type: object
            properties:
              evalId:
                type: string
              prompt:
                type: string
              graded:
                type: boolean
              withSkill:
                type: object
                properties:
                  output:
                    type: string
                  grade:
                    type: object
                    properties:
                      graded:
                        type: boolean
                      passed:
                        type: boolean
                      assertionResults:
                        type: array
                        items:
                          type: object
                          properties:
                            assertion:
                              type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                    - contains
                                    - icontains
                                    - not_contains
                                    - regex
                                  description: Check kind. `contains`/`not_contains` are case-sensitive substring; `icontains` is case-insensitive; `regex` is a JS regular-expression source matched against the output.
                                value:
                                  type: string
                                  example: cd server && npx vitest
                              required:
                                - type
                                - value
                              additionalProperties: false
                              description: One objective pass/fail check applied to a run output.
                            passed:
                              type: boolean
                            timedOut:
                              type: boolean
                              description: Set on a regex assertion aborted by the ReDoS time bound (treated as not matched).
                          required:
                            - assertion
                            - passed
                    required:
                      - graded
                      - passed
                      - assertionResults
                  error:
                    type: string
                required:
                  - output
                  - grade
              baseline:
