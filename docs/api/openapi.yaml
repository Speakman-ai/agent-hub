  /api/replays:
    options:
      tags:
        - Bug Reports
      summary: CORS preflight (returns 204)
      responses:
        "204":
          description: CORS preflight OK.
    post:
      tags:
        - Bug Reports
      summary: Public session-replay ingest (JSON or gzip)
      description: "Body carries a non-empty `events` array of rrweb events. May be sent as raw `application/json` or gzip-compressed bytes (a gzip-framed `application/octet-stream` body, or `Content-Encoding: gzip`) — compression is recommended since rrweb JSON is large and the decompressed payload is bounded at 16 MB. Persists the buffer and returns its `/uploads/replay-<id>.json` ref, usable as a support ticket `replayRef`. Auth is optional: with no `X-RUM-Token` the request is anonymous, rate-limited 30 / hour per IP, and the row is left unattributed. With a valid per-project `X-RUM-Token` (minted via `POST /api/projects/{projectId}/rum/clients`) the capture is attributed to that project and rate-limited 600 / hour per project instead; an invalid token is rejected 401."
      parameters:
        - schema:
            type: string
            description: Optional per-project RUM ingest token. When present it must be valid.
          required: false
          description: Optional per-project RUM ingest token. When present it must be valid.
          name: x-rum-token
          in: header
      requestBody:
        description: Either a raw JSON `ReplayIngestRequest` body, or its gzip-compressed bytes sent as `application/octet-stream` (a gzip-framed body the server inflates transparently).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayIngestRequest"
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: gzip-compressed request JSON (gzip-framed bytes).
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  replayId:
                    type: string
                  replayRef:
                    type: string
                    description: Local `/uploads/replay-<id>.json` ref.
                  projectId:
                    type: string
                    nullable: true
                    description: Project the capture was attributed to via a valid `X-RUM-Token`, or null for anonymous ingest.
                  size:
                    type: number
                    description: Compressed (gzip) blob size in bytes.
                  eventCount:
                    type: number
                    description: Number of rrweb events stored.
                  durationMs:
                    type: number
                    description: Span between first and last event timestamp (ms).
                required:
                  - replayId
                  - replayRef
                  - projectId
                  - size
                  - eventCount
                  - durationMs
                description: The persisted replay id, its uploads ref, and blob stats.
        "400":
          description: Validation failed (empty events, bad event shape, non-object meta), or a malformed JSON / gzip body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayIngestErrorResponse"
        "401":
          description: An X-RUM-Token header was supplied but is invalid or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayIngestErrorResponse"
        "413":
          description: Request body (or its decompressed size) exceeds the 16 MB limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayIngestErrorResponse"
        "429":
          description: Per-IP (anonymous) or per-project (token) rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayIngestErrorResponse"
        "500":
          description: Handler threw while persisting the replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayIngestErrorResponse"
  /api/replays/{id}/events:
    options:
      tags:
        - Bug Reports
      summary: CORS preflight for chunked replay ingest (returns 204)
      parameters:
        - schema:
            type: string
            description: Replay id (uuid).
          required: true
          description: Replay id (uuid).
          name: id
          in: path
      responses:
        "204":
          description: CORS preflight OK.
    post:
      tags:
        - Bug Reports
      summary: Public chunked session-replay ingest
      description: "Rate-limited (600 / hour per IP for anonymous ingest). Appends one batch of rrweb events to the replay `id`. The first chunk creates the replay and must include a full snapshot (type 2); later chunks append incremental events. The body is `{ events, meta? }` as raw JSON or gzip-compressed (≤2 MB on the wire, ≤16 MB decompressed). A capture is capped at 20,000 total events. Auth is optional and mirrors the one-shot path: with no `X-RUM-Token` the stream is anonymous and the row left unattributed; with a valid per-project token (minted via `POST /api/projects/{projectId}/rum/clients`) the creating chunk attributes the whole stream to that project and the request is rate-limited 6000 / hour per project instead. Every chunk of a stream should carry the same token. A chunk whose project disagrees with an already-attributed capture (anonymous or foreign token) is rejected 403. Once a replay is triage-linked to a support ticket or card it is finalized and rejects all further chunks (409)."
      parameters:
        - schema:
            type: string
            description: Replay id (uuid).
          required: true
          description: Replay id (uuid).
          name: id
          in: path
        - schema:
            type: string
            description: Optional per-project RUM ingest token. When present it must be valid, and must match the project of any already-attributed capture.
          required: false
          description: Optional per-project RUM ingest token. When present it must be valid, and must match the project of any already-attributed capture.
          name: x-rum-token
          in: header
      requestBody:
        description: Either a raw JSON `ReplayBatchIngestRequest` body, or its gzip-compressed bytes sent as `application/octet-stream` (a gzip-framed body the server inflates transparently).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayBatchIngestRequest"
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: gzip-compressed request JSON (gzip-framed bytes).
      responses:
        "200":
          description: Chunk appended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  replayId:
                    type: string
                  created:
                    type: boolean
                    description: True when this chunk created the replay.
                  projectId:
                    type: string
                    nullable: true
                    description: Project the capture is attributed to (from a verified X-RUM-Token), or null when anonymous.
                  eventCount:
                    type: number
                    description: Total events stored after this chunk.
                  size:
                    type: number
                    description: Compressed (gzip) blob size in bytes.
                  durationMs:
                    type: number
                    description: Span across all stored events (ms).
                required:
                  - replayId
                  - created
                  - projectId
                  - eventCount
                  - size
                  - durationMs
                description: Running totals for the replay after appending this chunk.
        "201":
          description: Replay created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  replayId:
                    type: string
                  created:
                    type: boolean
                    description: True when this chunk created the replay.
                  projectId:
                    type: string
                    nullable: true
                    description: Project the capture is attributed to (from a verified X-RUM-Token), or null when anonymous.
                  eventCount:
                    type: number
