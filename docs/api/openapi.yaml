  /api/bug-reports:
    options:
      tags:
        - Bug Reports
      summary: CORS preflight (returns 204)
      responses:
        "204":
          description: CORS preflight OK.
    post:
      tags:
        - Bug Reports
      summary: Public bug-report intake (multipart)
      description: Unauthenticated, rate-limited (10 / hour per IP). Body must be `multipart/form-data` with at minimum a `title` field. Optional `screenshot` is a PNG or JPEG up to 5 MB. Spawns a session for `agent-hub-intake` to land a kanban card under the `user-request` epic.
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BugReportFormFields"
      responses:
        "202":
          description: Dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                  status:
                    type: string
                    enum:
                      - dispatched
                required:
                  - sessionId
                  - status
                description: The intake session has been spawned. Result is the session id; the kanban card lands when the session completes.
        "400":
          description: Validation failed (missing title, bad severity, malformed multipart).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugReportsErrorResponse"
        "413":
          description: Screenshot exceeds 5 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugReportsErrorResponse"
        "429":
