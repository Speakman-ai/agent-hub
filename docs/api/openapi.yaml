  /api/projects/{projectId}/webhook/auto-configure:
    post:
      tags:
        - Projects
      summary: One-click GitHub webhook setup for a project
      description: "Creates a `webhook_configs` row with the standard event bundle (pull_request.opened / .synchronize / .review_comment.created enabled; .closed / review.submitted / check_suite.completed disabled) and registers the webhook on GitHub via the installation-token path when a GitHub App is configured, or the gh-CLI fallback otherwise. Idempotent: returns 409 with `existingConfigId` if an enabled webhook config already exists for the project. Requires `githubRepo` set on the project; returns 400 otherwise. When the GitHub App is installed on the repo owner, the per-repo registration is skipped — the local row is still created so the missing-webhook UI banner clears, but the App is the active delivery path."
      parameters:
        - schema:
            type: string
            description: Project slug (e.g. `agent-hub`).
          required: true
          description: Project slug (e.g. `agent-hub`).
          name: projectId
          in: path
      responses:
        "200":
          description: Webhook config created + registration attempted. Inspect `registration.ok` to learn whether the GitHub side succeeded; the local row is created either way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAutoConfigureResponse"
        "400":
          description: Project has no `githubRepo` configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAutoConfigureErrorResponse"
        "404":
          description: No project with this slug, or the caller cannot see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAutoConfigureErrorResponse"
        "409":
          description: An enabled webhook config already exists for this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAutoConfigureErrorResponse"
        "500":
          description: Server-side failure (DB outage, GitHub API exception).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAutoConfigureErrorResponse"
