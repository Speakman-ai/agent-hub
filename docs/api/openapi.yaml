  /api/projects/{projectId}/code-index:
    post:
      tags:
        - Code RAG
      summary: Index (or incrementally re-index) the project source tree
      description: "Walks the project checkout (`project.cwd`), embeds eligible source files into chunk-level vectors, and refreshes the FTS index. Idempotent: unchanged files (matched by content hash) are skipped and deleted files are pruned (pruning is skipped when the scan is capped by `maxFiles`, i.e. `truncated: true`). Invalid `maxFiles` (non-positive or > 20000) returns 400. Returns 503 when no Gemini embedding key is configured."
      parameters:
        - schema:
            type: string
            description: Project ID (slug).
          required: true
          description: Project ID (slug).
          name: projectId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maxFiles:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 20000
      responses:
        "200":
          description: Indexing report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeIndexResult"
        "400":
          description: Request body validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRagErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRagErrorResponse"
        "500":
          description: Indexing error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRagErrorResponse"
        "503":
          description: Gemini embedding key not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRagErrorResponse"
  /api/projects/{projectId}/code-index/status:
    get:
      tags:
        - Code RAG
      summary: Code index status
      description: Returns the number of indexed chunks for the project and whether Gemini is configured.
      parameters:
        - schema:
            type: string
            description: Project ID (slug).
          required: true
          description: Project ID (slug).
          name: projectId
          in: path
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeIndexStatus"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRagErrorResponse"
