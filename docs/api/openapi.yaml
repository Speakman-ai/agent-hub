  /api/sessions/{sessionId}/preview/state:
    get:
      tags:
        - Sessions
      summary: Get current preview state for a chat session
      description: "Returns the current `agenthub_preview` event for the session — the same wire shape delivered live over WebSocket and on the WS connect-snapshot — or `{ event: null }` when no compose preview is active. The client uses this to reconcile a preview pane that is stuck on `preview_starting` because a live `ready` event was dropped while the socket stayed open (no reconnect, so the connect-snapshot never replayed)."
      parameters:
        - schema:
            type: string
            description: Session UUID.
          required: true
          description: Session UUID.
          name: sessionId
          in: path
      responses:
        "200":
          description: Current preview event, or null when none is active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    type: object
                    nullable: true
                    properties:
                      type:
                        type: string
                        enum:
                          - agenthub_preview
                      kind:
                        type: string
                        enum:
                          - preview_starting
                          - preview
                          - preview_failed
                      sessionId:
                        type: string
                      previewId:
                        type: string
                      target:
                        type: string
                        enum:
                          - client
                      route:
                        type: string
                      previewUrl:
                        type: string
                      fullUrl:
                        type: string
                      port:
                        type: number
                      screenshotPath:
                        type: string
                        nullable: true
                      logTail:
                        type: array
                        items:
                          type: string
                      error:
                        type: string
                    required:
                      - type
                      - kind
                      - sessionId
                      - previewId
                      - target
                      - route
                      - screenshotPath
                      - logTail
                    description: The current preview snapshot event, or null when no preview is active for the session.
                required:
                  - event
        "404":
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionErrorResponse"
  /api/sessions/{sessionId}/changes:
    get:
      tags:
        - Sessions
      summary: List files changed in a session worktree
      description: Returns the total session delta — committed, uncommitted, and untracked files — diffed against the merge-base of the base branch and the worktree HEAD. Owner-filtered; a session the caller does not own returns 404. Sessions with no worktree return an empty file list.
      parameters:
        - schema:
            type: string
            description: Session UUID.
          required: true
          description: Session UUID.
          name: sessionId
          in: path
      responses:
        "200":
          description: Session change summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionChanges"
        "404":
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionErrorResponse"
        "500":
          description: Failed to compute session changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionErrorResponse"
  /api/sessions/{sessionId}/changes/diff:
    get:
      tags:
        - Sessions
      summary: Unified diff for a single changed file
      description: Returns the unified diff for one file in a session worktree. The `file` must be a repo-relative path that the server reports as changed for this session — absolute paths and `..` traversal are rejected, and paths outside the changed-file set return 404 (the endpoint is membership-gated so it can't be used as an arbitrary file-read primitive). Whether a file is tracked vs. untracked is determined server-side. Binary and oversized diffs return an empty body with `binary`/`tooLarge` set.
      parameters:
        - schema:
            type: string
            description: Session UUID.
          required: true
          description: Session UUID.
          name: sessionId
          in: path
        - schema:
            type: string
            description: Repo-relative path to diff (new path for renames).
          required: true
          description: Repo-relative path to diff (new path for renames).
          name: file
          in: query
      responses:
        "200":
          description: File diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionFileDiff"
        "400":
          description: Missing or invalid (absolute / out-of-worktree) file path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionErrorResponse"
        "404":
          description: Session not found, has no worktree, or file is not a session change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionErrorResponse"
        "500":
          description: Failed to compute file diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionErrorResponse"
  /api/bug-reports:
    options:
