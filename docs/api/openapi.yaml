  /api/projects/{projectId}/board/cards/{cardId}/blockers:
    post:
      tags:
        - Board
      summary: Declare that this card is blocked by another card
      description: Both cards must live on the same project board. Adding the edge is rejected when it would close a cycle (`409 cycle`, with `path` naming the cycle) or when the edge already exists (`409 duplicate`).
      parameters:
        - schema:
            type: string
            description: Project ID (slug).
          required: true
          description: Project ID (slug).
          name: projectId
          in: path
        - schema:
            type: string
            description: Kanban card UUID.
          required: true
          description: Kanban card UUID.
          name: cardId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                blockedByCardId:
                  type: string
                  minLength: 1
              required:
                - blockedByCardId
      responses:
        "201":
          description: New blocker link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  card_id:
                    type: string
                  blocked_by_card_id:
                    type: string
                required:
                  - id
                  - card_id
                  - blocked_by_card_id
        "400":
          description: Validation failed or self-block attempted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardErrorResponse"
        "404":
          description: Card not found (either side).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardErrorResponse"
        "409":
          description: Duplicate edge or cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardErrorResponse"
