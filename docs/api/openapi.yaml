      responses:
        "200":
          description: Acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeWizardCompleteResponse"
        "404":
          description: Project not found (silent — broadcast is a no-op).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeWizardErrorResponse"
