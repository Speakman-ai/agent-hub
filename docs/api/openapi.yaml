  /api/projects/{projectId}/git-host:
    get:
      tags:
        - Projects
      summary: Git hosting status for a project
      description: "Reports whether the project uses Agent Hub-hosted git (gitHost: agenthub), the clone URL, default branch, import progress, and the GitHub mirror policy."
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
      responses:
        "200":
          description: Hosting status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  cloneUrl:
                    type: string
                    nullable: true
                  defaultBranch:
                    type: string
                    nullable: true
                  branchCount:
                    type: number
                  importState:
                    type: object
                    nullable: true
                    properties:
                      status:
                        type: string
                        enum:
                          - importing
                          - ready
                          - error
                      startedAt:
                        type: number
                      finishedAt:
                        type: number
                      error:
                        type: string
                      importedFrom:
                        type: string
                        enum:
                          - github
                          - cwd
                          - empty
                    required:
                      - status
                      - startedAt
                  mirror:
                    type: object
                    nullable: true
                    properties:
                      enabled:
                        type: boolean
                      refs:
                        type: string
                        enum:
                          - default-branch
                          - all
                    required:
                      - enabled
                      - refs
                required:
                  - enabled
                  - cloneUrl
                  - defaultBranch
                  - branchCount
                  - importState
                  - mirror
        "404":
          description: Unknown project.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
  /api/projects/{projectId}/git-host/enable:
    post:
      tags:
        - Projects
      summary: Enable Agent Hub git hosting for a project
      description: Creates the hosted bare repo (importing from GitHub via repoUrl, from the project cwd, or empty), rewrites the project cwd origin to the hosted repo, and flips gitHost to agenthub. The import runs in the background — poll GET /git-host for progress. Requires Admin.
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                importFrom:
                  type: string
                  enum:
                    - auto
                    - github
                    - cwd
                    - empty
      responses:
        "202":
          description: Import started (or already running).
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  cloneUrl:
                    type: string
                    nullable: true
                  defaultBranch:
                    type: string
                    nullable: true
                  branchCount:
                    type: number
                  importState:
                    type: object
                    nullable: true
                    properties:
                      status:
                        type: string
                        enum:
                          - importing
                          - ready
                          - error
                      startedAt:
                        type: number
                      finishedAt:
                        type: number
                      error:
                        type: string
                      importedFrom:
                        type: string
                        enum:
                          - github
                          - cwd
                          - empty
                    required:
                      - status
                      - startedAt
                  mirror:
                    type: object
                    nullable: true
                    properties:
                      enabled:
                        type: boolean
                      refs:
                        type: string
                        enum:
                          - default-branch
                          - all
                    required:
                      - enabled
                      - refs
                required:
                  - enabled
                  - cloneUrl
                  - defaultBranch
                  - branchCount
                  - importState
                  - mirror
        "400":
          description: Invalid importFrom.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "404":
          description: Unknown project.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "409":
          description: Hosting already enabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
  /api/projects/{projectId}/git-host/disable:
    post:
      tags:
        - Projects
      summary: Disable Agent Hub git hosting for a project
      description: Flips gitHost back to github and restores the project cwd origin to repoUrl when set. The hosted bare repo is retained on disk. Requires Admin.
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
      responses:
        "200":
          description: Hosting disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  cloneUrl:
                    type: string
                    nullable: true
                  defaultBranch:
                    type: string
                    nullable: true
                  branchCount:
                    type: number
                  importState:
                    type: object
                    nullable: true
                    properties:
                      status:
                        type: string
                        enum:
                          - importing
                          - ready
                          - error
                      startedAt:
                        type: number
                      finishedAt:
                        type: number
                      error:
                        type: string
                      importedFrom:
                        type: string
                        enum:
                          - github
                          - cwd
                          - empty
                    required:
                      - status
                      - startedAt
                  mirror:
                    type: object
                    nullable: true
                    properties:
                      enabled:
                        type: boolean
                      refs:
                        type: string
                        enum:
                          - default-branch
                          - all
                    required:
                      - enabled
                      - refs
                required:
                  - enabled
                  - cloneUrl
                  - defaultBranch
                  - branchCount
                  - importState
                  - mirror
        "404":
          description: Unknown project.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "409":
          description: Hosting not enabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
  /api/projects/{projectId}/git-host/branches:
    get:
      tags:
        - Projects
      summary: List branches of an Agent Hub-hosted repo
      description: "Branches of the hosted bare repo, newest-commit first, with ahead/behind counts relative to the default branch. Repository-page surface; 404 unless the project uses gitHost: agenthub."
