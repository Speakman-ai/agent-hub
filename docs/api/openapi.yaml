              schema:
                $ref: "#/components/schemas/QuarantineError"
    post:
      tags:
        - Finalize
      summary: Quarantine a flaky job instance
      description: Adds (or updates, idempotent per instance) a quarantine entry. `days` is clamped to ≤30. A quarantined instance still runs but no longer blocks the push gate until it expires.
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
      requestBody:
