        "204":
          description: CORS preflight OK.
    post:
      tags:
        - Bug Reports
      summary: Public bug-report intake (multipart)
      description: Unauthenticated, rate-limited (10 / hour per IP). Body must be `multipart/form-data` with at minimum a `title` field. Optional `screenshot` is a PNG or JPEG up to 5 MB. Spawns a session for `agent-hub-intake` to land a kanban card under the `user-request` epic.
