        - schema:
            type: string
          required: true
          name: projectId
          in: path
        - schema:
            type: string
            description: "`<N><m|h|d>` (e.g. `7d`, `24h`) or `<isoFrom>..<isoTo>`. Defaults to 24h."
          required: false
          description: "`<N><m|h|d>` (e.g. `7d`, `24h`) or `<isoFrom>..<isoTo>`. Defaults to 24h."
          name: range
          in: query
        - schema:
            type: string
            enum:
              - agree_green
              - agree_red
              - false_green
              - false_red
              - indeterminate
            description: Filter the record list to a single divergence class.
          required: false
          description: Filter the record list to a single divergence class.
          name: class
          in: query
      responses:
