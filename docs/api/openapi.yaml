  /api/projects/{projectId}/finalize/{runId}/cancel:
    post:
      tags:
        - Finalize
      summary: Cancel an in-flight Finalize run
      description: |-
        Flips the row to `cancelled` and broadcasts `finalize_run_phase_changed`
        and `finalize_run_completed`. Trips the orchestrator's in-process
        `CancelSignal` (via the run-abort registry) so the fix-dispatch loop and any
        in-flight reviewer turn stop instead of dispatching another fix, kills the
        originating session's agent turn, and broadcasts an `interrupted` event so
        the session falls idle and waits for user input. The UI subscribes to the
        broadcast pair.
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
        - schema:
            type: string
          required: true
          name: runId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelFinalizeRunRequest"
      responses:
        "200":
          description: Run was flipped to cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelFinalizeRunResponse"
        "404":
          description: Project not found, run not found, run belongs to a different project, or caller does not own the linked session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeErrorResponse"
        "409":
          description: Run is already terminal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelFinalizeRunTerminal"
