            required:
              - pageId
              - error
      required:
        - projectId
        - total
        - embedded
        - skipped
        - errors
      description: Result of a project-wide wiki re-embedding pass. `total` is the count of pages scanned; `embedded` increments per successfully chunk-and-embed; `skipped` counts pages skipped because the embed client could not be invoked; `errors` lists per-page failures.
    WikiErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: number
              message:
                type: string
            required:
              - path
              - message
      required:
        - error
      description: Error envelope. `details` is populated for 400 schema-validation errors with one entry per failing Zod issue.
    SessionDesignFile:
      type: object
      properties:
        path:
          type: string
          description: Forward-slash path relative to the worktree `design/` dir.
        size:
          type: number
          description: File size in bytes.
        mtime:
          type: string
          description: Last-modified time, ISO 8601.
      required:
        - path
        - size
        - mtime
    DesignImportResult:
      type: object
      properties:
        designId:
          type: string
        sessionId:
          type: string
          description: The design-mode session the design now lives in.
        agentId:
          type: string
        importedMessages:
          type: integer
          description: Count of design messages replayed into the session.
        reused:
          type: boolean
          description: True when the design was already imported and the existing session was returned.
        skipped:
          type: string
          enum:
            - already-imported
      required:
        - designId
        - sessionId
        - agentId
        - importedMessages
        - reused
  parameters: {}
paths:
  /api/agents:
    get:
      tags:
        - Agents
      summary: List all agents (enriched with last-activity / last-message)
      responses:
        "200":
          description: Array of agents enriched with last-activity metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentEnriched"
    post:
      tags:
        - Agents
      summary: Create a new agent under an existing project
      description: Returns 400 for missing/invalid id (must be alphanumeric + hyphens) or missing projectId, 404 if the project does not exist, 409 if the id collides with an existing agent.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  pattern: ^[a-zA-Z0-9-]+$
                projectId:
                  type: string
                  minLength: 1
                name:
                  type: string
                engine:
                  type: string
                model:
                  type: string
                systemPrompt:
                  type: string
                color:
                  type: string
                avatar:
                  type: string
                role:
                  type: string
                isDev:
                  type: boolean
                  description: Accept autonomously-dispatched kanban tickets. Defaults to false in the UI (opt-in). Sending a value that contradicts a locked role (dev/lead → must be true; docs/intake/reviewer → must be false) is rejected with 400.
                heartbeat:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    interval:
                      type: string
                    prompt:
                      type: string
                browserToolsEnabled:
                  type: boolean
                browserViewportWidth:
                  type: number
                  nullable: true
                browserViewportHeight:
                  type: number
                  nullable: true
                browserPageLoadTimeoutMs:
                  type: number
                  nullable: true
                allowedSkills:
                  type: array
                  nullable: true
                  items:
                    type: string
              required:
                - id
                - projectId
      responses:
        "201":
          description: Created agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEnriched"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "409":
          description: Agent id already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
  /api/agents/{agentId}:
    patch:
      tags:
        - Agents
      summary: Partially update an agent
      description: Omitted keys preserve the existing value. `browserViewportWidth` / `browserViewportHeight` / `browserPageLoadTimeoutMs` accept `null` to clear the override.
      parameters:
        - schema:
            type: string
            description: Agent ID.
          required: true
          description: Agent ID.
          name: agentId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                engine:
                  type: string
                model:
                  type: string
                systemPrompt:
                  type: string
                color:
                  type: string
                avatar:
                  type: string
                heartbeat:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    interval:
                      type: string
                    prompt:
                      type: string
                active:
                  type: boolean
                reviewer:
                  type: string
                role:
                  type: string
                canReview:
                  type: boolean
                isDev:
                  type: boolean
                  description: Accept autonomously-dispatched kanban tickets. Sending a value that contradicts a locked role (dev/lead → must be true; docs/intake/reviewer → must be false) is rejected with 400; a matching value is a no-op.
                delegationEnabled:
                  type: boolean
                browserToolsEnabled:
                  type: boolean
                browserViewportWidth:
                  type: number
                  nullable: true
                browserViewportHeight:
                  type: number
                  nullable: true
                browserPageLoadTimeoutMs:
                  type: number
                  nullable: true
                allowedSkills:
                  type: array
                  nullable: true
                  items:
                    type: string
      responses:
        "200":
          description: Updated agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEnriched"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "404":
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
    delete:
      tags:
        - Agents
      summary: Hard-delete an agent and its dependent rows
      description: Stops the in-memory heartbeat, transactionally clears every child store keyed by `agent_id` (sessions cascade messages/delegations/handoffs/skill_invocations/background_tasks/message_queue/checkpoints via FK ON DELETE CASCADE), drops the agent from `projects.json`, refreshes the project room, and best-effort removes the on-disk agent workspace. Returns 204 on success.
      parameters:
        - schema:
            type: string
            description: Agent ID.
          required: true
          description: Agent ID.
          name: agentId
          in: path
      responses:
        "204":
          description: Agent and dependent rows removed.
        "404":
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "500":
          description: Internal cleanup failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
  /api/agents/bulk-engine:
    post:
      tags:
        - Agents
      summary: Bulk-set per-user engine + model overrides for every visible agent
      description: Requires authentication. Writes the caller's own `agentEngineOverrides` and `agentModelOverrides` for every agent in projects they can view — never the shared `agents` row. Falls back to the engine's default model when `model` is missing or not in the engine's allowlist.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                engine:
                  type: string
                  minLength: 1
                model:
                  type: string
              required:
                - engine
      responses:
        "200":
          description: Bulk-engine result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsBulkEngineResponse"
        "400":
          description: Validation failed or unknown engine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
  /api/agents/{agentId}/memory:
    put:
      tags:
        - Agents
      summary: Replace the agent memory file (MEMORY.md) contents
      parameters:
        - schema:
            type: string
            description: Agent ID.
          required: true
          description: Agent ID.
          name: agentId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
              required:
                - content
      responses:
        "200":
          description: Acknowledgment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
        "400":
          description: Validation failed or workspace not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
        "404":
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
  /api/sessions/{sessionId}/artifacts:
    get:
      tags:
        - Artifacts
      summary: List a session’s generated artifacts
      description: Returns metadata for every document an agent generated in this session, newest first. The bytes are fetched separately via the per-artifact content endpoint.
      parameters:
        - schema:
            type: string
            description: Session ID.
          required: true
          description: Session ID.
          name: sessionId
          in: path
      responses:
        "200":
          description: Artifact list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactList"
        "404":
          description: Session not found / not owned by caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
    post:
      tags:
        - Artifacts
      summary: Upload an artifact to a session
      description: Stores a raw file body as a session artifact. Send the bytes as the request body with `Content-Type` set to the file’s MIME type and `x-filename` set to the display name. Used by agents (via the agent-hub artifact script) and the web UI. Rejects executables/native binaries and bodies over 100 MB.
      parameters:
        - schema:
            type: string
            description: Session ID.
          required: true
          description: Session ID.
          name: sessionId
          in: path
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Raw file bytes.
      responses:
        "200":
          description: Created artifact metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "400":
          description: Empty body or rejected content type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
        "404":
          description: Session not found / not owned by caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
        "413":
          description: File exceeds the 100 MB limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
        "500":
          description: Storage write failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
  /api/sessions/{sessionId}/artifacts/{artifactId}/content:
    get:
      tags:
        - Artifacts
      summary: Download or view an artifact’s bytes
      description: "Streams the artifact bytes with `X-Content-Type-Options: nosniff`. Inert types render inline by default; pass `?download=1` for an attachment disposition. Active/scriptable content (HTML, SVG, XML, JS) is always forced to download with a neutral `application/octet-stream` type so it cannot execute in the app origin. When the backend is S3 and `?redirect=1` is set (non-active content only), responds 302 to a short-lived presigned URL instead of proxying the bytes. The store is resolved from the artifact row’s recorded backend, so reads survive a later storage reconfiguration."
      parameters:
        - schema:
            type: string
            description: Session ID.
          required: true
          description: Session ID.
          name: sessionId
          in: path
        - schema:
            type: string
            description: Artifact ID.
          required: true
          description: Artifact ID.
          name: artifactId
          in: path
      responses:
        "200":
          description: Artifact bytes.
        "302":
          description: Redirect to a presigned download URL (S3 backend, redirect=1).
        "404":
          description: Session or artifact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
        "500":
          description: Storage read failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
        "503":
          description: Artifact’s recorded storage backend is unavailable / unrecoverable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponse"
  /api/sessions/{sessionId}/artifacts/{artifactId}:
    delete:
      tags:
        - Artifacts
      summary: Delete an artifact
      description: Deletes the artifact bytes from object storage FIRST, then removes the metadata row. If the storage delete fails the request fails (502) and nothing is removed, so the bytes are never orphaned without a record to retry. Resolves the row’s recorded backend, so it works after a storage reconfiguration.
      parameters:
        - schema:
            type: string
            description: Session ID.
          required: true
          description: Session ID.
          name: sessionId
          in: path
        - schema:
            type: string
            description: Artifact ID.
          required: true
          description: Artifact ID.
          name: artifactId
          in: path
      responses:
        "200":
          description: Deleted.
          content:
