  /api/projects/{projectId}/cards/{cardId}/finalize:
    post:
      tags:
        - Finalize
      summary: Start a Finalize Code Changes run for a card
      description: |-
        Kicks off the Finalize pipeline against the card's linked session.
        Idempotent on (project, branch, head_sha) per §4 — clicking the button
        twice against the same HEAD returns the same row id.

        Returns 200 with the row id when the run was created (`reused: false`) or
        when an idempotency match returned a TERMINAL row (`reused: true`).
        Returns 409 when an idempotency match is non-terminal (a run is in flight).

        Requires session ownership — non-owners receive 404 to mask existence.
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
        - schema:
            type: string
          required: true
          name: cardId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartFinalizeRunRequest"
      responses:
        "200":
          description: Run created or terminal row reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartFinalizeRunResponse"
        "202":
          description: "Run started but the row was not visible within the synchronous poll window — clients should fall back to the WS event stream. The 202 body uses a distinct envelope (`StartFinalizeRunPending`) from the 200 path so OpenAPI consumers can discriminate by `run_id: null`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartFinalizeRunPending"
        "400":
