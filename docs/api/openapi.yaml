        project_id:
          type: string
        key:
          type: string
        kind:
          type: string
          enum:
            - plain
            - secret
          description: "`plain` values are returned in clear on GET. `secret` values are masked on GET (return the `••••••••` sentinel) and only decrypted at spawn time inside `loadProjectEnvForSpawn`."
        value:
          type: string
          description: Decrypted value for `plain` kind; the `••••••••` MASK sentinel for `secret` kind. Never the plaintext of a secret-kind row.
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - project_id
        - key
        - kind
        - value
        - created_at
        - updated_at
      description: One per-project secret row as returned by GET / PUT. `secret`-kind rows mask the value field; the only path that decrypts a secret is the spawn-time `loadProjectEnvForSpawn` (no caller-facing read).
    PreviewSecretsListResponse:
      type: object
      properties:
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/PreviewSecretRow"
      required:
        - secrets
      description: Current secrets for the project, sorted by key. `secret`-kind values are masked.
    PreviewSecretsPutRequest:
      type: object
      properties:
        secrets:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: Env var name. Same validation rules as the URL `:key` param.
              value:
                type: string
                description: New plaintext value, OR the MASK sentinel (`••••••••`) for an existing `secret`-kind row to preserve its ciphertext without re-sending the plaintext.
              kind:
                type: string
                enum:
                  - plain
                  - secret
                description: Defaults to `secret` when omitted.
            required:
              - key
              - value
            description: One entry in a bulk-replace PUT body.
          description: Full replacement set. Keys not present in the array are removed. Send the MASK sentinel for an existing secret-kind row to preserve its current ciphertext.
      required:
        - secrets
      description: Body for PUT /secrets.
    PreviewSecretsImportRequest:
      type: object
      properties:
        env:
          type: string
          description: "`.env`-style blob. Supports `KEY=value`, quoted values, `export KEY=value`, comments and blank lines. Multi-line values and shell-expansion are NOT supported."
        mode:
          type: string
          enum:
            - replace
            - merge
          description: "`replace` (default) — wipe existing keys and install the parsed set. `merge` — keep existing keys, parsed entries win on conflict."
        defaultKind:
          type: string
          enum:
            - plain
            - secret
          description: Kind to assign to each parsed entry; defaults to `secret`.
      required:
        - env
      description: Body for POST /secrets/import.
    PreviewSecretsImportResponse:
      type: object
      properties:
