  /api/projects/{projectId}/cards/{cardId}/finalize:
    post:
      tags:
        - Finalize
      summary: Start a Finalize Code Changes run for a card
      description: |-
        Kicks off the Finalize pipeline against the card's linked session.
        Idempotent on (project, branch, head_sha) per §4 — clicking the button
        twice against the same HEAD returns the same row id.

        Returns 200 with the row id when the run was created (`reused: false`) or
        when an idempotency match returned a TERMINAL row (`reused: true`).
        Returns 409 when an idempotency match is non-terminal (a run is in flight).

        Requires session ownership — non-owners receive 404 to mask existence.
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
        - schema:
            type: string
          required: true
          name: cardId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartFinalizeRunRequest"
      responses:
        "200":
          description: Run created or terminal row reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartFinalizeRunResponse"
        "202":
          description: "Run started but the row was not visible within the synchronous poll window — clients should fall back to the WS event stream. The 202 body uses a distinct envelope (`StartFinalizeRunPending`) from the 200 path so OpenAPI consumers can discriminate by `run_id: null`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartFinalizeRunPending"
        "400":
          description: Missing session linkage, missing worktree, missing branch, or HEAD SHA could not be resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeErrorResponse"
        "404":
          description: Project or card not found, or caller does not own the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeErrorResponse"
        "409":
          description: A non-terminal Finalize run already exists for this (branch, head_sha).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartFinalizeRunInFlight"
        "410":
          description: "The request body included a `jobs` filter. Single-job Finalize runs were removed — Finalize always runs the full pipeline. Resend without `jobs`. Error code: `jobs_unsupported`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeErrorResponse"
  /api/projects/{projectId}/sessions/{sessionId}/finalize:
    post:
      tags:
        - Finalize
      summary: Start Finalize for a session (auto-creates kanban card)
      description: |-
        Same pipeline as the card-scoped finalize trigger, but accepts a session id
        directly. When the session has no linked kanban card, one is created on the
        project board (In Progress column, titled from the session name) before the
        run starts.
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
        - schema:
            type: string
          required: true
          name: sessionId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartFinalizeRunRequest"
      responses:
        "200":
          description: Run created or terminal row reused. Includes `card_id` and `card_created`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StartFinalizeRunResponse"
                  - type: object
                    properties:
                      card_id:
                        type: string
                      card_created:
                        type: boolean
                    required:
                      - card_id
                      - card_created
                description: A new or reused Finalize run.
        "202":
          description: Run started but row not yet visible.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StartFinalizeRunPending"
                  - type: object
                    properties:
                      card_id:
                        type: string
                      card_created:
                        type: boolean
                    required:
                      - card_id
                      - card_created
                description: Fallback envelope returned when the orchestrator fired but the row insert was not visible within ~300ms. Distinct shape from `StartFinalizeRunResponse` so OpenAPI clients can branch on it.
        "400":
          description: Missing worktree, branch, or HEAD SHA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeErrorResponse"
        "404":
          description: Project or session not found, or caller does not own the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeErrorResponse"
        "409":
          description: A non-terminal Finalize run already exists for this (branch, head_sha).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartFinalizeRunInFlight"
        "410":
          description: "The request body included a `jobs` filter. Single-job Finalize runs were removed — Finalize always runs the full pipeline. Resend without `jobs`. Error code: `jobs_unsupported`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeErrorResponse"
  /api/projects/{projectId}/finalize/metrics:
    get:
      tags:
        - Finalize
      summary: Aggregated Finalize adoption metrics for a project
      description: |-
        Counters and histogram summaries over the requested time window.
        See wiki `finalize-code-changes-architecture-v0` §14 for the metric
        vocabulary. No dashboard at v0 — the endpoint plus ad-hoc SQL is the
        dogfood-window read surface.

        Range syntax: `<N><m|h|d>` for a relative window ending now (e.g. `24h`,
        `7d`), or `<isoFrom>..<isoTo>` for an explicit half-open `[from, to)`
        interval (the `..` separator avoids collision with ISO8601 colons).
        Defaults to the last 24 hours.

        Optional `metrics=...` filter accepts a comma-separated subset of metric
        names. Unknown names are silently dropped; every requested known name
        is present in the response, even when zero rows landed.
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
        - schema:
            type: string
            description: Time window. See description.
          required: false
          description: Time window. See description.
          name: range
          in: query
        - schema:
            type: string
            description: "Comma-separated subset: finalize_run_started, finalize_run_completed, finalize_run_active_seconds, finalize_run_wall_seconds, finalize_fix_dispatch_count, finalize_reviewer_verdict, finalize_step_result, finalize_stalled_no_response_count, merged_pr_provenance, finalize_github_parity."
          required: false
          description: "Comma-separated subset: finalize_run_started, finalize_run_completed, finalize_run_active_seconds, finalize_run_wall_seconds, finalize_fix_dispatch_count, finalize_reviewer_verdict, finalize_step_result, finalize_stalled_no_response_count, merged_pr_provenance, finalize_github_parity."
          name: metrics
          in: query
      responses:
        "200":
          description: Aggregated metrics for the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeMetricsResponse"
        "400":
          description: Range or metrics filter could not be parsed.
