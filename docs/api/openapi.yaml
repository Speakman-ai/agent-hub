        "200":
          description: Server config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
    patch:
      tags:
        - Config
      summary: Update one or more config fields
      description: "Allowed keys: `claudeBin`, `cursorBin`, `geminiBin`, `codexBin`, `grokBin`, `defaultModel`, `defaultCwd`, `port`, `apiKey`, `openaiApiKey`, `publicUrl`, `codexDangerBypass`, `codexProfile`. Unknown keys are silently dropped. Returns the updated subset (with secrets masked)."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                claudeBin:
                  type: string
                cursorBin:
                  type: string
                geminiBin:
                  type: string
                codexBin:
                  type: string
                grokBin:
                  type: string
                defaultModel:
                  type: string
                defaultCwd:
                  type: string
                port:
                  type: integer
                apiKey:
                  type: string
                  nullable: true
                openaiApiKey:
                  type: string
                  nullable: true
                  description: Host OpenAI API key for Whisper transcription and session titles. Empty string or null clears it.
                transcriptionProvider:
                  type: string
                  enum:
                    - openai
                    - gemini
                  description: Voice-transcription provider for /api/transcribe. Must be `openai` or `gemini`; any other value returns 400.
                publicUrl:
                  type: string
                codexDangerBypass:
                  type: boolean
                codexProfile:
                  type: string
                  nullable: true
                  description: Codex CLI profile name. Pass null / empty string to clear. Forwarded as `--profile <name>` on every codex spawn.
              additionalProperties:
                nullable: true
              description: Partial config update. Unknown keys are ignored. At least one allowed key must be present, otherwise the handler returns 400.
      responses:
        "200":
          description: Updated keys (masked where applicable).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  updated:
                    type: object
                    additionalProperties:
                      nullable: true
                required:
                  - ok
                  - updated
        "400":
          description: No valid config fields provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigErrorResponse"
