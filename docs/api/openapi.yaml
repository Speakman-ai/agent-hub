      summary: Attach a replay to one of the project’s support tickets
      description: "Links a replay to a support ticket using the first-write attribution guard: the replay is attached only if it is unattributed or already owned by this project. Linking to the same ticket is idempotent. A replay already linked to a different ticket — or a ticket already linked to a different replay — is a 409 (unlink first). A capture owned by ANOTHER project is masked as 404 (no cross-project existence probe)."
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
        - schema:
            type: string
          required: true
