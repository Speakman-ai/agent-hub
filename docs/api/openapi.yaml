            application/json:
              schema:
                $ref: "#/components/schemas/ReplayIngestErrorResponse"
        "429":
          description: Per-IP (anonymous) or per-project (token) rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayIngestErrorResponse"
        "503":
          description: The replay’s storage backend could not be resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayIngestErrorResponse"
    get:
