openapi: 3.0.3
info:
  title: Agent Hub REST API
  version: 1.29.1
  description: |-
    REST API for **Agent Hub** — a full-stack platform for managing AI
    agent sessions, kanban boards, per-project wikis, heartbeats, and
    cron jobs.

    ### Authentication
    Most endpoints require one of:
    - A session cookie issued by `POST /api/auth/login`.
    - A user-owned API key minted via `POST /api/auth/keys`, sent as
      `Authorization: Bearer ahub_…` or `X-API-Key: ahub_…`.
    - The break-glass instance API key (`X-API-Key`), set via
      `~/.agent-hub/data/config.json` `apiKey`. Treated as Owner across
      every org — use only for automation / sub-agent spawn.

    ### Realtime
    Live updates (chat streaming, kanban / wiki events, cron output)
    are delivered over WebSocket on the same port as HTTP. This
    document covers the REST surface only.
  contact:
    name: Agent Hub
    url: https://github.com/Speakman-ai/agent-hub
  license:
    name: Proprietary
servers:
  - url: http://localhost:3051
    description: Local development server
  - url: https://hub.example.com
    description: Self-hosted production deployment (operator-defined)
security:
  - bearerAuth: []
  - apiKeyHeader: []
  - cookieAuth: []
tags:
  - name: Health
    description: Liveness and runtime info.
  - name: Auth
    description: Sign-in, API keys, per-user credential management.
  - name: Projects
    description: Project CRUD and metadata.
  - name: Agents
    description: Agent configuration under a project.
  - name: Sessions
    description: Chat sessions and message history.
  - name: Board
    description: Per-project kanban boards (columns, cards, epics, comments).
  - name: Wiki
    description: Per-project wiki with FTS5 + semantic search.
  - name: Heartbeats
    description: Per-agent scheduled check-ins.
  - name: Crons
    description: Project-scoped automated jobs.
  - name: Admin
    description: Owner-only administrative endpoints.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ahub_...
      description: "User-owned API key minted via `POST /api/auth/keys`. Send as `Authorization: Bearer ahub_...`."
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: Either a per-user `ahub_*` key or the break-glass instance API key from `~/.agent-hub/data/config.json` (`apiKey`).
    cookieAuth:
      type: apiKey
      in: cookie
      name: agent_hub_session
      description: Session cookie issued by `POST /api/auth/login`.
  schemas:
    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        engine:
          type: string
        model:
          type: string
        systemPrompt:
          type: string
        color:
          type: string
        avatar:
          type: string
        role:
          type: string
        reviewer:
          type: string
        canReview:
          type: boolean
        active:
          type: boolean
        delegationEnabled:
          type: boolean
        browserToolsEnabled:
          type: boolean
        browserViewportWidth:
          type: integer
        browserViewportHeight:
          type: integer
        browserPageLoadTimeoutMs:
          type: integer
        heartbeat:
          type: object
          properties:
            enabled:
              type: boolean
            interval:
              type: string
            prompt:
              type: string
          required:
            - enabled
            - interval
            - prompt
      required:
        - id
        - name
        - engine
      description: An agent. Many additional optional fields exist on the row (subAgents, hooks, mcpServers, …) — only the stable, documented surface is enumerated here.
    AgentEnriched:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          properties:
            lastActivity:
              type: string
              nullable: true
            lastMessage:
              type: object
              nullable: true
              properties:
                role:
                  type: string
                content:
                  type: string
                created_at:
                  type: string
              required:
                - role
                - content
                - created_at
      description: Agent shape + the most-recent session timestamp and a truncated last message.
    AgentsBulkEngineResponse:
      type: object
      properties:
        updated:
          type: integer
        engine:
          type: string
        model:
          type: string
      required:
        - updated
        - engine
        - model
      description: Result of POST /api/agents/bulk-engine.
    AgentErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: number
              message:
                type: string
            required:
              - path
              - message
      required:
        - error
      description: Error envelope. `details` is populated for 400 schema-validation errors with one entry per failing Zod issue.
    AuditErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: number
              message:
                type: string
            required:
              - path
              - message
      required:
        - error
      description: Error envelope for audit/roster routes.
    AuditReport:
      type: object
      properties: {}
      additionalProperties:
        nullable: true
      description: Post-scaffold audit report. Concrete shape lives in `server/audit/audit-service.ts`.
    TrackSuggestion:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        agentId:
          type: string
          nullable: true
        score:
          type: number
      required:
        - id
        - label
        - agentId
      additionalProperties:
        nullable: true
      description: Keyword-matched track → agent suggestion.
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
      required:
        - error
      description: Standard error envelope used across the API.
    ZodIssue:
      type: object
      properties:
        path:
          type: array
          items:
            anyOf:
              - type: string
              - type: number
        message:
          type: string
        code:
          type: string
      required:
        - path
        - message
      description: A single Zod validation issue. Returned on 400 responses caused by request-body shape errors.
    ZodErrorResponse:
      type: object
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ZodIssue"
      required:
        - error
      description: A 400 response produced by Zod body/query validation. `issues` lists each field that failed.
    UserSummary:
      type: object
      properties:
        id:
          type: string
          nullable: true
        username:
          type: string
        role:
          type: string
          enum:
            - Owner
            - Admin
            - User
        createdAt:
          anyOf:
            - type: string
            - type: number
            - nullable: true
      required:
        - username
        - role
    TokenResponse:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            role:
              type: string
              enum:
                - Owner
                - Admin
                - User
          required:
            - username
            - role
      required:
        - token
        - expiresAt
        - user
    AuthSetupBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    AuthLoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    AuthCreateUserBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum:
            - Owner
            - Admin
            - User
      required:
        - username
        - password
    AuthUpdateUserRoleBody:
      type: object
      properties:
        role:
          type: string
          enum:
            - Owner
            - Admin
            - User
      required:
        - role
    AuthPasswordResetBody:
      type: object
      properties:
        newPassword:
          type: string
      required:
        - newPassword
    CreateApiKeyBody:
      type: object
      properties:
        name:
          type: string
        expiresInDays:
          anyOf:
            - type: number
            - type: string
            - nullable: true
          description: 1–3650 days, or null/omitted to never expire. Strings are coerced to numbers.
      required:
        - name
    CreateInviteBody:
      type: object
      properties:
        role:
          type: string
          enum:
            - Owner
            - Admin
            - User
        email:
          type: string
          nullable: true
        ttlHours:
          type: number
    AcceptInviteBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    UpdateClaudeAuthBody:
      type: object
      properties:
        anthropicApiKey:
          type: string
          nullable: true
        claudeCodeOAuthToken:
          type: string
          nullable: true
        claudeCodeOAuthExpiresAt:
          type: string
          nullable: true
      description: Per-user Claude credentials. Each field is whitelisted before reaching the DB — unknown keys are silently dropped.
    UpdateSingleKeyAuthBody:
      type: object
      properties:
        apiKey:
          type: string
          nullable: true
      description: Per-user single-key engine credentials (Cursor / Gemini / Codex).
    UpsertSkillCredentialBody:
      type: object
      properties:
        skill_id:
          type: string
        key_name:
          type: string
        agent_id:
          type: string
        value:
          type: string
      required:
        - skill_id
        - key_name
      description: "Upsert a per-user skill credential. `agent_id` is optional: omit it when setting a personal credential for a bundled default skill from the Account page."
    AgentEngineOverrideEntry:
      type: object
      properties:
        engine:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
      required:
        - engine
      description: A per-agent engine override on the caller. The optional `model` further pins a specific CLI model id within that engine; when omitted the per-engine default (or hub fallback) is used.
    PutAgentEngineOverridesBody:
      type: object
      properties:
        agentEngineOverrides:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AgentEngineOverrideEntry"
      required:
        - agentEngineOverrides
    ClaudeLoginBody:
      type: object
      properties:
        method:
          type: string
        email:
          type: string
        sso:
          type: boolean
    ClaudeCallbackBody:
      type: object
      properties:
        code:
          type: string
          description: OAuth authorization code from Anthropic.
      required:
        - code
    ApiKeyOnlyBody:
      type: object
      properties:
        apiKey:
          type: string
          nullable: true
    ApiKeyRequiredBody:
      type: object
      properties:
        apiKey:
          type: string
          minLength: 1
      required:
        - apiKey
    OauthTokenBody:
      type: object
      properties:
        oauthToken:
          type: string
          nullable: true
    GithubConnectTokenBody:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
        - token
    KanbanBoard:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        created_at:
          type: string
      required:
        - id
        - project_id
        - name
        - created_at
      description: A project kanban board (one per project).
    KanbanColumn:
      type: object
      properties:
        id:
          type: string
        board_id:
          type: string
        name:
          type: string
        position:
          type: integer
        color:
          type: string
          nullable: true
        created_at:
          type: string
      required:
        - id
        - board_id
        - name
        - position
        - color
        - created_at
      description: A column on a kanban board (To Do, In Progress, …).
    KanbanCard:
      type: object
      properties:
        id:
          type: string
        column_id:
          type: string
        board_id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum:
            - low
            - medium
            - high
            - urgent
        assignee:
          type: string
          nullable: true
        labels:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        github_issue_url:
          type: string
          nullable: true
        pr_url:
          type: string
          nullable: true
        review_status:
          type: string
          nullable: true
          enum:
            - awaiting_review
            - reviewing
            - approved
            - changes_requested
            - null
        created_by:
          type: string
          nullable: true
        position:
          type: integer
        epic_id:
          type: string
          nullable: true
        documented:
          type: integer
        dispatched_by_autonomous:
          type: integer
        assign_model:
          type: string
          nullable: true
        assign_engine:
          type: string
          nullable: true
          description: Optional engine override pinned at assign / update time. One of "claude-code", "cursor-agent", "gemini-cli", or "codex-cli". Overrides the assignee agent's shared engine at session spawn.
        pr_base_branch:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - column_id
        - board_id
        - title
        - description
        - priority
        - assignee
        - labels
        - session_id
        - github_issue_url
        - pr_url
        - review_status
        - created_by
        - position
        - epic_id
        - documented
        - dispatched_by_autonomous
        - created_at
        - updated_at
      description: A kanban card (task / ticket).
    KanbanBlockerLink:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        column_id:
          type: string
        done:
          type: boolean
      required:
        - id
        - title
        - column_id
        - done
      description: A blocker / blocked-by relationship view. `done` is derived from the referenced card's column ("Done"-ish columns resolve the link).
    KanbanCardEnriched:
      allOf:
        - $ref: "#/components/schemas/KanbanCard"
        - type: object
          properties:
            blockers:
              type: array
              items:
                $ref: "#/components/schemas/KanbanBlockerLink"
            blocks:
              type: array
              items:
                $ref: "#/components/schemas/KanbanBlockerLink"
          required:
            - blockers
            - blocks
      description: A card with its blocker graph attached (used by GET /board).
    KanbanEpic:
      type: object
      properties:
        id:
          type: string
        board_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
        autonomous:
          type: integer
        autonomous_interval:
          type: integer
        autonomous_max_concurrent:
          type: integer
        autonomous_model:
          type: string
          nullable: true
        orchestration_budgets_json:
          type: string
          nullable: true
        pr_base_branch:
          type: string
          nullable: true
        position:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - board_id
        - name
        - description
        - color
        - autonomous
        - autonomous_interval
        - autonomous_max_concurrent
        - autonomous_model
        - position
        - created_at
        - updated_at
      description: A kanban epic — a group of related cards.
    KanbanCardComment:
      type: object
      properties:
        id:
          type: string
        card_id:
          type: string
        author:
          type: string
        content:
          type: string
        created_at:
          type: string
      required:
        - id
        - card_id
        - author
        - content
        - created_at
      description: A comment posted to a kanban card.
    BoardResponse:
      type: object
      properties:
        board:
          $ref: "#/components/schemas/KanbanBoard"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/KanbanColumn"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/KanbanCardEnriched"
        epics:
          type: array
          items:
            $ref: "#/components/schemas/KanbanEpic"
      required:
        - board
        - columns
        - cards
        - epics
      description: "Full board state: board metadata + columns + cards (with blocker graph) + epics."
    BoardErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: number
              message:
                type: string
            required:
              - path
              - message
        path:
          type: array
          items:
            type: string
      required:
        - error
      description: Error envelope. `details` is populated for 400 schema-validation errors; `path` is populated for the 409 cycle error from the blocker endpoint.
    Session:
      type: object
      properties:
        id:
          type: string
        agent_id:
          type: string
        name:
          type: string
        engine:
          type: string
        checkpoint_rewind_supported:
          type: boolean
          description: "True when the session engine supports Claude Code checkpoint file rewind (`POST /api/sessions/{sessionId}/rewind`). Today only `claude-code`. Other engines return HTTP 400 with `code: checkpoint_rewind_unsupported_engine` from that endpoint."
        model:
          type: string
        use_worktree:
          type: integer
        ask_mode:
          type: integer
        react_loop_enabled:
          type: integer
          nullable: true
        worktree_path:
          type: string
          nullable: true
        worktree_branch:
          type: string
          nullable: true
        engine_session_id:
          type: string
          nullable: true
        cron_id:
          type: integer
          nullable: true
        deleted_at:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        owner_user_id:
          type: string
          nullable: true
        orchestration_phase:
          type: string
          nullable: true
        orchestration_meta:
          type: string
          nullable: true
      required:
        - id
        - agent_id
        - name
        - engine
        - checkpoint_rewind_supported
        - model
        - use_worktree
        - ask_mode
        - created_at
        - updated_at
      description: A chat session row. Booleans are stored as 0/1 SQLite ints for `use_worktree`, `ask_mode`, `react_loop_enabled`. `use_worktree` is always 1 for user-created sessions; the column is preserved for legacy rows and internal shared-checkout callers (e.g., preview-wizard).
    Message:
      type: object
      properties:
        id:
          type: string
        session_id:
          type: string
        role:
          type: string
          enum:
            - user
            - assistant
            - system
        content:
          type: string
        engine:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        attachments:
          type: string
          nullable: true
        metadata:
          type: string
          nullable: true
        created_at:
          type: string
      required:
        - id
        - session_id
        - role
        - content
        - created_at
      description: A single message row inside a session.
    SessionErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: Optional machine-readable code (for example `checkpoint_rewind_unsupported_engine` from `POST .../rewind` when the session is not Claude Code).
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: number
              message:
                type: string
            required:
              - path
              - message
      required:
        - error
      description: Error envelope. `details` is populated for 400 schema-validation errors with one entry per failing Zod issue.
    BugReportsErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Error envelope for bug-report intake.
    BugReportFormFields:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        severity:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
          default: medium
        description:
          type: string
        sourceUrl:
          type: string
        userAgent:
          type: string
        appVersion:
          type: string
        clientType:
          type: string
          enum:
            - web
            - electron
            - mobile
        currentProjectId:
          type: string
        currentAgentId:
          type: string
        screenshot:
          type: string
          format: binary
          description: Optional PNG or JPEG (≤5 MB). Sent as a binary file part in the multipart body.
      required:
        - title
      description: Multipart form fields for the bug-report intake. Documentation-only; the handler reads multipart bytes directly because the body is `application/octet-stream` to express.
    CapturesErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Error envelope for captures routes.
    PrCapture:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        pr_number:
          type: integer
          nullable: true
        pr_url:
          type: string
          nullable: true
        branch:
          type: string
        commit_sha:
          type: string
          nullable: true
        repo_url:
          type: string
        status:
          anyOf:
            - type: string
              enum:
                - queued
                - running
                - done
                - error
            - type: string
        error:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        artifacts:
          type: array
          items:
            nullable: true
      required:
        - id
        - project_id
        - pr_number
        - pr_url
        - branch
        - commit_sha
        - repo_url
        - status
      additionalProperties:
        nullable: true
      description: A single Playwright PR-capture row.
    CapturesStatus:
      type: object
      properties:
        enabled:
          type: boolean
        playwrightAvailable:
          type: boolean
      required:
        - enabled
        - playwrightAvailable
      description: Captures feature flag + Playwright availability.
    ConfigErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: number
              message:
                type: string
            required:
              - path
              - message
      required:
        - error
      description: Error envelope for config / github routes.
    AppConfig:
      type: object
      properties:
        claudeBin:
          type: string
        cursorBin:
          type: string
        geminiBin:
          type: string
        codexBin:
          type: string
        defaultModel:
          type: string
        defaultCwd:
          type: string
        port:
          type: integer
        publicUrl:
          type: string
        apiKey:
          type: string
        authRequired:
          type: boolean
        githubApp:
          type: object
          nullable: true
          properties:
            appId:
              type: string
            appSlug:
              type: string
              nullable: true
            hasInstallation:
              type: boolean
            installations:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  account:
                    type: string
                  accountType:
                    type: string
                required:
                  - id
                  - account
                  - accountType
          required:
            - appId
            - appSlug
            - hasInstallation
            - installations
        personalOAuth:
          type: object
          properties:
            configured:
              type: boolean
            clientId:
              type: string
              nullable: true
          required:
            - configured
            - clientId
        botGithubToken:
          type: string
        botGithubTokenSet:
          type: boolean
        botGithubUser:
          type: string
          nullable: true
        anthropicApiKey:
          type: string
        anthropicApiKeySet:
          type: boolean
        codexDangerBypass:
