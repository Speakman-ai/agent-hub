      description: "Allowed keys: `claudeBin`, `cursorBin`, `geminiBin`, `codexBin`, `defaultModel`, `defaultCwd`, `port`, `apiKey`, `publicUrl`, `botGithubToken`, `codexDangerBypass`, `lanMode`. Unknown keys are silently dropped. Returns the updated subset (with `botGithubToken` masked)."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                claudeBin:
                  type: string
                cursorBin:
                  type: string
                geminiBin:
                  type: string
                codexBin:
                  type: string
                defaultModel:
                  type: string
                defaultCwd:
                  type: string
                port:
                  type: integer
                apiKey:
                  type: string
                  nullable: true
                publicUrl:
                  type: string
                botGithubToken:
                  type: string
                  nullable: true
                codexDangerBypass:
                  type: boolean
                lanMode:
                  type: boolean
              additionalProperties:
                nullable: true
              description: Partial config update. Unknown keys are ignored. At least one allowed key must be present, otherwise the handler returns 400.
      responses:
        "200":
          description: Updated keys (masked where applicable).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  updated:
                    type: object
                    additionalProperties:
                      nullable: true
                required:
                  - ok
