      description: Defaults to hybrid mode. Falls back to pure FTS when the Gemini API key is missing or the query embedding fails. Returns an empty `results` array for blank queries so the caller can branch on configuration without a separate health probe. Invalid `?limit=` values (non-numeric) and unknown `?mode=` values return 400.
      parameters:
        - schema:
            type: string
            description: Project ID (slug).
          required: true
          description: Project ID (slug).
          name: projectId
          in: path
        - schema:
            type: string
          required: false
          name: q
          in: query
        - schema:
            type: string
            enum:
              - hybrid
              - semantic
              - fts
          required: false
          name: mode
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Search envelope.
