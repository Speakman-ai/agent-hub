      description: Partial update. Fields omitted from the body keep their current value. Nullable fields can be cleared by sending `null` explicitly.
      parameters:
        - schema:
            type: string
            description: Project ID (slug).
          required: true
          description: Project ID (slug).
          name: projectId
          in: path
        - schema:
            type: string
            description: Kanban card UUID.
          required: true
          description: Kanban card UUID.
          name: cardId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                description:
                  type: string
                  nullable: true
                priority:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
                    - urgent
                assignee:
