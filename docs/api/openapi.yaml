                                  description: Check kind. `contains`/`not_contains` are case-sensitive substring; `icontains` is case-insensitive; `regex` is a JS regular-expression source matched against the output.
                                value:
                                  type: string
                                  example: cd server && npx vitest
                              required:
                                - type
                                - value
                              additionalProperties: false
                              description: One objective pass/fail check applied to a run output.
                            passed:
                              type: boolean
                            timedOut:
                              type: boolean
                              description: Set on a regex assertion aborted by the ReDoS time bound (treated as not matched).
                          required:
                            - assertion
                            - passed
                    required:
                      - graded
                      - passed
                      - assertionResults
                  error:
                    type: string
                required:
                  - output
                  - grade
              improved:
                type: boolean
                nullable: true
            required:
              - evalId
              - prompt
              - graded
              - withSkill
              - baseline
              - improved
        markdown:
          type: string
          description: Rendered side-by-side report the coach surfaces / saves.
        engine:
          type: string
        model:
          type: string
      required:
        - skillId
        - total
        - graded
        - withSkillPassed
        - baselinePassed
        - improvedCount
        - results
        - markdown
        - engine
        - model
      description: With-skill vs baseline run summary plus a Markdown report.
    SkillEvalRunBody:
      type: object
      properties:
        evals:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Slug id (lowercase letters, digits, hyphens) — lets a single eval be re-run.
                example: happy-path
              prompt:
                type: string
                description: Realistic user prompt fed identically to the with-skill and baseline runs.
                example: How do I run only the server tests for the file I just edited?
              assertions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - contains
                        - icontains
                        - not_contains
                        - regex
                      description: Check kind. `contains`/`not_contains` are case-sensitive substring; `icontains` is case-insensitive; `regex` is a JS regular-expression source matched against the output.
                    value:
                      type: string
                      example: cd server && npx vitest
                  required:
                    - type
                    - value
                  additionalProperties: false
                  description: One objective pass/fail check applied to a run output.
                description: Objective checks. Omit for a subjective eval that only gets a side-by-side diff (no auto pass/fail).
            required:
              - id
              - prompt
            additionalProperties: false
            description: 'A single eval: one prompt plus optional objective assertions. Unknown fields are rejected (a typo like "assertion" would otherwise silently drop the checks).'
          description: Inline eval suite to run instead of the saved evals.json — iterate on the suite without PUTting it first. Only skips saving the eval suite; the skill itself must already be saved (its SKILL.md is loaded from disk).
        evalIds:
          type: array
          items:
            type: string
          minItems: 1
          description: Restrict the run to these eval ids (single-prompt re-run). Must be non-empty when present — an empty array is a 400, not "run everything" (omit the field to run the whole suite). Every id must exist in the suite — a partial miss is a 400 listing the missing ids, never a silent run of the resolvable subset.
        engine:
          type: string
          enum:
            - claude-code
            - cursor-agent
            - codex-cli
          description: "Engine to run on. Must be an agent CLI — Gemini is excluded. An unknown value is rejected (400). When set, this is the engine the run uses: if it is unavailable the request 400s rather than silently falling back to another CLI (which would make results misleading). Omit to fall back across the agent CLIs."
        model:
          type: string
          description: Model override (non-empty).
        timeoutMs:
          type: integer
          description: Per-run timeout (ms). Must be an integer in [1000, 600000]; out of range is 400.
      additionalProperties: false
      description: Options for an eval run. All fields optional; unknown keys are rejected (400) so a typo cannot silently change the run.
