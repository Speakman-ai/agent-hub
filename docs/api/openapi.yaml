          in: path
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          description: No project with this slug, or the caller cannot see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetailErrorResponse"
  /api/projects/{projectId}/webhook/auto-configure:
    post:
      tags:
        - Projects
      summary: One-click GitHub webhook setup for a project
      description: "Creates a `webhook_configs` row with the standard event bundle (pull_request.opened / .synchronize / .review_comment.created enabled; .closed / review.submitted / check_suite.completed disabled) and registers the webhook on GitHub via the installation-token path when a GitHub App is configured, or the gh-CLI fallback otherwise. Idempotent: returns 409 with `existingConfigId` if an enabled webhook config already exists for the project. Requires `githubRepo` set on the project; returns 400 otherwise. When the GitHub App is installed on the repo owner, the per-repo registration is skipped — the local row is still created so the missing-webhook UI banner clears, but the App is the active delivery path."
      parameters:
        - schema:
            type: string
            description: Project slug (e.g. `agent-hub`).
          required: true
          description: Project slug (e.g. `agent-hub`).
          name: projectId
          in: path
      responses:
        "200":
          description: Webhook config created + registration attempted. Inspect `registration.ok` to learn whether the GitHub side succeeded; the local row is created either way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAutoConfigureResponse"
        "400":
          description: Project has no `githubRepo` configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAutoConfigureErrorResponse"
        "404":
          description: No project with this slug, or the caller cannot see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAutoConfigureErrorResponse"
        "409":
          description: An enabled webhook config already exists for this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAutoConfigureErrorResponse"
        "500":
          description: Server-side failure (DB outage, GitHub API exception).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAutoConfigureErrorResponse"
  /api/webhooks/hmac-failures:
    get:
      tags:
        - Webhooks
      summary: Recent webhook HMAC verification failures (in-memory ring buffer)
      description: Returns the most-recent webhook deliveries that the server rejected because neither the per-repo secret nor the GitHub App webhook secret could verify the `x-hub-signature-256` header. Used by the web client to surface a banner when drift is happening live.
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Up to `limit` (default 20, max 100) recent failures, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookHmacFailureList"
  /api/projects/{projectId}/wiki:
    get:
      tags:
        - Wiki
      summary: List wiki pages (optionally filtered or FTS-searched)
      description: When `?q=` is set, returns FTS5 hits (`WikiSearchHit[]` — list-item fields + `snippet` + `rank`, no `content`). When `?category=` is set, returns pages in that category (`WikiPageListItem[]`, no `content`). Otherwise returns every page in the project (`WikiPageListItem[]`, no `content`). `limit` only applies to the `?q=` path; the bare and category responses are unpaginated. Invalid `?limit=` values (non-numeric) and other schema violations return 400.
      parameters:
        - schema:
            type: string
            description: Project ID (slug).
          required: true
          description: Project ID (slug).
          name: projectId
          in: path
        - schema:
            type: string
          required: false
          name: q
          in: query
        - schema:
            type: string
          required: false
          name: category
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Wiki pages (shape depends on the query params — see description).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WikiPageListItem"
        "400":
          description: Query parameter validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
    post:
      tags:
        - Wiki
      summary: Create a wiki page
      description: Slug is derived from `title` via lowercase + non-alphanumeric squash. Returns 409 when the resulting slug collides with an existing page on the same project.
      parameters:
        - schema:
            type: string
            description: Project ID (slug).
          required: true
          description: Project ID (slug).
          name: projectId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                content:
                  type: string
                category:
                  type: string
                updatedBy:
                  type: string
              required:
                - title
      responses:
        "201":
          description: New page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiPage"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
        "409":
          description: Slug collision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
  /api/projects/{projectId}/wiki/search:
    get:
      tags:
        - Wiki
      summary: Search wiki pages (hybrid / semantic / fts)
      description: Defaults to hybrid mode. Falls back to pure FTS when the Gemini API key is missing or the query embedding fails. Returns an empty `results` array for blank queries so the caller can branch on configuration without a separate health probe. Invalid `?limit=` values (non-numeric) and unknown `?mode=` values return 400.
      parameters:
        - schema:
            type: string
            description: Project ID (slug).
          required: true
          description: Project ID (slug).
          name: projectId
          in: path
        - schema:
            type: string
          required: false
          name: q
          in: query
        - schema:
            type: string
            enum:
              - hybrid
              - semantic
              - fts
          required: false
          name: mode
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Search envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiSearchResponse"
        "400":
          description: Query parameter validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
        "500":
          description: Underlying search or embedding error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiErrorResponse"
