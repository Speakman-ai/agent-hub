  /api/sessions/{sessionId}/messages:
    get:
      tags:
        - Sessions
      summary: List messages in a session (oldest first)
      description: Without `paginated`, returns the full transcript when it fits the JSON response budget, otherwise a truncated envelope with the newest rows; `limit` slices the newest N. With `paginated=1`, returns a DB-limited keyset page (newest page first, `limit` page size, default 40, max 200) as a plain oldest-first array; pass `before` (the oldest loaded message id) to fetch the next older page. Powers the client reverse-infinite-scroll loader.
      parameters:
        - schema:
            type: string
            description: Session UUID.
          required: true
          description: Session UUID.
          name: sessionId
          in: path
        - schema:
            type: string
            description: "Newest N messages (positive integer). Legacy: in-memory slice. Paginated: DB page size, clamped to 200 (default 40)."
          required: false
          description: "Newest N messages (positive integer). Legacy: in-memory slice. Paginated: DB page size, clamped to 200 (default 40)."
          name: limit
          in: query
        - schema:
            type: string
            description: Set to `1` (or `true`) to opt into DB-side keyset pagination (newest page first).
          required: false
          description: Set to `1` (or `true`) to opt into DB-side keyset pagination (newest page first).
          name: paginated
          in: query
        - schema:
            type: string
            description: The oldest already-loaded message id. Returns the page of messages immediately older than it. Implies pagination.
          required: false
          description: The oldest already-loaded message id. Returns the page of messages immediately older than it. Implies pagination.
          name: before
          in: query
      responses:
        "200":
          description: Message rows (oldest-first), or a truncated envelope for very large un-paginated transcripts.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/Message"
