  /api/crons:
    get:
      tags:
        - Crons
      summary: List every cron job
      responses:
        "200":
          description: Array of cron jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cron"
    post:
      tags:
        - Crons
      summary: Create a new cron job
      description: "`schedule` must be a valid cron expression. `engine` (when provided) must be one of: claude-code, cursor-agent, codex-cli, gemini-cli — when omitted/null, the cron inherits its engine from the resolved skill principal agent at run time, falling back to `claude-code`. `model` is validated against `engineValidModels[engine]` for whichever engine the cron resolves to. `skill_principal_agent_id` (when provided) must be an agent in the cron's project."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                schedule:
                  type: string
                prompt:
                  type: string
                  minLength: 1
                cwd:
                  type: string
                enabled:
                  type: boolean
                project_id:
                  type: string
                  nullable: true
                timeout_ms:
                  anyOf:
                    - type: string
                      enum:
                        - ""
                    - nullable: true
                    - type: integer
                      minimum: 0
                      exclusiveMinimum: true
                notify_on_run:
                  anyOf:
                    - type: boolean
                    - type: number
                      enum:
                        - 0
                    - type: number
                      enum:
                        - 1
                    - type: string
                      enum:
                        - "0"
                    - type: string
                      enum:
                        - "1"
                    - type: string
                      enum:
                        - "true"
                    - type: string
                      enum:
                        - "false"
                model:
                  type: string
                  nullable: true
                skill_principal_agent_id:
                  type: string
                  nullable: true
                engine:
                  anyOf:
                    - type: string
                    - nullable: true
                    - type: string
                      enum:
                        - ""
              required:
                - name
                - schedule
                - prompt
      responses:
        "200":
          description: Created cron.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cron"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronErrorResponse"
  /api/crons/{id}:
    put:
      tags:
        - Crons
      summary: Update a cron job
      description: Omitted fields preserve the existing value. `timeout_ms` / `notify_on_run` / `model` / `skill_principal_agent_id` / `engine` follow the present-key tristate (`undefined` = preserve, `null`/`""` = clear). When `engine` changes and an existing `model` is no longer valid for the new engine, the model is cleared (the user can resend a compatible value in the same PUT).
      parameters:
        - schema:
            type: string
            description: Cron job numeric id (URL string).
          required: true
          description: Cron job numeric id (URL string).
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                schedule:
                  type: string
                prompt:
                  type: string
                cwd:
                  type: string
                enabled:
                  type: boolean
                project_id:
                  type: string
                  nullable: true
                timeout_ms:
                  anyOf:
                    - type: string
                      enum:
                        - ""
                    - nullable: true
                    - type: integer
                      minimum: 0
                      exclusiveMinimum: true
                notify_on_run:
                  anyOf:
                    - type: boolean
                    - type: number
                      enum:
                        - 0
                    - type: number
                      enum:
                        - 1
                    - type: string
                      enum:
                        - "0"
                    - type: string
                      enum:
                        - "1"
                    - type: string
                      enum:
                        - "true"
                    - type: string
                      enum:
                        - "false"
                model:
