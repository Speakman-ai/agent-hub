        "404":
          description: Cron not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronErrorResponse"
    delete:
      tags:
        - Crons
      summary: Delete a cron job
      description: Disables the in-memory schedule and removes the row.
      parameters:
        - schema:
            type: string
            description: Cron job numeric id (URL string).
          required: true
          description: Cron job numeric id (URL string).
