      description: Update a project skill. Provide EITHER structured fields (`description` required; `name` optional, resolved from the path) OR a raw `content` SKILL.md. The resolved frontmatter is validated and returns 400 on a missing/invalid `description` (or a `name` that disagrees with the path).
    SkillWriteResult:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        path:
          type: string
          description: Absolute path to the skill directory on disk.
      required:
        - id
        - name
        - description
        - path
      description: The created / updated project skill.
    SkillWriteError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Error envelope.
    GlobalSkillListItem:
