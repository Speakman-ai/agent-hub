openapi: 3.0.3
info:
  title: Agent Hub REST API
  version: 1.21.3
  description: |
    REST API for **Agent Hub** — a full-stack platform for managing AI agent
    sessions, kanban boards, per-project wikis, heartbeats, and cron jobs.

    > **First-pass spec.** This document is hand-curated and covers the
    > major external surfaces. Internal / admin-only routes are flagged
    > with `x-internal: true` and stripped from the published bundle. The
    > long-term plan is to generate schemas from Zod registries at the
    > route layer (see the API documentation epic on the kanban board).

    ### Authentication
    Most endpoints require one of:
    - A session cookie issued by `POST /api/auth/login`.
    - A user-owned API key minted via `POST /api/auth/keys`, sent as
      `Authorization: Bearer ahub_…` or `X-API-Key: ahub_…`.
    - The break-glass instance API key (`X-API-Key`), set via
      `~/.agent-hub/data/config.json` `apiKey`. Treated as Owner across
      every org — use only for automation / sub-agent spawn.

    ### Realtime
    Live updates (chat streaming, kanban / wiki events, cron output) are
    delivered over WebSocket on the same port as HTTP. This document
    covers the REST surface only.
  contact:
    name: Agent Hub
    url: https://github.com/Speakman-ai/agent-hub
  license:
    name: Proprietary
servers:
  - url: http://localhost:3051
    description: Local development server
  - url: https://hub.example.com
    description: Self-hosted production deployment (operator-defined)

tags:
  - name: Health
    description: Liveness and runtime info.
  - name: Auth
    description: Sign-in, API keys, per-user credential management.
  - name: Projects
    description: Project CRUD and metadata.
  - name: Agents
    description: Agent configuration under a project.
  - name: Sessions
    description: Chat sessions and message history.
  - name: Board
    description: Per-project kanban boards (columns, cards, epics, comments).
  - name: Wiki
    description: Per-project wiki with FTS5 + semantic search.
  - name: Heartbeats
    description: Per-agent scheduled check-ins.
  - name: Crons
    description: Project-scoped automated jobs.
  - name: Admin
    description: Owner-only administrative endpoints.

security:
  - bearerAuth: []
  - apiKeyHeader: []

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Liveness + runtime info
      description: |
        Returns the server's port, configured CLI binaries, project /
        agent counts, and basic process metrics. Safe to poll from
        external monitoring.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email + password
      description: |
        Issues a session cookie (`agent_hub_session`) on success. Rate
        limited per-IP — see `server/routes/auth.ts` for the current
        burst / sustained limits.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Logged in. Cookie is set via `Set-Cookie`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { description: Invalid credentials. }
        '429': { description: Too many attempts — try again later. }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Return the authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { description: Not signed in. }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      responses:
        '204': { description: Cookie cleared. }

  /api/auth/keys:
    get:
      tags: [Auth]
      summary: List active API keys for the caller
      responses:
        '200':
          description: Active keys (plaintext never returned)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKeySummary' }
    post:
      tags: [Auth]
      summary: Create a personal API key
      description: |
        The plaintext token is returned **once**, in the `token` field.
        Subsequent reads only return the prefix.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: Human-readable label. }
                expiresInDays:
                  type: integer
                  description: 1–3650; omit for non-expiring.
                  nullable: true
      responses:
        '201':
          description: Key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  token: { type: string, description: Plaintext — shown once. }
                  prefix: { type: string }
                  createdAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time, nullable: true }

  /api/auth/keys/{id}:
    delete:
      tags: [Auth]
      summary: Soft-revoke an API key
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Revoked. }
        '404': { description: Key not found or not owned by caller. }

  /api/auth/users:
    get:
      tags: [Admin]
      summary: List org members
      description: Admin+ required.
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
    post:
      tags: [Admin]
      summary: Create a user (Owner only)
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                role: { type: string, enum: [Owner, Admin, User] }
      responses:
        '201': { description: Created. }

  /api/projects:
    get:
      tags: [Projects]
      summary: List visible projects for the caller
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
    post:
      tags: [Projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }

  /api/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Get a project by slug
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { description: Not found / not visible. }
    patch:
      tags: [Projects]
      summary: Update project fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
    delete:
      tags: [Projects]
      summary: Delete a project
      responses:
        '204': { description: Deleted. }

  /api/agents:
    get:
      tags: [Agents]
      summary: List all agents (across visible projects)
      responses:
        '200':
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }
    post:
      tags: [Agents]
      summary: Create an agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }

  /api/agents/{agentId}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    patch:
      tags: [Agents]
      summary: Update an agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
    delete:
      tags: [Agents]
      summary: Delete an agent
      responses:
        '204': { description: Deleted. }

  /api/agents/{agentId}/sessions:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      tags: [Sessions]
      summary: List sessions for an agent
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
    post:
      tags: [Sessions]
      summary: Create a new session
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }

  /api/sessions/{sessionId}:
    parameters:
      - in: path
        name: sessionId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Sessions]
      summary: Get a session
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
    delete:
      tags: [Sessions]
      summary: Delete a session
      responses:
        '204': { description: Deleted. }

  /api/sessions/{sessionId}/messages:
    parameters:
      - in: path
        name: sessionId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Sessions]
      summary: Get message history for a session
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }

  /api/projects/{projectId}/board:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Board]
      summary: Full board (columns + cards + epics + blocker edges)
      responses:
        '200':
          description: Board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Board' }

  /api/projects/{projectId}/board/cards:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Board]
      summary: Flat list of cards on the board
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Card' }
    post:
      tags: [Board]
      summary: Create a card
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }

  /api/projects/{projectId}/board/cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - in: path
        name: cardId
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Board]
      summary: Update a card (title, description, priority, epicId, …)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
    delete:
      tags: [Board]
      summary: Delete a card
      responses:
        '204': { description: Deleted. }

  /api/projects/{projectId}/board/cards/{cardId}/move:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - in: path
        name: cardId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Board]
      summary: Move a card between columns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [columnId]
              properties:
                columnId: { type: string, format: uuid }
                position: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Card moved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }

  /api/projects/{projectId}/board/cards/{cardId}/blockers:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - in: path
        name: cardId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Board]
      summary: Declare that a card is blocked by another
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blockedByCardId]
              properties:
                blockedByCardId: { type: string, format: uuid }
      responses:
        '201':
          description: Blocker edge created
        '409':
          description: |
            Either the edge already exists (`{"error":"duplicate"}`) or
            adding it would create a cycle
            (`{"error":"cycle","path":[…]}`).

  /api/projects/{projectId}/board/cards/{cardId}/blockers/{blockedByCardId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - in: path
        name: cardId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: blockedByCardId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Board]
      summary: Remove a blocker edge
      responses:
        '204': { description: Removed. }
        '404': { description: Edge not found (idempotent). }

  /api/projects/{projectId}/board/epics:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Board]
      summary: List epics on the board
      responses:
        '200':
          description: Epics
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Epic' }
    post:
      tags: [Board]
      summary: Create an epic
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EpicCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Epic' }

  /api/projects/{projectId}/wiki:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Wiki]
      summary: List wiki pages (optionally filtered by category)
      parameters:
        - in: query
          name: category
          schema: { type: string }
      responses:
        '200':
          description: Pages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WikiPageSummary' }
    post:
      tags: [Wiki]
      summary: Create a wiki page
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WikiPageCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WikiPage' }
        '409': { description: Slug collision — page already exists. }

  /api/projects/{projectId}/wiki/search:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Wiki]
      summary: Hybrid FTS + semantic search
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: mode
          schema: { type: string, enum: [hybrid, fts, semantic] }
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WikiSearchHit' }

  /api/projects/{projectId}/wiki/{slug}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      tags: [Wiki]
      summary: Get a wiki page by slug
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WikiPage' }
        '404': { description: Page not found. }
    put:
      tags: [Wiki]
      summary: Update a wiki page
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WikiPageUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WikiPage' }
    delete:
      tags: [Wiki]
      summary: Delete a wiki page
      responses:
        '204': { description: Deleted. }

  /api/heartbeats:
    get:
      tags: [Heartbeats]
      summary: List heartbeats across all agents
      responses:
        '200':
          description: Heartbeats + runtime state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Heartbeat' }

  /api/heartbeats/{agentId}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    put:
      tags: [Heartbeats]
      summary: Configure (or disable) an agent's heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: { type: string }
                schedule:
                  type: string
                  description: cron expression (UTC)
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Heartbeat' }

  /api/crons:
    get:
      tags: [Crons]
      summary: List project crons
      responses:
        '200':
          description: Crons
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Cron' }
    post:
      tags: [Crons]
      summary: Create a cron
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CronCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cron' }

  /api/crons/{cronId}:
    parameters:
      - in: path
        name: cronId
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Crons]
      summary: Update a cron
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CronUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cron' }
    delete:
      tags: [Crons]
      summary: Delete a cron
      responses:
        '204': { description: Deleted. }

  /api/crons/{cronId}/run:
    parameters:
      - in: path
        name: cronId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Crons]
      summary: Trigger a cron run now
      responses:
        '202': { description: Run dispatched. }

  /api/admin/projects:
    get:
      tags: [Admin]
      summary: All projects across the instance (Owner only)
      x-internal: true
      description: Internal admin tooling. Not part of the public surface.
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }

  /api/server-logs:
    x-internal: true
    get:
      tags: [Admin]
      summary: Recent in-memory server log buffer
      description: Internal diagnostics endpoint used by the Hub UI.
      responses:
        '200':
          description: Log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ts: { type: string, format: date-time }
                    level: { type: string }
                    msg: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ahub
      description: |
        User-owned API key. Sent as `Authorization: Bearer ahub_…`. Mint
        via `POST /api/auth/keys`.
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Either a user-owned `ahub_…` key, or the break-glass instance API
        key (treated as Owner across all orgs).

  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string }
      description: Project slug (e.g. `agent-hub`).

  schemas:
    HealthResponse:
      type: object
      properties:
        ok: { type: boolean }
        port: { type: integer }
        version: { type: string }
        projects: { type: integer }
        agents: { type: integer }
        uptimeSec: { type: number }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [Owner, Admin, User] }
        createdAt: { type: string, format: date-time }

    ApiKeySummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }

    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        color: { type: string }
        cwd: { type: string, description: Workspace directory. }
        ahw: { type: string, description: Agent-Hub workspace directory. }
        mode: { type: string, enum: [dev, workflow] }
        githubRepo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string }
        color: { type: string }
        cwd: { type: string }

    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        color: { type: string }
        cwd: { type: string }
        mode: { type: string, enum: [dev, workflow] }

    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        projectId: { type: string }
        engine: { type: string, enum: [claude-code, cursor-agent, gemini-cli, codex] }
        model: { type: string }
        role: { type: string, nullable: true }
        cwd: { type: string }

    AgentCreate:
      type: object
      required: [name, projectId]
      properties:
        name: { type: string }
        projectId: { type: string }
        engine: { type: string, enum: [claude-code, cursor-agent, gemini-cli, codex] }
        model: { type: string }
        role: { type: string }

    AgentUpdate:
      type: object
      properties:
        name: { type: string }
        engine: { type: string }
        model: { type: string }
        role: { type: string }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string }
        engine: { type: string }
        model: { type: string }
        title: { type: string, nullable: true }
        askMode: { type: boolean }
        useWorktree: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time, nullable: true }

    Message:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        toolCalls:
          type: array
          items: { type: object }
        createdAt: { type: string, format: date-time }

    Board:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string }
        columns:
          type: array
          items: { $ref: '#/components/schemas/Column' }
        cards:
          type: array
          items: { $ref: '#/components/schemas/Card' }
        epics:
          type: array
          items: { $ref: '#/components/schemas/Epic' }

    Column:
      type: object
      properties:
        id: { type: string, format: uuid }
        boardId: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer }
        color: { type: string }

    Card:
      type: object
      properties:
        id: { type: string, format: uuid }
        columnId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        priority: { type: string, enum: [urgent, high, medium, low] }
        assignee: { type: string, nullable: true }
        labels: { type: string, description: Comma-separated. }
        sessionId: { type: string, format: uuid, nullable: true }
        epicId: { type: string, format: uuid, nullable: true }
        prUrl: { type: string, nullable: true }
        reviewStatus: { type: string, nullable: true }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        blockers:
          type: array
          items: { $ref: '#/components/schemas/BlockerLink' }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/BlockerLink' }

    BlockerLink:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        columnId: { type: string, format: uuid }
        done:
          type: boolean
          description: True iff the linked card sits in a Done-ish column.

    CardCreate:
      type: object
      required: [title, columnId]
      properties:
        title: { type: string }
        description: { type: string }
        priority: { type: string, enum: [urgent, high, medium, low] }
        columnId: { type: string, format: uuid }
        labels: { type: string }
        sessionId:
          type: string
          format: uuid
          description: Optional — links the card to the caller's session.

    CardUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        priority: { type: string, enum: [urgent, high, medium, low] }
        assignee: { type: string, nullable: true }
        labels: { type: string }
        epicId: { type: string, format: uuid, nullable: true }
        prUrl: { type: string, nullable: true }

    Epic:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        color: { type: string }
        autonomous: { type: boolean }
        createdAt: { type: string, format: date-time }

    EpicCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        color: { type: string }
        autonomous: { type: boolean }

    WikiPage:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        content: { type: string, description: Markdown. }
        category: { type: string }
        updatedBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WikiPageSummary:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        category: { type: string }
        updatedAt: { type: string, format: date-time }

    WikiPageCreate:
      type: object
      required: [title, content]
      properties:
        title: { type: string }
        content: { type: string }
        category:
          type: string
          enum:
            [
              general,
              api-docs,
              architecture,
              conventions,
              test-patterns,
              troubleshooting,
              onboarding,
            ]
        updatedBy: { type: string }

    WikiPageUpdate:
      type: object
      properties:
        title: { type: string }
        content: { type: string }
        category: { type: string }
        updatedBy: { type: string }

    WikiSearchHit:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        category: { type: string }
        score: { type: number }
        excerpt: { type: string }

    Heartbeat:
      type: object
      properties:
        agentId: { type: string }
        schedule: { type: string }
        prompt: { type: string }
        enabled: { type: boolean }
        running: { type: boolean }
        lastRunAt: { type: string, format: date-time, nullable: true }
        nextRunAt: { type: string, format: date-time, nullable: true }

    Cron:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        schedule: { type: string }
        prompt: { type: string }
        agentId: { type: string, nullable: true }
        enabled: { type: boolean }
        lastRunAt: { type: string, format: date-time, nullable: true }

    CronCreate:
      type: object
      required: [name, schedule, prompt]
      properties:
        name: { type: string }
        schedule: { type: string }
        prompt: { type: string }
        agentId: { type: string }
        enabled: { type: boolean }

    CronUpdate:
      type: object
      properties:
        name: { type: string }
        schedule: { type: string }
        prompt: { type: string }
        enabled: { type: boolean }
