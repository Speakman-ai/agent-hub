  /api/projects/{projectId}/captures:
    get:
      tags:
        - Captures
      summary: List captures for a project
      parameters:
        - schema:
            type: string
            description: Project slug or id.
          required: true
          description: Project slug or id.
          name: projectId
          in: path
      responses:
        "200":
          description: Capture rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrCapture"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapturesErrorResponse"
    post:
      tags:
        - Captures
      summary: Create a new capture
      description: Persists a row immediately and runs Playwright async. The response is the queued row; poll the GET endpoint for status transitions. Refuses if captures are disabled or Playwright is missing.
      parameters:
        - schema:
            type: string
            description: Project slug or id.
          required: true
          description: Project slug or id.
          name: projectId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prNumber:
                  anyOf:
                    - type: integer
                    - type: string
                branch:
                  type: string
                  minLength: 1
                  pattern: ^(?!-)[A-Za-z0-9._/-]{1,255}$
                commitSha:
                  type: string
                  nullable: true
                  pattern: ^[a-f0-9]{7,64}$/i
                repoUrl:
                  type: string
                  pattern: ^https:\/\/github\.com\/[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+(\.git)?$
                prUrl:
                  type: string
              required:
                - prNumber
                - branch
      responses:
        "201":
          description: Queued capture.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrCapture"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapturesErrorResponse"
        "403":
          description: Captures are disabled on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapturesErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapturesErrorResponse"
        "503":
          description: Playwright/Chromium is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapturesErrorResponse"
