                        sha:
                          type: string
                        subject:
                          type: string
                        author:
                          type: string
                        date:
                          type: string
                        isDefault:
                          type: boolean
                        ahead:
                          type: number
                          nullable: true
                        behind:
                          type: number
                          nullable: true
