      description: Admin only. Refuses the default branch and branches backing an open native PR (409).
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
        - schema:
            type: string
          required: true
          name: branch
          in: path
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "400":
          description: Invalid branch name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "404":
          description: Unknown project, not Hub-hosted, or unknown branch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "409":
          description: Default branch or backs an open PR.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
