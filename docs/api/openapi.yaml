            application/json:
              schema:
                $ref: "#/components/schemas/ReplaysDashboardErrorResponse"
        "404":
          description: Project, replay, or ticket not found. A replay owned by another project is masked as 404 (not 409) to avoid a cross-project existence probe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplaysDashboardErrorResponse"
        "409":
          description: Replay is already linked to a different ticket, the ticket is already linked to a different replay, or the replay could not be attributed to this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplaysDashboardErrorResponse"
