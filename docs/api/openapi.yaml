        id:
          type: string
        name:
          type: string
        description:
          type: string
        path:
          type: string
        source:
          type: string
          enum:
            - global
      required:
        - id
        - name
        - description
        - path
        - source
      description: A global (shared) skill discovered under <dataDir>/skills.
    GlobalSkillDetail:
