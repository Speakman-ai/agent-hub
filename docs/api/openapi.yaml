        "401":
          description: An X-RUM-Token header was supplied but is invalid or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayIngestErrorResponse"
        "403":
          description: The chunk’s project (anonymous or a different token) disagrees with the capture’s existing attribution.
