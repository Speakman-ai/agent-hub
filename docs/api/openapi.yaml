  /api/projects/{projectId}/support-requests:
    options:
      tags:
        - Support Requests
      summary: CORS preflight (returns 204)
      parameters:
        - schema:
            type: string
            description: Project slug or id.
          required: true
          description: Project slug or id.
          name: projectId
          in: path
      responses:
        "204":
          description: CORS preflight OK.
    post:
      tags:
        - Support Requests
      summary: Public support-request intake (multipart)
      description: Unauthenticated, rate-limited (10 / hour per IP). Body must be `multipart/form-data` with at minimum `type` (`bug` | `feature_request`) and `title`. `severity` drives support-queue ordering. For `bug` requests, an optional `sessionReplayUrl` reference and/or `sessionReplay` attachment (≤25 MB) may be supplied. Spawns a session for the project `intake` agent to land a kanban card under the `support-request` epic.
      parameters:
        - schema:
            type: string
            description: Project slug or id.
          required: true
          description: Project slug or id.
          name: projectId
          in: path
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SupportRequestFormFields"
      responses:
        "202":
          description: Dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                  status:
                    type: string
                    enum:
                      - dispatched
                required:
                  - sessionId
                  - status
                description: The intake session has been spawned. Result is the session id; the kanban card lands when the session completes.
        "400":
          description: Validation failed (bad/missing type, missing title, bad severity, session replay on a non-bug request, malformed multipart).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestsErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestsErrorResponse"
        "413":
          description: Payload too large — session-replay attachment over 25 MB, or the whole multipart body over 26 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestsErrorResponse"
        "429":
          description: Per-IP rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestsErrorResponse"
        "500":
          description: Project has no intake agent or handler threw.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestsErrorResponse"
