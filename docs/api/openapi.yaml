  /api/github-app/sync-webhook-secret:
    post:
      tags:
        - GitHub App
      summary: Push the App's webhook secret to GitHub (drift recovery)
      description: "Calls `PATCH /app/hook/config` on GitHub with our locally-stored `config.githubApp.webhookSecret`. If we don't have a local secret, a fresh 32-byte hex secret is generated, pushed, and persisted. Pass `{ rotate: true }` to force generation of a new secret even when a local one exists. GitHub returns its current secret as `********` on read, so this push-sync is the only way to put both sides back in lockstep after drift."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rotate:
                  type: boolean
                  description: Generate and push a brand-new secret even if one already exists locally.
      responses:
        "200":
          description: Secret pushed to GitHub and persisted locally.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubAppSyncWebhookSecretResponse"
        "400":
          description: No GitHub App configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigErrorResponse"
        "500":
          description: GitHub accepted the PATCH but persisting locally failed; in-memory has been rolled back.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  githubMutated:
                    type: boolean
                    enum:
                      - true
                    description: Always true when this 500 shape is returned. Signals the operator that GitHub already holds the new secret and a re-run with rotate:true is the recovery path.
                  cause:
                    type: string
                    description: Underlying filesystem error message (e.g. ENOENT, EACCES).
                required:
                  - error
                  - githubMutated
        "502":
          description: GitHub rejected the PATCH call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigErrorResponse"
