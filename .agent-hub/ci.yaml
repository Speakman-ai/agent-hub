# Finalize Code Changes — pipeline config for the agent-hub repo itself.
#
# v2 (GHA-parity). Every job below maps 1-1 to a job that runs in GitHub
# Actions (`.github/workflows/ci.yml` + the lint gate from
# `main-checks.yml`), and every job runs as its OWN concurrent runner on
# the Finalize DinD fleet — exactly the way GitHub fans a workflow out.
# Nothing is grouped or serialized to "save" runners: the whole point is
# parity, so install/typecheck/build, each test shard, lint, and the
# lint gate all light up at once on separate `ubuntu-24.04` runners.
#
# Why v2 and not v1: a v1 `steps:` pipeline runs sequentially on the Hub
# box itself (see server/finalize/orchestrator.ts — only `version === 2`
# routes to the runner fleet via the job-runner). v2 `jobs:` with
# `runs-on:` are what the orchestrator hands to the remote fleet, one
# privileged DinD container per job instance, concurrently.
#
# Install note: each job runs on its own runner with a fresh worktree and
# there is NO node_modules sharing between jobs — so every job installs
# its own deps (same trade-off GitHub Actions has without a cache action).
# We mirror each GHA job's install SCOPE (root + only the package it
# needs) rather than `install:all`, so jobs stay fast and faithful to
# their GHA counterpart — this is parity, not scaling down.

version: 2
on:
  - finalize
  - manual
timeout_minutes: 45

jobs:
  # ── GHA `build` job: "Build & typecheck" ────────────────────────────
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install root dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Install client dependencies
        run: cd client && npm ci --include=dev
      - name: Install server dependencies
        run: cd server && npm ci --include=dev
      - name: Install shared dependencies
        run: cd shared && npm ci --include=dev
      - name: Install mobile dependencies
        run: cd mobile && npm ci --include=dev
      - name: Build client
        run: npm run build
      - name: Typecheck (all packages)
        run: npm run typecheck

  # ── GHA `test` job (matrix): server 1/3, 2/3, 3/3, client, electron, mobile
  # GHA expands this matrix into independent job instances; v2
  # `matrix.include` does the same — concurrent runners. v2 steps
  # have no `if:`, so the per-suite branch lives in the run script,
  # keyed off the injected FINALIZE_MATRIX_* env vars.
  test:
    runs-on: ubuntu-24.04
    fail-fast: false
    matrix:
      include:
        - { suite: server, shard: '1', shards: '3', label: 'server 1/3' }
        - { suite: server, shard: '2', shards: '3', label: 'server 2/3' }
        - { suite: server, shard: '3', shards: '3', label: 'server 3/3' }
        - { suite: client, label: 'client' }
        - { suite: electron, label: 'electron' }
        - { suite: mobile, label: 'mobile' }
    steps:
      - name: Tests (${FINALIZE_MATRIX_LABEL})
        run: |
          npm ci --ignore-scripts --include=dev
          if [ "$FINALIZE_MATRIX_SUITE" = "server" ]; then
            npm rebuild better-sqlite3
            (cd server && npm ci --include=dev)
            (cd server && npx vitest run --shard="$FINALIZE_MATRIX_SHARD/$FINALIZE_MATRIX_SHARDS")
          elif [ "$FINALIZE_MATRIX_SUITE" = "client" ]; then
            (cd shared && npm ci --include=dev)
            (cd client && npm ci --include=dev)
            (cd client && npm test)
          elif [ "$FINALIZE_MATRIX_SUITE" = "electron" ]; then
            (cd shared && npm ci --include=dev)
            # electron/ has no package.json, so `test:electron` runs vitest from
            # the ROOT node_modules. vitest 4 loads a platform-specific rolldown
            # native binding (@rolldown/binding-linux-x64-gnu) that is an OPTIONAL
            # dependency. The root install above uses --ignore-scripts to skip the
            # heavy electron-binary download + better-sqlite3 rebuild, and under
            # `npm ci` the optional binding is intermittently omitted (npm/cli#4828
            # → vitest startup error "Cannot find native binding"). A full-resolve
            # `npm install` reconciles the optional deps the lockfile pins; keeping
            # --ignore-scripts means the electron binary / native rebuild stay
            # skipped (no scripts run for the pure-prebuilt binding package).
            npm install --include=optional --ignore-scripts --no-audit --no-fund --no-save
            npm run test:electron
          elif [ "$FINALIZE_MATRIX_SUITE" = "mobile" ]; then
            (cd shared && npm ci --include=dev)
            (cd mobile && npm ci --include=dev)
            npm run test:mobile
          fi

  # ── GHA `lint` gate (main-checks.yml) ───────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Install root dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Lint
        run: npm run lint
