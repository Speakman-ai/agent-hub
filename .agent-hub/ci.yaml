version: 1
on:
  - finalize
  - manual

steps:
  - name: Install
    run: npm run install:all

  - name: Lint
    run: npm run lint

  - name: Format check
    run: npm run format:check

  - name: Typecheck
    run: npm run typecheck

  - name: Skill coupling
    run: git diff --name-only origin/main...HEAD > changed-files.txt && CHANGED_FILES_PATH=changed-files.txt PR_LABELS='' node .github/scripts/skill-coupling.mjs

  - name: Test
    run: npm test

  - name: OpenAPI checks
    run: npm run check:openapi

  - name: Build
    run: npm run build
