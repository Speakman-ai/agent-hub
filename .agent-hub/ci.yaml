# Finalize Code Changes — pipeline config for the agent-hub repo itself.
#
# v2 (GHA-parity). Every job below maps 1-1 to a job that runs in GitHub
# Actions (`.github/workflows/ci.yml` + the lint/openapi gates from
# `main-checks.yml`), and every job runs as its OWN concurrent runner on
# the Finalize DinD fleet — exactly the way GitHub fans a workflow out.
# Nothing is grouped or serialized to "save" runners: the whole point is
# parity, so install/typecheck/build, each test shard, lint, and the
# OpenAPI gate all light up at once on separate `ubuntu-24.04` runners.
#
# Why v2 and not v1: a v1 `steps:` pipeline runs sequentially on the Hub
# box itself (see server/finalize/orchestrator.ts — only `version === 2`
# routes to the runner fleet via the job-runner). v2 `jobs:` with
# `runs-on:` are what the orchestrator hands to the remote fleet, one
# privileged DinD container per job instance, concurrently.
#
# Install note: each job runs on its own runner with a fresh worktree and
# there is NO node_modules sharing between jobs — so every job installs
# its own deps (same trade-off GitHub Actions has without a cache action).
# We mirror each GHA job's install SCOPE (root + only the package it
# needs) rather than `install:all`, so jobs stay fast and faithful to
# their GHA counterpart — this is parity, not scaling down.

version: 2
on:
  - finalize
  - manual
timeout_minutes: 45

jobs:
  # ── GHA `build` job: "Build & typecheck" ────────────────────────────
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install root dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Install client dependencies
        run: cd client && npm ci --include=dev
      - name: Install server dependencies
        run: cd server && npm ci --include=dev
      - name: Build client
        run: npm run build
      - name: Server typecheck (tsc --noEmit)
        run: cd server && npx tsc --noEmit

  # ── GHA `test` job (matrix): server 1/3, 2/3, 3/3, client ───────────
  # GHA expands this matrix into four independent job instances; v2
  # `matrix.include` does the same — four concurrent runners. v2 steps
  # have no `if:`, so the per-suite branch lives in the run script,
  # keyed off the injected FINALIZE_MATRIX_* env vars.
  test:
    runs-on: ubuntu-24.04
    fail-fast: false
    matrix:
      include:
        - { suite: server, shard: "1", shards: "3", label: "server 1/3" }
        - { suite: server, shard: "2", shards: "3", label: "server 2/3" }
        - { suite: server, shard: "3", shards: "3", label: "server 3/3" }
        - { suite: client, label: "client" }
    steps:
      - name: Tests (${FINALIZE_MATRIX_LABEL})
        run: |
          npm ci --ignore-scripts --include=dev
          if [ "$FINALIZE_MATRIX_SUITE" = "server" ]; then
            npm rebuild better-sqlite3
            (cd server && npm ci --include=dev)
            (cd server && npx vitest run --shard="$FINALIZE_MATRIX_SHARD/$FINALIZE_MATRIX_SHARDS")
          else
            (cd client && npm ci --include=dev)
            (cd client && npm test)
          fi

  # ── GHA `lint` gate (main-checks.yml) ───────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Install root dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Lint
        run: npm run lint

  # ── GHA OpenAPI freshness/coverage gate (main-checks.yml) ───────────
  # check:openapi imports the server route modules, so this job needs
  # server deps in addition to root.
  openapi:
    runs-on: ubuntu-24.04
    steps:
      - name: Install root dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Install server dependencies
        run: cd server && npm ci --include=dev
      - name: OpenAPI coverage + freshness
        run: npm run check:openapi
