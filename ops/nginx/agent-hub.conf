# ==============================================================================
# Agent Hub — production Nginx reverse-proxy config
# ==============================================================================
#
# Target host:   <your-host>  (any Linux server running the Node app)
# Install path:  /etc/nginx/sites-available/agent-hub
# Enable:        ln -sf /etc/nginx/sites-available/agent-hub \
#                       /etc/nginx/sites-enabled/agent-hub
# Reload:        sudo nginx -t && sudo systemctl reload nginx
#
# Before first install, replace every occurrence of HUB_DOMAIN_PLACEHOLDER
# with the real hostname (e.g. hub.example.com). After that, provision the
# certificate with:
#
#     sudo apt install -y certbot python3-certbot-nginx
#     sudo certbot --nginx \
#         -d HUB_DOMAIN_PLACEHOLDER \
#         --non-interactive --agree-tos -m ops@example.com \
#         --redirect --hsts --staple-ocsp
#
# certbot will rewrite the :80 block in place; if it does, re-apply this file
# on top (certbot's redirect is coarser than the explicit one we have here,
# which preserves the ACME challenge location).
#
# Renewal is handled by the certbot.timer systemd unit (installed by the
# apt package). Verify with `systemctl list-timers | grep certbot`.
#
# PM2 / app is unchanged — only nginx is touched by this card.
# ==============================================================================

# ---- WebSocket upgrade helper -------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- Custom log format for WS upgrades ---------------------------------------
# The client connects to `/ws?token=<JWT>`. Default `combined` format logs
# `$request`, which includes the full URI *with* query string — that puts the
# JWT in `/var/log/nginx/access.log`.
#
# The `ws_sanitized` format below writes `"$request_method $uri $server_protocol"`
# instead of `$request`, which drops the query string entirely. It is only
# applied inside `location /ws { ... }` so REST paths keep full logging (no
# tokens flow through query strings on /api/**).
log_format ws_sanitized  '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

# Standard format used for everything else.
log_format main_rest      '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';

server_tokens off;

# ---- :80 — ACME challenge + force-redirect to HTTPS --------------------------
server {
    listen 80;
    listen [::]:80;
    server_name HUB_DOMAIN_PLACEHOLDER;

    # Let's Encrypt HTTP-01 challenge must stay on :80 plaintext.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Everything else → 301 to the same path on HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- :443 — TLS terminator + reverse proxy -----------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name HUB_DOMAIN_PLACEHOLDER;

    # --- TLS ---
    # Paths populated by `certbot --nginx`. Adjust if the cert lives elsewhere.
    ssl_certificate     /etc/letsencrypt/live/HUB_DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/HUB_DOMAIN_PLACEHOLDER/privkey.pem;

    # Modern profile — TLS 1.2 + 1.3 only, no compression, OCSP stapling.
    # These come from the Mozilla SSL config generator "intermediate" profile.
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout  1d;
    ssl_session_cache    shared:MozSSL:10m;
    ssl_session_tickets  off;
    ssl_stapling         on;
    ssl_stapling_verify  on;
    # ssl_trusted_certificate /etc/letsencrypt/live/HUB_DOMAIN_PLACEHOLDER/chain.pem;

    # --- Security headers (apply to all responses, including errors) ---
    # HSTS — 2 years, covers subdomains. Once deployed, removal is impractical
    # for clients that cached the header, so we commit to always serving HTTPS
    # on this host and any subdomain.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options            "DENY" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    # NOTE: CSP is intentionally omitted for now. The Vite SPA ships inline
    # styles and a small inline bootstrap script; adding CSP without scoping
    # `unsafe-inline` / hash-based allowlists would break the app. Tracked as
    # a separate pre-launch card.

    # --- Access logs ---
    # REST + SPA: full $request (query string included, no secrets expected).
    access_log /var/log/nginx/agent-hub-access.log  main_rest;
    error_log  /var/log/nginx/agent-hub-error.log   warn;

    # Upload size: capture uploads (PNG/MP4) can be ~50 MB; the app enforces
    # its own limit in `routes/captures.ts`. Keep nginx generous but finite.
    client_max_body_size 100m;

    # --- WebSocket (sanitized logging — see log_format comment above) ---
    location /ws {
        # Override access_log for this location only: no query string → no JWT.
        access_log /var/log/nginx/agent-hub-ws.log  ws_sanitized;

        proxy_pass http://127.0.0.1:3051;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- REST API ---
    location /api/ {
        proxy_pass http://127.0.0.1:3051;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # --- User-uploaded assets (captures, attachments) ---
    location /uploads/ {
        proxy_pass http://127.0.0.1:3051;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Design Studio artifacts (per-design sandboxed HTML) ---
    # `/design-files/<designId>/*` serves the on-disk artifact tree that the
    # hub client renders inside a `sandbox="allow-scripts"` iframe (see
    # client/src/components/DesignView.jsx). The iframe's src is an absolute
    # URL pointing at this origin, so the response is always cross-origin to
    # the embedder (web app runs at a different host, Electron renderer runs
    # under `file://` / `app://`). Serving `X-Frame-Options: DENY` here would
    # therefore block the iframe with `ERR_BLOCKED_BY_RESPONSE`.
    #
    # Authorization is enforced in Express (server/index.ts:/design-files/
    # :designId — UUID alphabet check, `path.resolve` prefix guard, org
    # scoping via `getDesignStore` + `getActiveOrgId`, `fallthrough: false`).
    # Framing is part of the product contract, not an attack vector.
    #
    # nginx semantics note: `add_header` directives are inherited from the
    # parent level ONLY if the current level defines no `add_header` of its
    # own. Because we need to OMIT `X-Frame-Options` here, we must also
    # re-declare the other headers we want to keep — otherwise they vanish.
    location /design-files/ {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        # Intentionally NO `X-Frame-Options` — see comment above.

        proxy_pass http://127.0.0.1:3051;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA + everything else ---
    location / {
        proxy_pass http://127.0.0.1:3051;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
