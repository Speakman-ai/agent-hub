# Container pool — PR preview env template (W1).
#
# One-file docker-compose fragment rendered per PR env slot. Values marked
# `${VAR}` are substituted by the dispatcher before `docker compose up`:
#
#   PR_ENV_SLOT_ID    — e.g. "pr-1" (used for container_name and network)
#   PR_ENV_IMAGE      — tagged image for the PR branch
#   PR_ENV_HOST_PORT  — host-side port from the 3100..3999 reserve pool
#
# Resource caps (§3 of "Container Pool — PR Envs + Scaffolding"):
#   • service-level `mem_limit` / `cpus` / `pids_limit` — Q4 decision:
#     `deploy.resources.limits` is silently ignored by plain `docker compose
#     up` outside Swarm (docker/compose#7307) so we use the service-level
#     keys that every runtime we touch actually enforces.
#   • `memswap_limit` mirrors `mem_limit` — no swap. Fail fast via OOM kill
#     instead of thrashing; the allocator detects `State.OOMKilled=true`
#     and moves the slot to `failed` so it gets reaped rather than silently
#     degrading a reviewer's session.
#   • `pids_limit` caps runaway fork() loops; `fork()` returns EAGAIN and
#     the container crashes, which the lifecycle layer treats the same as
#     an OOM (structured `ExitReason.kind = 'pids'`).
#
# Caps (card: W1 resource caps):
#   mem_limit   1 GiB   (1024 MiB)
#   cpus        1.0
#   pids_limit  256
services:
  app:
    image: ${PR_ENV_IMAGE}
    container_name: ${PR_ENV_SLOT_ID}
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 256
    read_only: false
    tmpfs:
      - /tmp:size=128m
    restart: "on-failure:3"
    # Labels let `docker events` consumers and the reaper attribute a
    # container back to its slot without parsing container_name.
    labels:
      agent-hub.pool.class: pr_env
      agent-hub.pool.slot_id: ${PR_ENV_SLOT_ID}
    ports:
      - "${PR_ENV_HOST_PORT}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
