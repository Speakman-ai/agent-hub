[package]
name = "starter-rust-axum"
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
description = "Starter axum service"

[[bin]]
name = "starter"
path = "src/main.rs"

[lib]
name = "starter"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
