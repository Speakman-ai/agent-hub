services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: agent-hub-server
    restart: unless-stopped
    volumes:
      - agent-hub-data:/data
      - server-uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - AGENT_HUB_DATA_DIR=/data
      - AGENT_HUB_PORT=3051
      - AGENT_HUB_HOST=0.0.0.0
      # Pass through optional secrets from host .env
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AGENT_HUB_API_KEY=${AGENT_HUB_API_KEY:-}
      - AGENT_HUB_BOT_GITHUB_TOKEN=${AGENT_HUB_BOT_GITHUB_TOKEN:-}
      - AGENT_HUB_PUBLIC_URL=${AGENT_HUB_PUBLIC_URL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # Codex: default on (--dangerously-bypass-approvals-and-sandbox); set false in .env to re-enable sandbox.
      - AGENT_HUB_CODEX_DANGER_BYPASS=${AGENT_HUB_CODEX_DANGER_BYPASS:-true}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3050}
      # PR preview envs when the server container uses the host Docker socket:
      # mount the same host dir at PR_ENV_CHECKOUT_BASE_DIR inside this container,
      # then set PR_ENV_DOCKER_HOST_CHECKOUT_BASE_DIR to the host-side path so
      # `docker run -v` bind-mount sources resolve to cloned files (see server/container-pool/pr-env-builder.ts).
      # Also mount `/var/run/docker.sock` and e.g. `/var/lib/agent-hub/pr-envs:/home/node/.agent-hub/pr-envs`.
      # - PR_ENV_CHECKOUT_BASE_DIR=/home/node/.agent-hub/pr-envs
      # - PR_ENV_DOCKER_HOST_CHECKOUT_BASE_DIR=/var/lib/agent-hub/pr-envs
    expose:
      - "3051"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3051/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: agent-hub-client
    restart: unless-stopped
    ports:
      - "${AGENT_HUB_WEB_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  agent-hub-data:
  server-uploads:
