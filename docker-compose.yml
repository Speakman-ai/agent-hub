services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: agent-hub-server
    restart: unless-stopped
    # Run as the host user so bind-mounted ~/.agent-hub/* stays writable and Claude
    # Code can use bypassPermissions (it refuses that mode when euid is 0).
    # Supplementary group 0 reaches docker.sock when it is root:root mode 660
    # inside the Desktop VM. On Docker Desktop, also enable Settings →
    # "Allow the default Docker socket to be used" if previews cannot spawn.
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mount host data for local dev (override AGENT_HUB_HOST_DATA_DIR in .env).
      - ${AGENT_HUB_HOST_DATA_DIR:-${HOME}/.agent-hub/data}:/data
      - server-uploads:/app/server/uploads
      # Worktrees live under the data dir (`HOME=/data` → `/data/.agent-hub/workspaces`).
      # Do not overlay that path with ~/.agent-hub/workspaces — it hides session clones.
      - ${AGENT_HUB_HOST_ORGS_DIR:-${HOME}/.agent-hub/orgs}:/data/.agent-hub/orgs
      - ${AGENT_HUB_HOST_PROJECTS_DIR:-${HOME}/.agent-hub/projects}:/data/.agent-hub/projects
      # macOS: projects.json often stores cwd as ~/projects/<repo> — bind at the same absolute
      # path so the docker CLI and daemon both see source (PR #1074 translation can use identity).
      - ${AGENT_HUB_HOST_MAC_PROJECTS:-${HOME}/projects}:${AGENT_HUB_HOST_MAC_PROJECTS:-${HOME}/projects}
      # Talk to the host Docker daemon (preview stacks run as sibling containers).
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - AGENT_HUB_DATA_DIR=/data
      - AGENT_HUB_PORT=3051
      - AGENT_HUB_HOST=0.0.0.0
      # Writable HOME for the host uid (image /home/node is owned by uid 1000).
      - HOME=/data
      # Host paths for translateContainerPathToHost (must match the bind mounts above).
      - AGENT_HUB_HOST_WORKSPACES_DIR=${AGENT_HUB_HOST_DATA_DIR:-${HOME}/.agent-hub/data}/.agent-hub/workspaces
      - AGENT_HUB_HOST_PROJECTS_DIR=${AGENT_HUB_HOST_PROJECTS_DIR:-${HOME}/.agent-hub/projects}
      - AGENT_HUB_CONTAINER_PROJECTS_DIR=/data/.agent-hub/projects
      - AGENT_HUB_CONTAINER_WORKSPACES_DIR=/data/.agent-hub/workspaces
      # Optional second root for ~/projects/* checkouts (surveytracker uses this on macOS).
      - AGENT_HUB_HOST_MAC_PROJECTS_DIR=${AGENT_HUB_HOST_MAC_PROJECTS:-${HOME}/projects}
      - AGENT_HUB_CONTAINER_MAC_PROJECTS_DIR=${AGENT_HUB_HOST_MAC_PROJECTS:-${HOME}/projects}
      # Health polls reach host-published preview ports; iframe URLs stay localhost.
      - AGENT_HUB_PREVIEW_HEALTH_HOST=${AGENT_HUB_PREVIEW_HEALTH_HOST:-host.docker.internal}
      - AGENT_HUB_PREVIEW_READY_TIMEOUT_MS=${AGENT_HUB_PREVIEW_READY_TIMEOUT_MS:-600000}
      # Pass through optional secrets from host .env
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AGENT_HUB_API_KEY=${AGENT_HUB_API_KEY:-}
      - AGENT_HUB_BOT_GITHUB_TOKEN=${AGENT_HUB_BOT_GITHUB_TOKEN:-}
      - AGENT_HUB_PUBLIC_URL=${AGENT_HUB_PUBLIC_URL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # Codex: default on (--dangerously-bypass-approvals-and-sandbox); set false in .env to re-enable sandbox.
      - AGENT_HUB_CODEX_DANGER_BYPASS=${AGENT_HUB_CODEX_DANGER_BYPASS:-true}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:3050}
    expose:
      - "3051"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3051/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: agent-hub-client
    restart: unless-stopped
    ports:
      - "${AGENT_HUB_WEB_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  server-uploads:
