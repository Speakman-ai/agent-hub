name: Release & Deploy Prod

# Manual release: bumps version, tags, generates notes, creates a GitHub release,
# then rolls out to prod-1 via SSM. prod-2 is rolled out separately via the
# `Deploy Prod-2` workflow (.github/workflows/deploy-prod-2.yml), triggered
# manually with the release tag once prod-1 has soaked.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump type'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  id-token: write # OIDC for AWS
  # All mutations (push version bump + tag, gh release create) go through
  # RELEASE_PAT, so the workflow's default GITHUB_TOKEN only needs read access.
  contents: read

jobs:
  # Tests are not re-run here. ci.yml gates every PR with the full suite before
  # merge to main, so by the time main is taggable it is already green. Skipping
  # the duplicate run shortens the release cycle. If you suspect main is dirty
  # (e.g. a hotfix landed without a PR), run `gh workflow run ci.yml --ref main`
  # before triggering this workflow. A red post-tag run would leave a dangling
  # vX.Y.Z tag — but tag creation is gated by the workflow itself, so the only
  # way to reach the tag step is to start the release manually with main green.
  release:
    name: Tag & release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      previous_tag: ${{ steps.bump.outputs.previous_tag }}
    steps:
      # We check out with the RELEASE_PAT so the push of the version commit +
      # tag bypasses the default GITHUB_TOKEN restriction that prevents pushed
      # commits from re-triggering workflows. A fine-grained PAT scoped to this
      # repo with contents:write is the minimum required.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "agent-hub-release-bot"
          git config user.email "release-bot@agent-hub.local"

      - name: Bump version & sync lockfiles
        id: bump
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          # Capture the previous tag BEFORE we create a new one. If no tags
          # exist yet (first release), previous_tag stays empty and notes are
          # generated from the whole history.
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

          # Bump the root package.json without creating git artifacts; we'll
          # commit + tag ourselves so we can also bump server/package.json.
          npm version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Keep server/package.json in lockstep — the server version is
          # surfaced by the /api/health endpoint.
          (cd server && npm version "$VERSION" --no-git-tag-version --allow-same-version)

          # Regenerate lockfiles so the version bump is reflected.
          npm install --package-lock-only --ignore-scripts
          (cd server && npm install --package-lock-only --ignore-scripts)

      - name: Commit, tag, and push
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git add package.json package-lock.json server/package.json server/package-lock.json
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin main
          git push origin "$TAG"

      - name: Generate release notes
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          PREV_TAG: ${{ steps.bump.outputs.previous_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          git log --pretty='- %s (%h)' "$RANGE" \
            | node server/scripts/format-release-notes.mjs \
                --version "$TAG" \
                --previous "${PREV_TAG:-}" \
                --repo "$REPO" \
            > notes.md
          echo "--- notes.md ---"
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md

  build-mac:
    name: Build & upload macOS DMGs
    # Runs in parallel with deploy-prod-1/2. A DMG build failure does NOT
    # gate the server rollout — the desktop app and the server are independent
    # artifacts. If this job fails, the server deploy still proceeds and the
    # DMG can be cut manually afterward with `npm run release:mac`.
    needs: release
    runs-on: macos-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          # `server/node_modules` must exist at pack time because
          # `server/**/*` is in `asarUnpack` and electron/main.js boots the
          # embedded server via `node_modules/tsx/dist/cli.mjs`. Without this,
          # the .app ships without tsx and launches to a black screen.
          npm ci
          (cd client && npm ci)
          (cd server && npm ci)

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-mac-${{ github.run_id }}

      - name: Build DMGs and upload to S3
        # `configure-aws-credentials` sets AWS_ACCESS_KEY_ID /
        # AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN in the job env.
        # `resolveAwsProfile` in release-mac.mjs detects these ambient creds
        # and skips the `--profile default` flag so the AWS CLI uses them.
        run: node electron/release-mac.mjs

      - name: Summarize
        if: success()
        run: |
          {
            echo "## 🍎 macOS DMGs uploaded"
            echo ""
            echo "- Bucket: \`s3://agent-hub-prod-releases/${TAG}/\`"
            echo "- Artifacts: \`Agent Hub-*-arm64.dmg\`, \`Agent Hub-*.dmg\`"
            echo ""
            echo "> First-pass builds are **unsigned**. Code-signing and notarization will be added in a follow-up PR."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod-1:
    name: Deploy agent-hub-prod
    needs: release
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/agenthub/agent-hub' }}
      INSTANCE_NAME_TAG: agent-hub-prod
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-prod1-${{ github.run_id }}

      - name: Resolve instance ID
        id: resolve
        run: |
          set -euo pipefail
          IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${INSTANCE_NAME_TAG}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)
          COUNT=$(echo "$IDS" | wc -w)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 running instance with Name=${INSTANCE_NAME_TAG}, found $COUNT: $IDS"
            exit 1
          fi
          echo "instance_id=$IDS" >> "$GITHUB_OUTPUT"

      - name: Deploy tag ${{ env.TAG }} via SSM
        id: deploy
        env:
          INSTANCE_ID: ${{ steps.resolve.outputs.instance_id }}
        run: |
          set -euo pipefail
          # See deploy-dev.yml for the full rationale on the dash→setpriv→bash
          # chain and why we materialize the inner script to a tempfile. Prod
          # mirrors dev's hardening:
          #   - No EXIT trap (cleanup leaks can flip exit 0 → 1 under errexit).
          #   - `bash --noprofile --norc` instead of `bash -l` (avoids
          #     ~/.bash_profile / ~/.bash_logout teardown exit-code leaks);
          #     nvm is sourced explicitly inside the script.
          #   - `set +e` immediately before the final `exit 0` so deferred
          #     shell bookkeeping can't flip it.
          #   - `set -x` around the health tail for debuggability.
          # Prod-specific change: `git reset --hard "${TAG}"` + `git clean -fd`
          # instead of `git checkout "${TAG}"`. Checkout aborts when the
          # server's working tree has local modifications (run 24610966898
          # failed exactly this way on agent-hub-prod). Reset + clean moves
          # HEAD to the tag commit and wipes any drift, making the deploy
          # idempotent regardless of what state the instance was left in.
          INNER_SCRIPT=$(cat <<INNER
          #!/usr/bin/env bash
          set -euo pipefail
          # Source nvm manually since we dropped bash -l to avoid profile
          # teardown exit-code leaks.
          export NVM_DIR="\$HOME/.nvm"
          # shellcheck disable=SC1091
          [ -s "\$NVM_DIR/nvm.sh" ] && . "\$NVM_DIR/nvm.sh"
          cd ${DEPLOY_PATH}
          git fetch --all --tags --prune
          # Force-align the working tree with the release tag. Any staged or
          # unstaged modifications on the instance are discarded — prod is a
          # deploy target, not a development checkout.
          git reset --hard "${TAG}"
          git clean -fd
          npm ci
          (cd server && npm ci)
          (cd client && npm ci)
          npm run build
          pm2 restart agent-hub
          # Health check: 12 attempts × 5s = 60s ceiling.
          set -x
          for i in \$(seq 1 12); do
            if curl -fsS http://localhost:3051/api/health >/dev/null; then
              echo "health ok on attempt \$i"
              # Disable errexit before explicit exit so no shell bookkeeping
              # (trap, pipefail on last pipeline, etc.) can flip 0 to 1.
              set +e
              exit 0
            fi
            sleep 5
          done
          echo "health check FAILED after 12 attempts" >&2
          exit 1
          INNER
          )
          INNER_B64=$(printf '%s\n' "$INNER_SCRIPT" | base64 -w0)

          DEPLOY_SCRIPT=$(cat <<OUTER
          set -eu
          TMP=\$(mktemp /tmp/agent-hub-deploy.XXXXXX.sh)
          printf '%s' '${INNER_B64}' | base64 -d > "\$TMP"
          chmod 0750 "\$TMP"
          chown agenthub:agenthub "\$TMP"
          exec setpriv --reuid agenthub --regid agenthub --init-groups --reset-env -- bash --noprofile --norc "\$TMP"
          OUTER
          )

          # See deploy-dev.yml for the explanation: shorthand --parameters
          # does not decode JSON \n escapes, so we must pass the script via a
          # JSON file.
          jq -Rs '{commands: [.]}' <<< "$DEPLOY_SCRIPT" > "$RUNNER_TEMP/ssm-params.json"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "release ${TAG} prod-1" \
            --parameters "file://$RUNNER_TEMP/ssm-params.json" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy
        env:
          INSTANCE_ID: ${{ steps.resolve.outputs.instance_id }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail
          # If the GHA job is cancelled, tell SSM to stop the in-flight
          # command on EC2 too — otherwise the deploy keeps running on the
          # instance and can race with a subsequent rollout.
          trap 'echo "Received signal; cancelling SSM command $COMMAND_ID..."; aws ssm cancel-command --command-id "$COMMAND_ID" --instance-ids "$INSTANCE_ID" || true; exit 130' INT TERM
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            echo "[$i] status=$STATUS"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text | tail -n 40
                {
                  echo "## ✅ Release ${TAG} rolled out to agent-hub-prod"
                  echo ""
                  echo "- prod-2 is **not** touched by this workflow."
                  echo "- Run \`Deploy Prod-2\` manually (with tag \`${TAG}\`) to roll prod-2."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::prod-1 deploy finished with status=$STATUS"
                echo "--- stdout ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text || true
                echo "--- stderr ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text || true
                {
                  echo "## ⛔ Rollout halted"
                  echo ""
                  echo "agent-hub-prod failed its deploy/health-check for **${TAG}**."
                  echo ""
                  echo "- prod-2 is rolled separately and was **not** touched."
                  echo "- Investigate the instance, fix forward or roll back, then re-run this workflow or deploy manually."
                  echo "- Runbook: docs/deployment/OIDC-SETUP.md#runbook"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          echo "::error::Timed out waiting for SSM command $COMMAND_ID"
          exit 1
