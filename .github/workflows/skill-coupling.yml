name: Skill Coupling

# Enforce the skill-freeze rule: PRs that touch platform modules listed in
# `.github/skill-coupling.yml` must also update the `agent-hub` skill doc
# (or carry the `skill-freeze-override` label).

on:
  pull_request:
    branches: [main]

concurrency:
  group: skill-coupling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Platform module ↔ SKILL.md coupling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect changed files (PR vs. base branch)
        id: diff
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "$BASE_REF" --depth=1
          git diff --name-only "origin/${BASE_REF}...HEAD" > changed-files.txt
          echo "Changed files in this PR:"
          cat changed-files.txt

      - name: Check skill coupling
        env:
          CHANGED_FILES_PATH: changed-files.txt
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node .github/scripts/skill-coupling.mjs
