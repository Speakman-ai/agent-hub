name: CI

on:
  # PR-only. We deliberately do NOT run on push:main — tests already gate the
  # PR before merge, so a duplicate post-merge run on main would just burn
  # runner minutes. The deploy workflows (deploy-dev.yml, release-prod.yml,
  # deploy-prod-2.yml) also no longer re-run tests; if you push directly to
  # main without a PR, run `gh workflow run ci.yml --ref main` manually before
  # triggering a deploy.
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: |
          for attempt in 1 2 3 4; do
            npm ci --ignore-scripts --include=dev && exit 0
            echo "npm ci (root) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Install server dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd server && npm ci --include=dev) && exit 0
            echo "npm ci (server) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Install client dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd client && npm ci --include=dev) && exit 0
            echo "npm ci (client) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Check server types
        run: cd server && npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: |
          for attempt in 1 2 3 4; do
            npm ci --ignore-scripts --include=dev && exit 0
            echo "npm ci (root) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Install client dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd client && npm ci --include=dev) && exit 0
            echo "npm ci (client) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Build client
        run: npm run build

      - name: Install server dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd server && npm ci --include=dev) && exit 0
            echo "npm ci (server) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: |
          for attempt in 1 2 3 4; do
            npm ci --ignore-scripts --include=dev && exit 0
            echo "npm ci (root) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Install server dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd server && npm ci --include=dev) && exit 0
            echo "npm ci (server) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Install client dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd client && npm ci --include=dev) && exit 0
            echo "npm ci (client) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Install mobile dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd mobile && npm ci --include=dev) && exit 0
            echo "npm ci (mobile) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Run tests
        run: npm test
