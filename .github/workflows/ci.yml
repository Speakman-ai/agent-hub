name: CI

# PR baseline. Every PR runs the same jobs regardless of which files changed —
# no path-based skipping, no conditional matrix. The whole point is a
# CONSISTENT signal: if `CI` is green, the PR built and typechecked.
#
# Heavier checks (lint, format, OpenAPI freshness, skill-coupling)
# run on `push: main` via `main-checks.yml` and are NOT blocking. We check the
# main branch periodically and fix what's broken.
#
# Branch protection should require **CI** (the gate job below).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: |
          for attempt in 1 2 3 4; do
            npm ci --ignore-scripts --include=dev && exit 0
            echo "npm ci (root) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Install client dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd client && npm ci --include=dev) && exit 0
            echo "npm ci (client) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Install server dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd server && npm ci --include=dev) && exit 0
            echo "npm ci (server) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Install shared dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd shared && npm ci --include=dev) && exit 0
            echo "npm ci (shared) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Install mobile dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd mobile && npm ci --include=dev) && exit 0
            echo "npm ci (mobile) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Build client
        run: npm run build

      - name: Typecheck (all packages)
        run: npm run typecheck

  secret-scan:
    # Per-change secret scan. Fails the PR if a credential is committed that the
    # root .gitleaks.toml allowlist does not cover. Working-tree scan only
    # (`gitleaks dir`) — a full history scan is deliberately NOT run here because
    # unscrubbed history still contains known leaks (see .gitleaks.toml header).
    # The run: script is kept byte-identical to the `secret-scan` job in
    # .agent-hub/ci.yaml so `npm run check:workflow-drift` sees strict parity.
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Shallow checkout (fetch-depth: 1, the default) keeps this a WORKING-TREE
      # scan. `.git/` is also allowlisted in .gitleaks.toml so even a deep
      # checkout (fetch-depth: 0) would not turn this into a history scan — but
      # do not add history to this job's checkout: unscrubbed history holds known
      # leaks and a history scan is deliberately not gated (see .gitleaks.toml).
      - uses: actions/checkout@v4

      - name: Scan working tree for secrets
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  ci:
    # Single required status check. Aggregates the always-on jobs above.
    name: CI
    needs: [build, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        env:
          BUILD: ${{ needs.build.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail
          case "$BUILD" in success) ;; *) echo "::error::Build & typecheck job: $BUILD"; exit 1 ;; esac
          case "$SECRET_SCAN" in success) ;; *) echo "::error::Secret scan job: $SECRET_SCAN"; exit 1 ;; esac
          echo "CI: OK (build=$BUILD, secret-scan=$SECRET_SCAN)"
