name: CI

on:
  # PR-only. We deliberately do NOT run on push:main — tests already gate the
  # PR before merge, so a duplicate post-merge run on main would just burn
  # runner minutes. The deploy workflows (deploy-dev.yml, release-prod.yml,
  # deploy-prod-2.yml) also no longer re-run tests; if you push directly to
  # main without a PR, run `gh workflow run ci.yml --ref main` manually before
  # triggering a deploy.
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: |
          for attempt in 1 2 3 4; do
            npm ci --ignore-scripts --include=dev && exit 0
            echo "npm ci (root) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Install server dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd server && npm ci --include=dev) && exit 0
            echo "npm ci (server) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Install client dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd client && npm ci --include=dev) && exit 0
            echo "npm ci (client) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Check server types
        run: cd server && npx tsc --noEmit

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: |
          for attempt in 1 2 3 4; do
            npm ci --ignore-scripts --include=dev && exit 0
            echo "npm ci (root) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Install client dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd client && npm ci --include=dev) && exit 0
            echo "npm ci (client) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Build client
        run: npm run build

      - name: Install server dependencies
        run: |
          for attempt in 1 2 3 4; do
            (cd server && npm ci --include=dev) && exit 0
            echo "npm ci (server) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

  test:
    # Fan out the four test suites across runners, and shard the server suite
    # 3 ways with `vitest run --shard`. The server suite has
    # `sequence.concurrent: false` and `fileParallelism: false` in
    # server/vitest.config.ts, so within a single runner files run serially —
    # sharding across runners is the only way to get real parallelism for it.
    # We invoke per-package test scripts directly (not root `npm test`), which
    # bypasses scripts/verify-test-prerequisites.mjs and lets each shard skip
    # installs it doesn't need.
    name: Test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: client
            label: client
          - suite: electron
            label: electron
          - suite: mobile
            label: mobile
          - suite: server
            shard: 1
            shards: 3
            label: server 1/3
          - suite: server
            shard: 2
            shards: 3
            label: server 2/3
          - suite: server
            shard: 3
            shards: 3
            label: server 3/3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: |
          for attempt in 1 2 3 4; do
            npm ci --ignore-scripts --include=dev && exit 0
            echo "npm ci (root) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Rebuild native modules (server only)
        if: matrix.suite == 'server'
        run: npm rebuild better-sqlite3

      - name: Install server dependencies
        if: matrix.suite == 'server'
        run: |
          for attempt in 1 2 3 4; do
            (cd server && npm ci --include=dev) && exit 0
            echo "npm ci (server) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Install client dependencies
        if: matrix.suite == 'client'
        run: |
          for attempt in 1 2 3 4; do
            (cd client && npm ci --include=dev) && exit 0
            echo "npm ci (client) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Install mobile dependencies
        if: matrix.suite == 'mobile'
        run: |
          for attempt in 1 2 3 4; do
            (cd mobile && npm ci --include=dev) && exit 0
            echo "npm ci (mobile) failed attempt $attempt/4; retry in 15s..."
            sleep 15
          done
          exit 1

      - name: Run client tests
        if: matrix.suite == 'client'
        run: cd client && npm test

      - name: Run electron tests
        # Electron tests run via `npx vitest run` against electron/ and rely on
        # vitest from root devDependencies — no separate electron/ install.
        if: matrix.suite == 'electron'
        run: cd electron && npx vitest run

      - name: Run mobile tests
        if: matrix.suite == 'mobile'
        run: cd mobile && npm test

      - name: Run server tests (shard ${{ matrix.shard }}/${{ matrix.shards }})
        if: matrix.suite == 'server'
        run: cd server && npx vitest run --shard=${{ matrix.shard }}/${{ matrix.shards }}
