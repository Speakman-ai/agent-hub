name: Push agent-hub image to ECR Public

# Standalone builds (no semver bump): uses the reusable ECR + optional docker-dev
# SSM rollout. Routine production releases drive the same reusable workflow from
# **Release** (was "Release All", `.github/workflows/release-all.yml`).
on:
  workflow_dispatch:
    inputs:
      rollout:
        description: >-
          After push, restart the target sandbox via SSM (digest verified).
        required: false
        type: boolean
        default: true
      reset_instance:
        description: >-
          When rollout is enabled, wipes Agent Hub state on the sandbox before restart.
          Preserves OS, /etc/letsencrypt, and /data/config.json.
        required: false
        type: boolean
        default: false
      version_tag:
        description: >-
          Optional extra immutable ECR tag (e.g. refs/tags/v1.2.3 or plain v1.2.3).
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  ecr:
    uses: ./.github/workflows/ecr-publish-rollout-docker-dev.yml
    with:
      git_ref: ${{ github.ref }}
      rollout: ${{ inputs.rollout }}
      reset_instance: ${{ inputs.reset_instance }}
      version_tag: ${{ inputs.version_tag }}
