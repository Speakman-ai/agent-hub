name: Deploy Dev

# Manual-only trigger. Deploys whatever is currently on main when invoked
# from the Actions tab (or via `gh workflow run deploy-dev.yml`). We
# intentionally do NOT auto-deploy on CI success — operators trigger
# explicitly so deploys are an opt-in step rather than a side effect of
# merging to main.
on:
  workflow_dispatch:

# Collapse stacked pushes: only the latest commit on main gets deployed.
# The "Wait for SSM command" step traps cancellation and calls ssm cancel-command
# so the in-flight deploy on EC2 stops too — otherwise cancel-in-progress would
# orphan the SSM invocation and allow two deploys to race on the same checkout.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  id-token: write # OIDC federation with AWS
  contents: read

jobs:
  deploy:
    name: Deploy to agent-hub-server
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/agenthub/agent-hub' }}
      INSTANCE_NAME_TAG: agent-hub-server

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-dev-${{ github.run_id }}

      - name: Resolve instance ID
        id: resolve
        run: |
          set -euo pipefail
          IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${INSTANCE_NAME_TAG}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)
          COUNT=$(echo "$IDS" | wc -w)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No running instances found with Name=${INSTANCE_NAME_TAG}"
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Expected exactly 1 running instance with Name=${INSTANCE_NAME_TAG}, found $COUNT: $IDS"
            exit 1
          fi
          echo "instance_id=$IDS" >> "$GITHUB_OUTPUT"
          echo "Resolved instance: $IDS"

      - name: Send deploy command via SSM
        id: send
        env:
          INSTANCE_ID: ${{ steps.resolve.outputs.instance_id }}
        run: |
          set -euo pipefail
          # Background: AWS-RunShellScript runs under /bin/sh (dash on Ubuntu)
          # as root. We need to execute the deploy as the `agenthub` user so
          # that git's "dubious ownership" guard (>= 2.35.2) stays happy and
          # pm2's per-user daemon is reachable. We drop privs with `setpriv`,
          # which has zero PAM integration (unlike sudo/runuser, whose PAM
          # session teardown leaks exit 1 under SSM even when the inner shell
          # exited 0 — see runs 24587084751 / 24588494694).
          #
          # Three prior rewrites (sudo/runuser/setpriv, all via nested
          # heredoc) still surfaced `failed to run commands: exit status 1`
          # with stdout ending on "health ok on attempt 2" (run 24589322286).
          # The one thing all three had in common was the nested heredoc
          # pipeline: dash writes the inner script into a pipe, setpriv/bash
          # reads it, bash hits `exit 0` before consuming the tail of the
          # heredoc, and the wrapper somehow still surfaces 1.
          #
          # Fix in this revision: materialize the inner script to a tempfile
          # on EC2, chown it to agenthub, then `exec setpriv ... -- bash -l
          # <file>`. This:
          #   - Eliminates the heredoc-as-stdin path entirely — bash reads
          #     its script from disk, no pipe writer hanging around after
          #     `exit 0`.
          #   - `exec` replaces dash with setpriv, so amazon-ssm-agent waits
          #     on bash's PID directly; the exit code propagates with zero
          #     wrapper layers that could re-map it.
          # --init-groups reads /etc/group for supplementary groups;
          # --reset-env reinitialises HOME/USER/LOGNAME/PATH/SHELL from the
          # target user's passwd entry so bash -l can find ~/.bash_profile.
          INNER_SCRIPT=$(cat <<INNER
          #!/usr/bin/env bash
          set -euo pipefail
          # Self-cleanup so we don't leave /tmp cruft behind.
          trap 'rm -f "\$0"' EXIT
          cd ${DEPLOY_PATH}
          git fetch --all --prune
          git reset --hard origin/main
          npm ci
          (cd server && npm ci)
          (cd client && npm ci)
          npm run build
          pm2 restart agent-hub
          # Health check: 12 attempts × 5s = 60s ceiling. Matches prod so a
          # slow cold-restart (sqlite open, route mounting) doesn't false-fail.
          for i in \$(seq 1 12); do
            if curl -fsS http://localhost:3051/api/health >/dev/null; then
              echo "health ok on attempt \$i"
              exit 0
            fi
            sleep 5
          done
          echo "health check FAILED after 12 attempts" >&2
          exit 1
          INNER
          )
          # base64 -w0 keeps the blob on one line so the outer heredoc
          # embedding doesn't have to worry about line-break escaping.
          INNER_B64=$(printf '%s\n' "$INNER_SCRIPT" | base64 -w0)

          # Outer script (runs as root under dash on EC2): decode the inner
          # script to a tempfile, chown to agenthub, then `exec` into setpriv.
          # Using `exec` means dash is *replaced* by setpriv — there is no
          # dash process still wrapping setpriv's exit code when bash returns.
          DEPLOY_SCRIPT=$(cat <<OUTER
          set -eu
          TMP=\$(mktemp /tmp/agent-hub-deploy.XXXXXX.sh)
          printf '%s' '${INNER_B64}' | base64 -d > "\$TMP"
          chmod 0750 "\$TMP"
          chown agenthub:agenthub "\$TMP"
          exec setpriv --reuid agenthub --regid agenthub --init-groups --reset-env -- bash -l "\$TMP"
          OUTER
          )

          # IMPORTANT: build the parameters as a JSON file and pass via
          # file://. The AWS CLI --parameters *shorthand* form (commands=[...])
          # does NOT decode JSON \n escapes, so `jq -Rs .` would collapse the
          # multi-line script onto one line with literal \n characters and the
          # remote shell chokes on the first `(` it sees.
          jq -Rs '{commands: [.]}' <<< "$DEPLOY_SCRIPT" > "$RUNNER_TEMP/ssm-params.json"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy-dev ${GITHUB_SHA::7}" \
            --parameters "file://$RUNNER_TEMP/ssm-params.json" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM CommandId: $CMD_ID"

      - name: Wait for SSM command to finish
        env:
          INSTANCE_ID: ${{ steps.resolve.outputs.instance_id }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail
          # If the GHA job is cancelled (e.g. by concurrency: cancel-in-progress
          # when a newer push comes in), tell SSM to stop the in-flight command
          # on EC2. Otherwise `aws ssm send-command` returns immediately and the
          # deploy script keeps running on the instance, racing with the next
          # deploy on the same checkout.
          trap 'echo "Received signal; cancelling SSM command $COMMAND_ID..."; aws ssm cancel-command --command-id "$COMMAND_ID" --instance-ids "$INSTANCE_ID" || true; exit 130' INT TERM
          # Poll up to 20 minutes (120 * 10s). npm ci + build typically finishes
          # in well under 5 minutes; the ceiling accounts for cold caches.
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            echo "[$i] status=$STATUS"
            case "$STATUS" in
              Success)
                echo "Deploy succeeded."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text | tail -n 40
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM command finished with status=$STATUS"
                echo "--- stdout ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text || true
                echo "--- stderr ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text || true
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          echo "::error::Timed out waiting for SSM command $COMMAND_ID"
          exit 1
