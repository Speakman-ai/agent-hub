name: Deploy Dev

# Triggered two ways:
#   1. workflow_dispatch — roll a git/npm/pm2 host (Name=agent-hub-server) to any ref.
#   2. workflow_call — programmatic reuse (outside the main **Release**
#      workflow — that path publishes docker + rolls the ECR-fed sandbox instead).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag, or SHA). Defaults to origin/main.'
        required: false
        type: string
        default: origin/main
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag, or SHA). Defaults to origin/main.'
        required: false
        type: string
        default: origin/main

# Collapse stacked pushes: only the latest commit on main gets deployed.
# The "Wait for SSM command" step traps cancellation and calls ssm cancel-command
# so the in-flight deploy on EC2 stops too — otherwise cancel-in-progress would
# orphan the SSM invocation and allow two deploys to race on the same checkout.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  id-token: write # OIDC federation with AWS
  contents: read

jobs:
  # Test suites are not run from GitHub Actions. Deploys are manually triggered
  # against main after the Agent Hub finalize flow has checked the change.
  deploy:
    name: Deploy to agent-hub-server
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/agenthub/agent-hub' }}
      INSTANCE_NAME_TAG: agent-hub-server
      # `inputs.ref` works for both workflow_dispatch and workflow_call (the
      # input is declared on both). Defaults to origin/main when unspecified.
      REF: ${{ inputs.ref || 'origin/main' }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-dev-${{ github.run_id }}

      - name: Resolve instance ID
        id: resolve
        run: |
          set -euo pipefail
          IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${INSTANCE_NAME_TAG}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)
          COUNT=$(echo "$IDS" | wc -w)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No running instances found with Name=${INSTANCE_NAME_TAG}"
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Expected exactly 1 running instance with Name=${INSTANCE_NAME_TAG}, found $COUNT: $IDS"
            exit 1
          fi
          echo "instance_id=$IDS" >> "$GITHUB_OUTPUT"
          echo "Resolved instance: $IDS"

      - name: Send deploy command via SSM
        id: send
        env:
          INSTANCE_ID: ${{ steps.resolve.outputs.instance_id }}
        run: |
          set -euo pipefail
          # Background: AWS-RunShellScript runs under /bin/sh (dash on Ubuntu)
          # as root. We need to execute the deploy as the `agenthub` user so
          # that git's "dubious ownership" guard (>= 2.35.2) stays happy and
          # pm2's per-user daemon is reachable. We drop privs with `setpriv`,
          # which has zero PAM integration (unlike sudo/runuser, whose PAM
          # session teardown leaks exit 1 under SSM even when the inner shell
          # exited 0 — see runs 24587084751 / 24588494694).
          #
          # Four prior rewrites (sudo/runuser/setpriv nested heredoc, then
          # setpriv+exec+tempfile) still surfaced `failed to run commands:
          # exit status 1` with stdout ending on "health ok on attempt 2"
          # (runs 24589322286, 24597464570). The tempfile path eliminated
          # the heredoc-as-stdin pipe hypothesis but the ghost exit 1
          # persisted — so the leak is elsewhere.
          #
          # Hypothesis 5 (this revision): the exit 1 comes from one of two
          # shell-teardown paths after our explicit `exit 0`:
          #   (a) `trap 'rm -f "$0"' EXIT` running under `set -euo pipefail`
          #       — if the trap or any cleanup step returns non-zero, bash's
          #       exit code becomes that value instead of the 0 we asked for.
          #   (b) `bash -l` making bash a login shell, which reads
          #       ~/.bash_profile on entry and may source ~/.bash_logout on
          #       exit; either returning non-zero under errexit overwrites
          #       exit 0.
          #
          # Defensive changes in this revision:
          #   - Drop the EXIT trap entirely. Leaving a ~4KB tempfile in /tmp
          #     per deploy is trivial — tmpfiles.d / reboot will reclaim it.
          #   - Use `bash --noprofile --norc` instead of `bash -l`. We lose
          #     automatic sourcing of nvm, so the inner script sources
          #     ~/.nvm/nvm.sh explicitly before running any npm/pm2 command.
          #   - Disable errexit with `set +e` immediately before the final
          #     `exit 0` so any deferred bash bookkeeping can't retroactively
          #     flip the exit code.
          #   - `set -x` around the tail so if this STILL fails, the SSM log
          #     shows the exact last command and we can stop guessing.
          # `exec` still replaces dash with setpriv (which execs bash),
          # so amazon-ssm-agent waits on bash's PID directly with zero
          # wrapper layers. --init-groups / --reset-env unchanged.
          INNER_SCRIPT=$(cat <<INNER
          #!/usr/bin/env bash
          set -euo pipefail
          # Source nvm manually since we dropped bash -l to avoid profile
          # teardown exit-code leaks (see hypothesis 5 above).
          export NVM_DIR="\$HOME/.nvm"
          # shellcheck disable=SC1091
          [ -s "\$NVM_DIR/nvm.sh" ] && . "\$NVM_DIR/nvm.sh"
          cd ${DEPLOY_PATH}
          # --tags so tag refs from callers (e.g. v1.2.3) resolve.
          # The default origin/main case also benefits — no harm fetching tags.
          git fetch --all --tags --prune
          git reset --hard "${REF}"
          # Wipe any local drift. Matches prod-1/prod-2 behavior — dev is a
          # deploy target, not a development checkout.
          git clean -fd
          # Ensure cursor-agent CLI is present for sessions with engine=cursor-agent.
          # Idempotent — no-op when already installed at \$HOME/.local/bin/agent.
          bash scripts/ensure-cursor-agent.sh
          bash scripts/ensure-codex.sh
          bash scripts/ensure-grok.sh
          npm ci --include=dev
          (cd server && npm ci --include=dev)
          (cd client && npm ci --include=dev)
          # First-party build injects the vendor control-plane endpoints from
          # GitHub repo variables (values live in repo Settings → Variables, not
          # committed — see .env.example). Unset → empty → feature disabled (the
          # self-hoster default). VITE_REPLAY_INGEST_ENDPOINT derives from the
          # bug-report origin automatically when unset.
          VITE_BUG_REPORT_ENDPOINT="${{ vars.VITE_BUG_REPORT_ENDPOINT }}" VITE_RELEASE_BUCKET_BASE="${{ vars.VITE_RELEASE_BUCKET_BASE }}" npm run build
          # PM2: reload/start from repo ecosystem (see scripts/pm2-reload-and-wait.sh)
          bash scripts/pm2-reload-and-wait.sh
          INNER
          )
          # base64 -w0 keeps the blob on one line so the outer heredoc
          # embedding doesn't have to worry about line-break escaping.
          INNER_B64=$(printf '%s\n' "$INNER_SCRIPT" | base64 -w0)

          # Outer script (runs as root under dash on EC2): decode the inner
          # script to a tempfile, chown to agenthub, then `exec` into setpriv.
          # Using `exec` means dash is *replaced* by setpriv — there is no
          # dash process still wrapping setpriv's exit code when bash returns.
          DEPLOY_SCRIPT=$(cat <<OUTER
          set -eu
          TMP=\$(mktemp /tmp/agent-hub-deploy.XXXXXX.sh)
          printf '%s' '${INNER_B64}' | base64 -d > "\$TMP"
          chmod 0750 "\$TMP"
          chown agenthub:agenthub "\$TMP"
          exec setpriv --reuid agenthub --regid agenthub --init-groups --reset-env -- bash --noprofile --norc "\$TMP"
          OUTER
          )

          # IMPORTANT: build the parameters as a JSON file and pass via
          # file://. The AWS CLI --parameters *shorthand* form (commands=[...])
          # does NOT decode JSON \n escapes, so `jq -Rs .` would collapse the
          # multi-line script onto one line with literal \n characters and the
          # remote shell chokes on the first `(` it sees.
          jq -Rs '{commands: [.]}' <<< "$DEPLOY_SCRIPT" > "$RUNNER_TEMP/ssm-params.json"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy-dev ref=${REF} ${GITHUB_SHA::7}" \
            --parameters "file://$RUNNER_TEMP/ssm-params.json" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM CommandId: $CMD_ID"

      - name: Wait for SSM command to finish
        env:
          INSTANCE_ID: ${{ steps.resolve.outputs.instance_id }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail
          # If the GHA job is cancelled (e.g. by concurrency: cancel-in-progress
          # when a newer push comes in), tell SSM to stop the in-flight command
          # on EC2. Otherwise `aws ssm send-command` returns immediately and the
          # deploy script keeps running on the instance, racing with the next
          # deploy on the same checkout.
          trap 'echo "Received signal; cancelling SSM command $COMMAND_ID..."; aws ssm cancel-command --command-id "$COMMAND_ID" --instance-ids "$INSTANCE_ID" || true; exit 130' INT TERM
          # Poll up to 20 minutes (120 * 10s). npm ci + build typically finishes
          # in well under 5 minutes; the ceiling accounts for cold caches.
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            echo "[$i] status=$STATUS"
            case "$STATUS" in
              Success)
                echo "Deploy succeeded."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text | tail -n 40
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM command finished with status=$STATUS"
                echo "--- stdout ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text || true
                echo "--- stderr ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text || true
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          echo "::error::Timed out waiting for SSM command $COMMAND_ID"
          exit 1
