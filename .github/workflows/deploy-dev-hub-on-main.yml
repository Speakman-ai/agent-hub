# DEV Hub (dev.agenthub.*) was torn down 2026-08-17. The live stack is gone
# (`terraform destroy` on the `dev` workspace). This workflow used to:
#   - push `:main` and SSM-restart agenthub-dev-sandbox on every merge to main
#   - rebake the DEV Finalize runner AMI
#
# It must not auto-run. `workflow_dispatch` is kept so a revive is one click
# after the Terraform `dev` workspace is stood back up — but the jobs fail
# closed until someone restores the rollout steps below.
#
# To revive:
#   1. AWS_PROFILE=agenthub ops/terraform/scripts/tf-init.sh dev
#      (tf-init.sh resolves its own paths, so it runs from any cwd)
#      then, from ops/terraform: terraform apply -var-file=environments/dev/dev.tfvars
#   2. Set repo Variable DOCKER_DEPLOY_DEV_INSTANCE_ID to the new instance id
#   3. Restore the `on.push` trigger and the ecr-and-rollout / bake jobs from
#      git history (this file before the decommission).
# Release still publishes immutable `:vX.Y.Z` and rolls the prod sandbox.
# `push-image.yml` stays the escape hatch for an arbitrary ref.
name: Deploy DEV Hub from main

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev-hub-from-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decommissioned:
    name: DEV Hub is decommissioned
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        run: |
          echo "::error::DEV Hub (dev.agenthub.*) was torn down 2026-08-17. Do not deploy. Restore the Terraform dev workspace and this workflow's rollout jobs to revive."
          exit 1
