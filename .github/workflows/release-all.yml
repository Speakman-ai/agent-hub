name: Release

# One-shot rollout (manual Actions tab). Operator picks a semver bump
# (patch/minor/major) and the workflow:
#   1. release               — bumps version, tags, notes, GitHub release
#                              (same core job as release-prod.yml).
#   2. After release succeeds, jobs fan out in parallel:
#        - docker-ecr — build + push the server/runner images at the tag
#          (`:sha`, `:vX.Y.Z` — not `:main`), then SSM restart of the prod
#          sandbox (agenthub.example.com) pinned to that version tag.
#          `:main` is owned by "Deploy DEV Hub from main" (dev.agenthub.*).
#        - build-mac        — DMGs → S3 (non-gating vs server rollout).
#        - terraform-apply  — ALWAYS runs: `terraform apply` against the prod
#          stack in ops/terraform, so an infra change carries on the next
#          release instead of waiting for someone to remember. The apply can
#          never replace the Hub: the plan is gated by
#          assert-no-protected-replacements.sh, and env-only changes reach the
#          running host through the SSM env sync step rather than a rebuild.
#          Requires the CI prereqs documented on the job below (PROD_TFVARS
#          secret, AWS_TERRAFORM_ROLE_ARN + TF_STATE_* vars).
#
# Dev EC2 hosts that still use npm/git rather than Docker are upgraded with
# "Deploy Dev" (`.github/workflows/deploy-dev.yml`) manually if needed — it is
# no longer chained here.
#
# Emergency image builds without a version bump remain under
# `.github/workflows/push-image.yml` (same reusable ECR playbook).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump type'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      docker_reset_instance:
        description: >-
          With ECR roll: wipe Agent Hub SQLite/uploads/projects on the prod sandbox
          before restart (fresh-setup drill). Leaves TLS + data/config intact.
        required: false
        type: boolean
        default: false

# Only one Release can be in flight at a time. We do NOT cancel
# in-progress: a half-finished release (tag pushed but deploys not run)
# leaves the system in an awkward state — better to wait for the prior
# run to finish before starting another.
concurrency:
  group: release-workflow
  cancel-in-progress: false

permissions:
  id-token: write # OIDC for AWS (build-mac)
  # Mutations (push version bump + tag, gh release create) go through
  # RELEASE_PAT, so the default GITHUB_TOKEN only needs read access.
  # Deploy / ECR callables declare their own permissions blocks.
  contents: read

jobs:
  # Test suites are not run from GitHub Actions. Release is manually triggered
  # after the Agent Hub finalize flow has checked the change.
  release:
    name: Tag & release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      previous_tag: ${{ steps.bump.outputs.previous_tag }}
    steps:
      # Checkout with RELEASE_PAT so the version-bump commit + tag push can
      # re-trigger downstream workflows. A fine-grained PAT scoped to this
      # repo with contents:write is the minimum required.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "agent-hub-release-bot"
          git config user.email "release-bot@agent-hub.local"

      # OpenAPI generation and release-note formatting are TypeScript scripts
      # (the server has no build step — everything runs under tsx). Install the
      # server's dev deps before the version bump so `npx tsx` is resolvable
      # when `npm run generate:openapi` shells into server/.
      - name: Install server deps (for tsx)
        run: cd server && npm ci --include=dev --no-audit --no-fund

      - name: Bump version & sync lockfiles
        id: bump
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          # Capture the previous tag BEFORE we create a new one. If no tags
          # exist yet (first release), previous_tag stays empty and notes
          # are generated from the whole history.
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

          # Bump the root package.json without creating git artifacts;
          # we commit + tag ourselves so we can also bump server/package.json.
          npm version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Keep server/package.json in lockstep — the server version is
          # surfaced by the /api/health endpoint.
          (cd server && npm version "$VERSION" --no-git-tag-version --allow-same-version)

          # Regenerate lockfiles so the version bump is reflected.
          npm install --package-lock-only --ignore-scripts
          (cd server && npm install --package-lock-only --ignore-scripts)

          # Regenerate the committed API spec so info.version tracks the
          # release version from package.json.
          npm run generate:openapi

      - name: Commit, tag, and push
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git add package.json package-lock.json server/package.json server/package-lock.json docs/api/openapi.yaml
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin main
          git push origin "$TAG"

      - name: Generate release notes
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          PREV_TAG: ${{ steps.bump.outputs.previous_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          git log --pretty='- %s (%h)' "$RANGE" \
            | (cd server && npx tsx scripts/format-release-notes.ts \
                --version "$TAG" \
                --previous "${PREV_TAG:-}" \
                --repo "$REPO") \
            > notes.md
          echo "--- notes.md ---"
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md

  build-mac:
    name: Build & upload macOS DMGs
    # Parallel with ECR docker dev rollout. DMG failure does NOT
    # gate the server rollout — desktop app and server are independent
    # artifacts. If this job fails, the server deploys still proceed and
    # the DMG can be cut manually afterward with `npm run release:mac`.
    needs: release
    runs-on: macos-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          # `server/node_modules` must exist at pack time because
          # `server/**/*` is in `asarUnpack` and electron/main.js boots the
          # embedded server via `node_modules/tsx/dist/cli.mjs`. Without
          # this, the .app ships without tsx and launches to a black screen.
          npm ci --include=dev
          (cd client && npm ci --include=dev)
          (cd server && npm ci --include=dev)

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-release-all-mac-${{ github.run_id }}

      - name: Build DMGs and upload to S3
        run: node electron/release-mac.mjs

      - name: Summarize
        if: success()
        run: |
          {
            echo "## 🍎 macOS DMGs uploaded"
            echo ""
            echo "- Bucket: \`s3://agent-hub-prod-releases/${TAG}/\`"
            echo "- Artifacts: \`Agent Hub-*-arm64.dmg\`, \`Agent Hub-*.dmg\`"
            echo ""
            echo "> First-pass builds are **unsigned**. Code-signing and notarization will be added in a follow-up PR."
          } >> "$GITHUB_STEP_SUMMARY"

  # Prod sandbox rolls out in parallel with build-mac after `release`.
  # Publishes immutable `:vX.Y.Z` (+ `:sha`) only — never retags `:main`, which
  # Deploy DEV Hub from main owns. Two writers of `:main` race and fail the
  # digest gate (Release #49 / v2.31.77).
  docker-ecr-dev:
    name: ECR push and prod sandbox
    needs: release
    uses: ./.github/workflows/ecr-publish-rollout-docker-dev.yml
    with:
      git_ref: refs/tags/${{ needs.release.outputs.tag }}
      version_tag: refs/tags/${{ needs.release.outputs.tag }}
      rollout: true
      reset_instance: ${{ inputs.docker_reset_instance }}

  # Prod infrastructure apply. Runs on every release so a merged Terraform change
  # actually lands. Independent of the image rollout: the ECR/SSM path ships app
  # code, this ships infra (buckets, IAM, ALB, fleet, Hub env).
  #
  # Two rails make an unattended prod apply safe, and both are load-bearing:
  #
  #   1. The plan is saved, converted to JSON, and checked by
  #      ops/terraform/scripts/assert-no-protected-replacements.sh before it is
  #      applied. If the plan would destroy or replace `aws_instance.app`,
  #      `aws_ebs_volume.hub_data`, or `aws_volume_attachment.hub_data`, the job
  #      fails and applies nothing. Apply consumes the SAVED plan, so what the
  #      guard approved is exactly what lands.
  #   2. Rendered user-data never reaches an existing host (cloud-init does not
  #      re-run), so an env change is adopted in place by the env-sync step via
  #      SSM. That is why the `user_data_replace_on_change` switch no longer
  #      exists: nothing here needs to rebuild the box to change a variable.
  #
  # Required CI configuration (nothing account-specific is hardcoded here — this
  # workflow lives in a public repo):
  #   - secret PROD_TFVARS         — the full contents of
  #                                  environments/prod/prod.tfvars (gitignored;
  #                                  carries live account IDs / ARNs / instance IDs).
  #   - var    AWS_TERRAFORM_ROLE_ARN — an OIDC role in the prod account with
  #                                  permission to read/write the S3 state + lock
  #                                  table and manage every resource in the stack.
  #   - var    TF_STATE_BUCKET     — remote-state bucket (e.g. agent-hub-tfstate-<acct>).
  #   - var    TF_STATE_LOCK_TABLE — DynamoDB lock table (e.g. agent-hub-tfstate-lock).
  #   - var    AWS_REGION          — defaults to us-east-2 when unset.
  #   - vars   DOCKER_DEPLOY_INSTANCE_ID + DOCKER_DEPLOY_DEV_INSTANCE_ID — the
  #                                  rollout targets, reused here as
  #                                  TF_VAR_ci_ssm_expected_deploy_instance_ids so
  #                                  the plan asserts the CI SSM grant covers both.
  terraform-apply:
    name: Terraform apply (prod infra)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for AWS
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      # Single source of truth for every rollout target. Release / push-image
      # SSM vars.DOCKER_DEPLOY_INSTANCE_ID and main→DEV SSMs
      # vars.DOCKER_DEPLOY_DEV_INSTANCE_ID; the CI role's ssm:SendCommand grant
      # is scoped by ci_ssm_deploy_* in the PROD_TFVARS secret. Feeding both
      # Variables into the plan makes Terraform assert the grant covers them — see the
      # terraform_data.ci_ssm_deploy_target_guard preconditions. Job-scoped
      # because `terraform apply` consumes the saved plan, so the var has to be
      # present at plan time or the assertion never runs. Empty (Variable unset)
      # skips the assertion.
      TF_VAR_ci_ssm_expected_deploy_instance_ids: '["${{ vars.DOCKER_DEPLOY_INSTANCE_ID }}", "${{ vars.DOCKER_DEPLOY_DEV_INSTANCE_ID }}"]'
    defaults:
      run:
        working-directory: ops/terraform
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-release-all-tf-${{ github.run_id }}

      # Pinned to the version the committed .terraform.lock.hcl + state lineage
      # were produced with, so CI never silently upgrades prod state. Wrapper off
      # so `terraform` exit codes propagate normally.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.3
          terraform_wrapper: false

      # The real prod.tfvars is gitignored (live account IDs / ARNs), so it is
      # never in the checkout — materialize it from the PROD_TFVARS secret.
      - name: Materialize prod.tfvars from secret
        env:
          PROD_TFVARS: ${{ secrets.PROD_TFVARS }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_TFVARS:-}" ]; then
            echo "::error::PROD_TFVARS secret is empty — refusing to apply prod terraform." >&2
            exit 1
          fi
          mkdir -p environments/prod
          printf '%s' "$PROD_TFVARS" > environments/prod/prod.tfvars

      # Backend values are non-secret; passed inline so no backend.hcl is needed.
      - name: Terraform init
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      # Saved plan + JSON rendering. Everything downstream keys off this exact
      # plan file so the guard cannot approve one plan while apply runs another.
      - name: Terraform plan
        run: |
          set -euo pipefail
          terraform plan -input=false \
            -var-file=environments/prod/prod.tfvars \
            -out="$RUNNER_TEMP/prod.plan"
          terraform show -json "$RUNNER_TEMP/prod.plan" > "$RUNNER_TEMP/prod.plan.json"

      - name: Assert the plan cannot destroy the Hub
        run: ./scripts/assert-no-protected-replacements.sh "$RUNNER_TEMP/prod.plan.json"

      - name: Terraform apply (saved plan)
        run: terraform apply -input=false -auto-approve "$RUNNER_TEMP/prod.plan"

      # The Hub .env is baked into user-data, which only a fresh instance would
      # read. Export the managed (non-secret, non-UI-owned) subset so the next
      # step can upsert it on the running host instead.
      - name: Collect Hub env sync inputs
        id: hubenv
        run: |
          set -euo pipefail

          # NO `|| true` on these. Swallowing a terraform failure here is not
          # graceful degradation: an empty hub_env_managed is a VALID instruction
          # to the sync meaning "retract every managed key", so one flaky CLI
          # call would strip the running Hub of its configuration and restart it.
          # An empty value may only mean "empty" when the command SUCCEEDED.
          #
          # -json rather than -raw because hub_env_file_path is null on stacks
          # that render no .env, and `-raw` treats null as an error. With -json
          # that case stays valid JSON, so "this stack has nothing to sync" stays
          # distinguishable from "terraform broke" instead of both arriving as a
          # non-zero exit that the old `|| true` then erased.
          tf_out() { terraform output -json "$1" | jq -r 'if . == null then "" else . end'; }

          # Values are deliberately not echoed - this repo's Actions logs are public.
          INSTANCE_ID="$(tf_out instance_id)"
          ENV_PATH="$(tf_out hub_env_file_path)"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "env_path=$ENV_PATH" >> "$GITHUB_OUTPUT"

          # hub_env_file_path is null exactly when this stack renders no docker
          # .env. Nothing to sync, and that is a legitimate skip rather than an
          # error.
          if [ -z "$ENV_PATH" ]; then
            echo "syncable=false" >> "$GITHUB_OUTPUT"
            echo "This stack renders no Hub .env; skipping env sync."
            exit 0
          fi

          MANAGED="$(tf_out hub_env_managed)"
          MANAGED_KEYS="$(tf_out hub_env_managed_keys)"
          RUNTIME_KEYS="$(tf_out hub_env_runtime_injected_keys)"

          # The stack DOES render a .env, so every input below is required and
          # non-empty by construction: docker_bootstrap_env always carries
          # NODE_ENV / AGENT_HUB_PORT / ALLOWED_ORIGINS and the key lists are
          # static. An empty one therefore means the data is wrong, never that
          # Terraform wants nothing, so fail the release rather than hand the
          # live Hub a retract-everything instruction. (The host script still
          # supports a genuinely empty desired set for direct invocation; what
          # must not happen is this pipeline MANUFACTURING one from a failure.)
          MISSING=""
          [ -n "$INSTANCE_ID" ] || MISSING="$MISSING instance_id"
          [ -n "$MANAGED" ] || MISSING="$MISSING hub_env_managed"
          [ -n "$MANAGED_KEYS" ] || MISSING="$MISSING hub_env_managed_keys"
          [ -n "$RUNTIME_KEYS" ] || MISSING="$MISSING hub_env_runtime_injected_keys"
          if [ -n "$MISSING" ]; then
            echo "::error::Empty Terraform output(s) for a stack that renders a Hub .env:$MISSING. Refusing to sync, because an empty managed set would retract every key from the running Hub."
            exit 1
          fi

          printf '%s\n' "$MANAGED" > "$RUNNER_TEMP/hub-env-managed.env"
          # Key names only (no values). Lets the host drop keys Terraform stopped
          # emitting; otherwise disabling a feature leaves its old lines live.
          printf '%s\n' "$MANAGED_KEYS" > "$RUNNER_TEMP/hub-env-managed-keys.txt"
          # Owned keys that survive removal because docker run -e or an image ENV
          # line supplies them; exempt from the host's retraction check.
          printf '%s\n' "$RUNTIME_KEYS" > "$RUNNER_TEMP/hub-env-runtime-keys.txt"

          echo "syncable=true" >> "$GITHUB_OUTPUT"
          echo "Managed key count: $(grep -cvE '^[[:space:]]*(#|$)' "$RUNNER_TEMP/hub-env-managed.env")"

      # Restarts the Hub only when a managed value actually changed or a managed
      # key was retracted, so a release with no env delta costs nothing.
      - name: Sync Hub env over SSM (no instance replacement)
        if: steps.hubenv.outputs.syncable == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          # Every file is written and validated above, so the arguments are
          # unconditional; a missing one would have failed that step.
          ops/scripts/sync-hub-env.sh \
            --instance-id "${{ steps.hubenv.outputs.instance_id }}" \
            --region "$AWS_REGION" \
            --remote-path "${{ steps.hubenv.outputs.env_path }}" \
            --env-file "$RUNNER_TEMP/hub-env-managed.env" \
            --managed-keys-file "$RUNNER_TEMP/hub-env-managed-keys.txt" \
            --runtime-keys-file "$RUNNER_TEMP/hub-env-runtime-keys.txt"

  summary:
    name: Release summary
    needs: [release, docker-ecr-dev, build-mac, terraform-apply]
    # Always run so the operator gets a single status block at the bottom
    # of the workflow page, regardless of which fan-out leg succeeded.
    if: always()
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      RELEASE_RESULT: ${{ needs.release.result }}
      DOCKER_ECR_RESULT: ${{ needs.docker-ecr-dev.result }}
      MAC_RESULT: ${{ needs.build-mac.result }}
      TERRAFORM_RESULT: ${{ needs.terraform-apply.result }}
    steps:
      - name: Emit summary
        run: |
          set -euo pipefail
          icon() {
            case "$1" in
              success) echo "✅";;
              failure) echo "❌";;
              cancelled) echo "⚪";;
              skipped) echo "⏭️";;
              *) echo "❓";;
            esac
          }
          {
            echo "## Release — ${TAG:-(no tag cut)}"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Tag & release      | $(icon "$RELEASE_RESULT") $RELEASE_RESULT |"
            echo "| ECR + docker dev   | $(icon "$DOCKER_ECR_RESULT") $DOCKER_ECR_RESULT |"
            echo "| Build mac DMGs     | $(icon "$MAC_RESULT") $MAC_RESULT (non-gating) |"
            echo "| Terraform apply    | $(icon "$TERRAFORM_RESULT") $TERRAFORM_RESULT (incl. guarded plan + SSM env sync) |"
          } >> "$GITHUB_STEP_SUMMARY"
