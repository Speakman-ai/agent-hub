name: Release All

# One-shot full rollout. Operator picks a semver bump (patch/minor/major)
# and the workflow:
#   1. release      — bumps version, tags, generates notes, creates a
#                     GitHub release (identical to release-prod.yml).
#   2. After release succeeds, three jobs fan out in parallel:
#        - build-mac     — builds + uploads macOS DMGs. Non-gating
#                          (DMG failure does NOT block server deploys).
#        - deploy-dev    — rolls the new tag to agent-hub-server (dev).
#        - deploy-prod-2 — rolls the new tag to agent-hub-prod-2.
#
# History: this workflow previously chained a `deploy-prod-1` job that
# rolled to the standalone `agent-hub-prod` EC2 instance. That host has
# been shut down and replaced by the dockerized sandbox served at
# `agenthub.dev.surveytracker.io`, which pulls `:main` from ECR Public
# on systemd restart and is fed by `push-image.yml` (out of band of
# this workflow). The prod-1 job was removed and dev + prod-2 now
# depend only on `release` — they no longer gate on a host that no
# longer exists.
#
# `deploy-prod-2.yml` still exists as a standalone workflow for
# operators who want to roll a specific target conservatively. This
# workflow is the "ship to everywhere" button for routine releases.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump type'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# Only one Release All can be in flight at a time. We do NOT cancel
# in-progress: a half-finished release (tag pushed but deploys not run)
# leaves the system in an awkward state — better to wait for the prior
# run to finish before starting another.
concurrency:
  group: release-all
  cancel-in-progress: false

permissions:
  id-token: write # OIDC for AWS (build-mac)
  # Mutations (push version bump + tag, gh release create) go through
  # RELEASE_PAT, so the default GITHUB_TOKEN only needs read access. The
  # called deploy-dev / deploy-prod-2 workflows declare their own
  # permissions blocks.
  contents: read

jobs:
  # Tests are not re-run here. ci.yml gates every PR with the full suite
  # before merge to main, so by the time main is taggable it is already
  # green. Skipping the duplicate run shortens the release cycle. If you
  # suspect main is dirty, run `gh workflow run ci.yml --ref main` before
  # triggering Release All.
  release:
    name: Tag & release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      previous_tag: ${{ steps.bump.outputs.previous_tag }}
    steps:
      # Checkout with RELEASE_PAT so the version-bump commit + tag push can
      # re-trigger downstream workflows. A fine-grained PAT scoped to this
      # repo with contents:write is the minimum required.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "agent-hub-release-bot"
          git config user.email "release-bot@agent-hub.local"

      - name: Bump version & sync lockfiles
        id: bump
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          # Capture the previous tag BEFORE we create a new one. If no tags
          # exist yet (first release), previous_tag stays empty and notes
          # are generated from the whole history.
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

          # Bump the root package.json without creating git artifacts;
          # we commit + tag ourselves so we can also bump server/package.json.
          npm version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Keep server/package.json in lockstep — the server version is
          # surfaced by the /api/health endpoint.
          (cd server && npm version "$VERSION" --no-git-tag-version --allow-same-version)

          # Regenerate lockfiles so the version bump is reflected.
          npm install --package-lock-only --ignore-scripts
          (cd server && npm install --package-lock-only --ignore-scripts)

      - name: Commit, tag, and push
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git add package.json package-lock.json server/package.json server/package-lock.json
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin main
          git push origin "$TAG"

      - name: Generate release notes
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          PREV_TAG: ${{ steps.bump.outputs.previous_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          git log --pretty='- %s (%h)' "$RANGE" \
            | node server/scripts/format-release-notes.mjs \
                --version "$TAG" \
                --previous "${PREV_TAG:-}" \
                --repo "$REPO" \
            > notes.md
          echo "--- notes.md ---"
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md

  build-mac:
    name: Build & upload macOS DMGs
    # Parallel with deploy-dev and deploy-prod-2. DMG failure does NOT
    # gate the server rollout — desktop app and server are independent
    # artifacts. If this job fails, the server deploys still proceed and
    # the DMG can be cut manually afterward with `npm run release:mac`.
    needs: release
    runs-on: macos-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          # `server/node_modules` must exist at pack time because
          # `server/**/*` is in `asarUnpack` and electron/main.js boots the
          # embedded server via `node_modules/tsx/dist/cli.mjs`. Without
          # this, the .app ships without tsx and launches to a black screen.
          npm ci --include=dev
          (cd client && npm ci --include=dev)
          (cd server && npm ci --include=dev)

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-release-all-mac-${{ github.run_id }}

      - name: Build DMGs and upload to S3
        run: node electron/release-mac.mjs

      - name: Summarize
        if: success()
        run: |
          {
            echo "## 🍎 macOS DMGs uploaded"
            echo ""
            echo "- Bucket: \`s3://agent-hub-prod-releases/${TAG}/\`"
            echo "- Artifacts: \`Agent Hub-*-arm64.dmg\`, \`Agent Hub-*.dmg\`"
            echo ""
            echo "> First-pass builds are **unsigned**. Code-signing and notarization will be added in a follow-up PR."
          } >> "$GITHUB_STEP_SUMMARY"

  # dev and prod-2 fan out in parallel as soon as `release` is green.
  # The former `deploy-prod-1` gate was removed when the standalone
  # agent-hub-prod EC2 instance was shut down (replaced by the
  # dockerized sandbox at agenthub.dev.surveytracker.io, fed by
  # push-image.yml + a systemd pull-on-start unit). If either of these
  # deploys fails, the other still runs — operators can re-run a single
  # target via deploy-dev.yml or deploy-prod-2.yml with the new tag.
  deploy-dev:
    name: Deploy agent-hub-server (dev)
    needs: release
    uses: ./.github/workflows/deploy-dev.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    # No secrets passed — deploy-dev.yml uses OIDC + vars only. If it ever
    # gains a secret dependency, add `secrets: inherit` here.

  deploy-prod-2:
    name: Deploy agent-hub-prod-2
    needs: release
    uses: ./.github/workflows/deploy-prod-2.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  summary:
    name: Release All summary
    needs: [release, deploy-dev, deploy-prod-2, build-mac]
    # Always run so the operator gets a single status block at the bottom
    # of the workflow page, regardless of which fan-out leg succeeded.
    if: always()
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      RELEASE_RESULT: ${{ needs.release.result }}
      DEV_RESULT: ${{ needs.deploy-dev.result }}
      PROD2_RESULT: ${{ needs.deploy-prod-2.result }}
      MAC_RESULT: ${{ needs.build-mac.result }}
    steps:
      - name: Emit summary
        run: |
          set -euo pipefail
          icon() {
            case "$1" in
              success) echo "✅";;
              failure) echo "❌";;
              cancelled) echo "⚪";;
              skipped) echo "⏭️";;
              *) echo "❓";;
            esac
          }
          {
            echo "## 🚀 Release All — ${TAG:-(no tag cut)}"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Tag & release      | $(icon "$RELEASE_RESULT") $RELEASE_RESULT |"
            echo "| Deploy dev         | $(icon "$DEV_RESULT") $DEV_RESULT |"
            echo "| Deploy prod-2      | $(icon "$PROD2_RESULT") $PROD2_RESULT |"
            echo "| Build mac DMGs     | $(icon "$MAC_RESULT") $MAC_RESULT (non-gating) |"
          } >> "$GITHUB_STEP_SUMMARY"
