name: Release

# One-shot rollout (manual Actions tab). Operator picks a semver bump
# (patch/minor/major) and the workflow:
#   1. release               — bumps version, tags, notes, GitHub release
#                              (same core job as release-prod.yml).
#   2. After release succeeds, jobs fan out in parallel:
#        - docker-ecr — build + push the server/runner images at the tag
#          (`:sha`, `:vX.Y.Z` — not `:main`), then SSM restart of the prod
#          sandbox (agenthub.example.com) pinned to that version tag.
#          DEV Hub no longer writes `:main` (decommissioned 2026-08-17).
#        - bake-finalize-ami-prod — after ECR succeeds, rebake the prod
#          Finalize runner AMI for `:vX.Y.Z` when the digest changed, pin the
#          launch template without instance refresh, write SSM AMI id.
#        - build-mac        — DMGs → S3 (non-gating vs server rollout).
#        - terraform-apply  — ALWAYS runs (after bake when bake ran):
#          `terraform apply` against the prod stack. Uses the committed
#          environments/prod/prod.tfvars. Injects
#          TF_VAR_finalize_runner_ami_id from bake/SSM so a stale AMI pin in
#          that file cannot revert the launch template. Tokens come from
#          individual GitHub secrets (AGENT_HUB_AHLOG_TOKEN, …), not a tfvars
#          blob. The apply can never replace the Hub: the plan is gated by
#          assert-no-protected-replacements.sh, and env-only changes reach the
#          running host through the SSM env sync step rather than a rebuild.
#          Requires the CI prereqs documented on the job below.
#
# Dev EC2 hosts that still use npm/git rather than Docker are upgraded with
# "Deploy Dev" (`.github/workflows/deploy-dev.yml`) manually if needed — it is
# no longer chained here.
#
# Emergency image builds without a version bump remain under
# `.github/workflows/push-image.yml` (same reusable ECR playbook).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump type'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      docker_reset_instance:
        description: >-
          With ECR roll: wipe Agent Hub SQLite/uploads/projects on the prod sandbox
          before restart (fresh-setup drill). Leaves TLS + data/config intact.
        required: false
        type: boolean
        default: false

# Only one Release can be in flight at a time. We do NOT cancel
# in-progress: a half-finished release (tag pushed but deploys not run)
# leaves the system in an awkward state — better to wait for the prior
# run to finish before starting another.
concurrency:
  group: release-workflow
  cancel-in-progress: false

permissions:
  id-token: write # OIDC for AWS (build-mac)
  # Mutations (push version bump + tag, gh release create) go through
  # RELEASE_PAT, so the default GITHUB_TOKEN only needs read access.
  # Deploy / ECR callables declare their own permissions blocks.
  contents: read

jobs:
  # Test suites are not run from GitHub Actions. Release is manually triggered
  # after the Agent Hub finalize flow has checked the change.
  release:
    name: Tag & release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      previous_tag: ${{ steps.bump.outputs.previous_tag }}
    steps:
      # Checkout with RELEASE_PAT so the version-bump commit + tag push can
      # re-trigger downstream workflows. A fine-grained PAT scoped to this
      # repo with contents:write is the minimum required.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "agent-hub-release-bot"
          git config user.email "release-bot@agent-hub.local"

      # OpenAPI generation and release-note formatting are TypeScript scripts
      # (the server has no build step — everything runs under tsx). Install the
      # server's dev deps before the version bump so `npx tsx` is resolvable
      # when `npm run generate:openapi` shells into server/.
      - name: Install server deps (for tsx)
        run: cd server && npm ci --include=dev --no-audit --no-fund

      - name: Bump version & sync lockfiles
        id: bump
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          # Capture the previous tag BEFORE we create a new one. If no tags
          # exist yet (first release), previous_tag stays empty and notes
          # are generated from the whole history.
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

          # Bump the root package.json without creating git artifacts;
          # we commit + tag ourselves so we can also bump server/package.json.
          npm version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Keep server/package.json in lockstep — the server version is
          # surfaced by the /api/health endpoint.
          (cd server && npm version "$VERSION" --no-git-tag-version --allow-same-version)

          # Regenerate lockfiles so the version bump is reflected.
          npm install --package-lock-only --ignore-scripts
          (cd server && npm install --package-lock-only --ignore-scripts)

          # Regenerate the committed API spec so info.version tracks the
          # release version from package.json.
          npm run generate:openapi

      - name: Commit, tag, and push
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git add package.json package-lock.json server/package.json server/package-lock.json docs/api/openapi.yaml
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin main
          git push origin "$TAG"

      - name: Generate release notes
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          PREV_TAG: ${{ steps.bump.outputs.previous_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          git log --pretty='- %s (%h)' "$RANGE" \
            | (cd server && npx tsx scripts/format-release-notes.ts \
                --version "$TAG" \
                --previous "${PREV_TAG:-}" \
                --repo "$REPO") \
            > notes.md
          echo "--- notes.md ---"
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md

  build-mac:
    name: Build & upload macOS DMGs
    # Parallel with ECR docker dev rollout. DMG failure does NOT
    # gate the server rollout — desktop app and server are independent
    # artifacts. If this job fails, the server deploys still proceed and
    # the DMG can be cut manually afterward with `npm run release:mac`.
    needs: release
    runs-on: macos-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          # `server/node_modules` must exist at pack time because
          # `server/**/*` is in `asarUnpack` and electron/main.js boots the
          # embedded server via `node_modules/tsx/dist/cli.mjs`. Without
          # this, the .app ships without tsx and launches to a black screen.
          npm ci --include=dev
          (cd client && npm ci --include=dev)
          (cd server && npm ci --include=dev)

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-release-all-mac-${{ github.run_id }}

      - name: Build DMGs and upload to S3
        run: node electron/release-mac.mjs

      - name: Summarize
        if: success()
        run: |
          {
            echo "## 🍎 macOS DMGs uploaded"
            echo ""
            echo "- Bucket: \`s3://agent-hub-prod-releases/${TAG}/\`"
            echo "- Artifacts: \`Agent Hub-*-arm64.dmg\`, \`Agent Hub-*.dmg\`"
            echo ""
            echo "> First-pass builds are **unsigned**. Code-signing and notarization will be added in a follow-up PR."
          } >> "$GITHUB_STEP_SUMMARY"

  # Prod sandbox rolls out in parallel with build-mac after `release`.
  # Publishes immutable `:vX.Y.Z` (+ `:sha`) only — never retags `:main`.
  # Two writers of `:main` race and fail the digest gate (Release #49 / v2.31.77).
  docker-ecr-dev:
    name: ECR push and prod sandbox
    needs: release
    uses: ./.github/workflows/ecr-publish-rollout-docker-dev.yml
    with:
      git_ref: refs/tags/${{ needs.release.outputs.tag }}
      version_tag: refs/tags/${{ needs.release.outputs.tag }}
      rollout: true
      reset_instance: ${{ inputs.docker_reset_instance }}

  # Rebake prod Finalize AMI for the release tag when the runner digest moved.
  # Pins LT without instance refresh; terraform-apply consumes the AMI via TF_VAR.
  # allow_failure: infra apply still runs (falls back to SSM / committed tfvars).
  bake-finalize-ami-prod:
    name: Bake prod Finalize runner AMI
    needs: [release, docker-ecr-dev]
    uses: ./.github/workflows/bake-finalize-runner-ami.yml
    with:
      fleet: prod
      runner_image: ${{ format('{0}/agent-hub-finalize-runner:{1}', vars.ECR_REGISTRY || 'public.ecr.aws/h9t4v7h0', needs.release.outputs.tag) }}
      aws_role_arn: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
      aws_region: ${{ vars.AWS_REGION || 'us-east-2' }}
      force: false
      allow_failure: true
    secrets: inherit

  # Prod infrastructure apply. Runs on every release so a merged Terraform change
  # actually lands. Waits on bake so TF_VAR_finalize_runner_ami_id matches the
  # launch-template pin (a stale finalize_runner_ami_id in committed tfvars
  # would otherwise revert a fresher AMI). ECR/SSM path ships app code; this
  # ships infra (buckets, IAM, ALB, fleet, Hub env).
  #
  # Two rails make an unattended prod apply safe, and both are load-bearing:
  #
  #   1. The plan is saved, converted to JSON, and checked by
  #      ops/terraform/scripts/assert-no-protected-replacements.sh before it is
  #      applied. If the plan would destroy or replace `aws_instance.app`,
  #      `aws_ebs_volume.hub_data`, or `aws_volume_attachment.hub_data`, the job
  #      fails and applies nothing. Apply consumes the SAVED plan, so what the
  #      guard approved is exactly what lands.
  #   2. Rendered user-data never reaches an existing host (cloud-init does not
  #      re-run), so an env change is adopted in place by the env-sync step via
  #      SSM. That is why the `user_data_replace_on_change` switch no longer
  #      exists: nothing here needs to rebuild the box to change a variable.
  #
  # Required CI configuration:
  #   - committed environments/prod/prod.tfvars — non-secret prod fleet/sizing
  #                                  config (instance types, sizes, toggles).
  #                                  Scanned by public-repo-hygiene.test.ts, so
  #                                  account-specific identifiers are NOT in it.
  #   - var    PUBLIC_FQDN, BASE_DOMAIN, ROOT_DELEGATION_ZONE_ID,
  #                                  ROOT_DELEGATION_ROLE_ARN, HUB_DATA_KMS_KEY_ARN,
  #                                  ARTIFACTS_BUCKET_NAME — account-specific
  #                                  identifiers injected as TF_VAR_*. Required:
  #                                  the apply fails-fast before plan if any is
  #                                  empty. ALB_ACCESS_LOGS_BUCKET is optional.
  #   - var    CI_SSM_DEPLOY_INSTANCE_ID, FINALIZE_CACHE_BUCKET_NAME,
  #                                  FINALIZE_WORKTREE_BUCKET_NAME,
  #                                  FINALIZE_RUNNER_AMI_ID — non-secret
  #                                  deployment identifiers (Variables, not
  #                                  Secrets). Optional: AMI is a fallback
  #                                  (bake/SSM pin wins); the instance id / fleet
  #                                  buckets have downstream Terraform guards.
  #   - secret AGENT_HUB_AHLOG_TOKEN (optional) — AHLOG ingest token. Secrets are
  #                                  reserved for tokens. Other optional token
  #                                  secrets: AGENT_HUB_API_KEY,
  #                                  TF_GITHUB_TOKEN_FOR_GIT_CLONE. Missing/empty
  #                                  → Terraform defaults (do not resurrect PROD_TFVARS).
  #   - var    AWS_TERRAFORM_ROLE_ARN — an OIDC role in the prod account with
  #                                  permission to read/write the S3 state + lock
  #                                  table and manage every resource in the stack.
  #   - var    TF_STATE_BUCKET     — remote-state bucket (e.g. agent-hub-tfstate-<acct>).
  #   - var    TF_STATE_LOCK_TABLE — DynamoDB lock table (e.g. agent-hub-tfstate-lock).
  #   - var    AWS_REGION          — defaults to us-east-2 when unset.
  #   - var    DOCKER_DEPLOY_INSTANCE_ID — the prod sandbox rollout target,
  #                                  reused here as
  #                                  TF_VAR_ci_ssm_expected_deploy_instance_ids so
  #                                  the plan asserts the CI SSM grant covers it.
  #                                  DEV Hub was decommissioned 2026-08-17.
  terraform-apply:
    name: Terraform apply (prod infra)
    needs: [release, bake-finalize-ami-prod]
    # The reusable bake job allows failure; still apply when bake fails/skips.
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for AWS
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      # Prefer the AMI this release just baked/pinned; falls through to SSM in the
      # plan step if the reusable output is empty (should not happen).
      BAKED_FINALIZE_AMI: ${{ needs.bake-finalize-ami-prod.outputs.ami_id }}
      # Single source of truth for the rollout target. Release / push-image
      # SSM vars.DOCKER_DEPLOY_INSTANCE_ID; the CI role's ssm:SendCommand grant
      # is scoped by ci_ssm_deploy_* in committed prod.tfvars. Feeding the
      # Variable into the plan makes Terraform assert the grant covers it — see
      # terraform_data.ci_ssm_deploy_target_guard. Job-scoped because
      # `terraform apply` consumes the saved plan, so the var has to be present
      # at plan time or the assertion never runs. Empty (Variable unset) skips
      # the assertion. DEV Hub (DOCKER_DEPLOY_DEV_INSTANCE_ID) was decommissioned.
      TF_VAR_ci_ssm_expected_deploy_instance_ids: '["${{ vars.DOCKER_DEPLOY_INSTANCE_ID }}"]'
    defaults:
      run:
        working-directory: ops/terraform
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-release-all-tf-${{ github.run_id }}

      # Pinned to the version the committed .terraform.lock.hcl + state lineage
      # were produced with, so CI never silently upgrades prod state. Wrapper off
      # so `terraform` exit codes propagate normally.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.3
          terraform_wrapper: false

      # Non-secret prod config is committed. Tokens are individual GitHub
      # secrets injected as TF_VAR_* below (empty/missing → Terraform default).
      - name: Assert committed prod.tfvars is present
        run: |
          set -euo pipefail
          if [ ! -f environments/prod/prod.tfvars ]; then
            echo "::error::environments/prod/prod.tfvars is missing from the checkout. Non-secret prod config is committed; do not recreate the PROD_TFVARS blob." >&2
            exit 1
          fi

      # Only tokens (credentials) come from GitHub Secrets. Non-secret
      # deployment identifiers live in GitHub Variables (injected in the next
      # step). Empty/missing token → Terraform default (never override with "").
      - name: Inject Terraform tokens from GitHub Secrets
        env:
          AGENT_HUB_AHLOG_TOKEN: ${{ secrets.AGENT_HUB_AHLOG_TOKEN }}
          AGENT_HUB_API_KEY: ${{ secrets.AGENT_HUB_API_KEY }}
          TF_GITHUB_TOKEN_FOR_GIT_CLONE: ${{ secrets.TF_GITHUB_TOKEN_FOR_GIT_CLONE }}
        run: |
          set -euo pipefail
          # Only export when the secret is non-empty so a missing GitHub secret
          # cannot override Terraform defaults / generated values with "".
          append_tf_var() {
            local name="$1" value="${2:-}"
            if [ -z "$value" ]; then
              return 0
            fi
            {
              echo "${name}<<TFVAR_EOF"
              printf '%s\n' "$value"
              echo "TFVAR_EOF"
            } >> "$GITHUB_ENV"
          }
          append_tf_var TF_VAR_agent_hub_ahlog_token "${AGENT_HUB_AHLOG_TOKEN}"
          append_tf_var TF_VAR_agent_hub_api_key "${AGENT_HUB_API_KEY}"
          append_tf_var TF_VAR_github_token_for_git_clone "${TF_GITHUB_TOKEN_FOR_GIT_CLONE}"

      # Deployment identifiers are internal-only but NOT secret (instance/AMI ids,
      # bucket names, domain, account-scoped ARNs), so they live in GitHub
      # Variables — Secrets are reserved for tokens. They are also kept out of the
      # committed prod.tfvars (public-repo-hygiene.test.ts scans it) and inject as
      # TF_VAR_* here. Required identifiers fail-fast: with base_domain unset,
      # create_route53_zone would try to build a zone for the "example.com"
      # default; kms/artifacts have plan-time preconditions, but a clear error
      # before plan beats a cryptic one during it. The finalize/SSM identifiers
      # stay optional — the AMI has a bake/SSM fallback, and the instance id /
      # fleet buckets carry their own downstream Terraform guards.
      - name: Inject Terraform deployment identifiers from GitHub Variables
        env:
          PUBLIC_FQDN: ${{ vars.PUBLIC_FQDN }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          ROOT_DELEGATION_ZONE_ID: ${{ vars.ROOT_DELEGATION_ZONE_ID }}
          ROOT_DELEGATION_ROLE_ARN: ${{ vars.ROOT_DELEGATION_ROLE_ARN }}
          HUB_DATA_KMS_KEY_ARN: ${{ vars.HUB_DATA_KMS_KEY_ARN }}
          ALB_ACCESS_LOGS_BUCKET: ${{ vars.ALB_ACCESS_LOGS_BUCKET }}
          ARTIFACTS_BUCKET_NAME: ${{ vars.ARTIFACTS_BUCKET_NAME }}
          CI_SSM_DEPLOY_INSTANCE_ID: ${{ vars.CI_SSM_DEPLOY_INSTANCE_ID }}
          FINALIZE_RUNNER_AMI_ID: ${{ vars.FINALIZE_RUNNER_AMI_ID }}
          FINALIZE_CACHE_BUCKET_NAME: ${{ vars.FINALIZE_CACHE_BUCKET_NAME }}
          FINALIZE_WORKTREE_BUCKET_NAME: ${{ vars.FINALIZE_WORKTREE_BUCKET_NAME }}
        run: |
          set -euo pipefail
          append_tf_var() {
            local name="$1" value="${2:-}"
            [ -z "$value" ] && return 0
            {
              echo "${name}<<TFVAR_EOF"
              printf '%s\n' "$value"
              echo "TFVAR_EOF"
            } >> "$GITHUB_ENV"
          }
          require_tf_var() {
            local name="$1" var="$2" value="${3:-}"
            if [ -z "$value" ]; then
              echo "::error::Required GitHub Variable ${var} is unset. Set the prod env identifiers (PUBLIC_FQDN, BASE_DOMAIN, ROOT_DELEGATION_ZONE_ID, ROOT_DELEGATION_ROLE_ARN, HUB_DATA_KMS_KEY_ARN, ARTIFACTS_BUCKET_NAME) before releasing — they moved out of prod.tfvars." >&2
              exit 1
            fi
            append_tf_var "$name" "$value"
          }
          # Required — no safe Terraform default for a live prod apply.
          require_tf_var TF_VAR_public_fqdn PUBLIC_FQDN "${PUBLIC_FQDN}"
          require_tf_var TF_VAR_base_domain BASE_DOMAIN "${BASE_DOMAIN}"
          require_tf_var TF_VAR_root_delegation_zone_id ROOT_DELEGATION_ZONE_ID "${ROOT_DELEGATION_ZONE_ID}"
          require_tf_var TF_VAR_root_delegation_role_arn ROOT_DELEGATION_ROLE_ARN "${ROOT_DELEGATION_ROLE_ARN}"
          require_tf_var TF_VAR_hub_data_kms_key_arn HUB_DATA_KMS_KEY_ARN "${HUB_DATA_KMS_KEY_ARN}"
          require_tf_var TF_VAR_artifacts_bucket_name ARTIFACTS_BUCKET_NAME "${ARTIFACTS_BUCKET_NAME}"
          # Optional — empty disables ALB access logging (no access_logs block).
          append_tf_var TF_VAR_alb_access_logs_bucket "${ALB_ACCESS_LOGS_BUCKET}"
          # Optional — AMI has a bake/SSM fallback (resolved below); the deploy
          # instance id and fleet bucket names carry downstream Terraform guards.
          append_tf_var TF_VAR_ci_ssm_deploy_instance_id "${CI_SSM_DEPLOY_INSTANCE_ID}"
          append_tf_var TF_VAR_finalize_runner_ami_id "${FINALIZE_RUNNER_AMI_ID}"
          append_tf_var TF_VAR_finalize_cache_bucket_name "${FINALIZE_CACHE_BUCKET_NAME}"
          append_tf_var TF_VAR_finalize_worktree_bucket_name "${FINALIZE_WORKTREE_BUCKET_NAME}"

      # Backend values are non-secret; passed inline so no backend.hcl is needed.
      - name: Terraform init
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      # Override finalize_runner_ami_id so apply cannot undo the bake pin.
      # GitHub Variable FINALIZE_RUNNER_AMI_ID is the fallback; bake/SSM wins.
      - name: Resolve finalize_runner_ami_id for TF_VAR
        run: |
          set -euo pipefail
          AMI="${BAKED_FINALIZE_AMI:-}"
          if [ -z "$AMI" ] || [ "$AMI" = None ]; then
            AMI=$(aws ssm get-parameter --name /agenthub/prod/finalize-runner-ami-id \
              --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          fi
          if [ -z "$AMI" ] || [ "$AMI" = None ]; then
            echo "::warning::No baked/SSM finalize AMI — terraform will use GitHub Variable FINALIZE_RUNNER_AMI_ID / secrets.tfvars as-is."
            exit 0
          fi
          echo "TF_VAR_finalize_runner_ami_id=$AMI" >>"$GITHUB_ENV"
          echo "Using finalize_runner_ami_id=$AMI"

      # Saved plan + JSON rendering. Everything downstream keys off this exact
      # plan file so the guard cannot approve one plan while apply runs another.
      - name: Terraform plan
        run: |
          set -euo pipefail
          terraform plan -input=false \
            -var-file=environments/prod/prod.tfvars \
            -out="$RUNNER_TEMP/prod.plan"
          terraform show -json "$RUNNER_TEMP/prod.plan" > "$RUNNER_TEMP/prod.plan.json"

      - name: Assert the plan cannot destroy the Hub
        run: ./scripts/assert-no-protected-replacements.sh "$RUNNER_TEMP/prod.plan.json"

      - name: Terraform apply (saved plan)
        run: terraform apply -input=false -auto-approve "$RUNNER_TEMP/prod.plan"

      # The Hub .env is baked into user-data, which only a fresh instance would
      # read. Export the managed (non-secret, non-UI-owned) subset so the next
      # step can upsert it on the running host instead.
      - name: Collect Hub env sync inputs
        id: hubenv
        run: |
          set -euo pipefail

          # NO `|| true` on these. Swallowing a terraform failure here is not
          # graceful degradation: an empty hub_env_managed is a VALID instruction
          # to the sync meaning "retract every managed key", so one flaky CLI
          # call would strip the running Hub of its configuration and restart it.
          # An empty value may only mean "empty" when the command SUCCEEDED.
          #
          # -json rather than -raw because hub_env_file_path is null on stacks
          # that render no .env, and `-raw` treats null as an error. With -json
          # that case stays valid JSON, so "this stack has nothing to sync" stays
          # distinguishable from "terraform broke" instead of both arriving as a
          # non-zero exit that the old `|| true` then erased.
          tf_out() { terraform output -json "$1" | jq -r 'if . == null then "" else . end'; }

          # Values are deliberately not echoed - this repo's Actions logs are public.
          INSTANCE_ID="$(tf_out instance_id)"
          ENV_PATH="$(tf_out hub_env_file_path)"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "env_path=$ENV_PATH" >> "$GITHUB_OUTPUT"

          # hub_env_file_path is null exactly when this stack renders no docker
          # .env. Nothing to sync, and that is a legitimate skip rather than an
          # error.
          if [ -z "$ENV_PATH" ]; then
            echo "syncable=false" >> "$GITHUB_OUTPUT"
            echo "This stack renders no Hub .env; skipping env sync."
            exit 0
          fi

          MANAGED="$(tf_out hub_env_managed)"
          MANAGED_KEYS="$(tf_out hub_env_managed_keys)"
          RUNTIME_KEYS="$(tf_out hub_env_runtime_injected_keys)"

          # The stack DOES render a .env, so every input below is required and
          # non-empty by construction: docker_bootstrap_env always carries
          # NODE_ENV / AGENT_HUB_PORT / ALLOWED_ORIGINS and the key lists are
          # static. An empty one therefore means the data is wrong, never that
          # Terraform wants nothing, so fail the release rather than hand the
          # live Hub a retract-everything instruction. (The host script still
          # supports a genuinely empty desired set for direct invocation; what
          # must not happen is this pipeline MANUFACTURING one from a failure.)
          MISSING=""
          [ -n "$INSTANCE_ID" ] || MISSING="$MISSING instance_id"
          [ -n "$MANAGED" ] || MISSING="$MISSING hub_env_managed"
          [ -n "$MANAGED_KEYS" ] || MISSING="$MISSING hub_env_managed_keys"
          [ -n "$RUNTIME_KEYS" ] || MISSING="$MISSING hub_env_runtime_injected_keys"
          if [ -n "$MISSING" ]; then
            echo "::error::Empty Terraform output(s) for a stack that renders a Hub .env:$MISSING. Refusing to sync, because an empty managed set would retract every key from the running Hub."
            exit 1
          fi

          printf '%s\n' "$MANAGED" > "$RUNNER_TEMP/hub-env-managed.env"
          # Key names only (no values). Lets the host drop keys Terraform stopped
          # emitting; otherwise disabling a feature leaves its old lines live.
          printf '%s\n' "$MANAGED_KEYS" > "$RUNNER_TEMP/hub-env-managed-keys.txt"
          # Owned keys that survive removal because docker run -e or an image ENV
          # line supplies them; exempt from the host's retraction check.
          printf '%s\n' "$RUNTIME_KEYS" > "$RUNNER_TEMP/hub-env-runtime-keys.txt"

          echo "syncable=true" >> "$GITHUB_OUTPUT"
          echo "Managed key count: $(grep -cvE '^[[:space:]]*(#|$)' "$RUNNER_TEMP/hub-env-managed.env")"

      # Restarts the Hub only when a managed value actually changed or a managed
      # key was retracted, so a release with no env delta costs nothing.
      - name: Sync Hub env over SSM (no instance replacement)
        if: steps.hubenv.outputs.syncable == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          # Every file is written and validated above, so the arguments are
          # unconditional; a missing one would have failed that step.
          ops/scripts/sync-hub-env.sh \
            --instance-id "${{ steps.hubenv.outputs.instance_id }}" \
            --region "$AWS_REGION" \
            --remote-path "${{ steps.hubenv.outputs.env_path }}" \
            --env-file "$RUNNER_TEMP/hub-env-managed.env" \
            --managed-keys-file "$RUNNER_TEMP/hub-env-managed-keys.txt" \
            --runtime-keys-file "$RUNNER_TEMP/hub-env-runtime-keys.txt"

  summary:
    name: Release summary
    needs: [release, docker-ecr-dev, bake-finalize-ami-prod, build-mac, terraform-apply]
    # Always run so the operator gets a single status block at the bottom
    # of the workflow page, regardless of which fan-out leg succeeded.
    if: always()
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      RELEASE_RESULT: ${{ needs.release.result }}
      DOCKER_ECR_RESULT: ${{ needs.docker-ecr-dev.result }}
      BAKE_AMI_RESULT: ${{ needs.bake-finalize-ami-prod.result }}
      MAC_RESULT: ${{ needs.build-mac.result }}
      TERRAFORM_RESULT: ${{ needs.terraform-apply.result }}
    steps:
      - name: Emit summary
        run: |
          set -euo pipefail
          icon() {
            case "$1" in
              success) echo "✅";;
              failure) echo "❌";;
              cancelled) echo "⚪";;
              skipped) echo "⏭️";;
              *) echo "❓";;
            esac
          }
          {
            echo "## Release — ${TAG:-(no tag cut)}"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Tag & release      | $(icon "$RELEASE_RESULT") $RELEASE_RESULT |"
            echo "| ECR + docker dev   | $(icon "$DOCKER_ECR_RESULT") $DOCKER_ECR_RESULT |"
            echo "| Bake Finalize AMI  | $(icon "$BAKE_AMI_RESULT") $BAKE_AMI_RESULT (pin LT, no refresh) |"
            echo "| Build mac DMGs     | $(icon "$MAC_RESULT") $MAC_RESULT (non-gating) |"
            echo "| Terraform apply    | $(icon "$TERRAFORM_RESULT") $TERRAFORM_RESULT (incl. guarded plan + SSM env sync) |"
          } >> "$GITHUB_STEP_SUMMARY"
