name: API Docs

# Builds the Redoc-rendered OpenAPI bundle and (on main) publishes it to
# GitHub Pages. The build step strips operations flagged `x-internal: true`
# via `scripts/build-openapi-public.ts` — the unit test for the filter
# lives in `server/openapi-filter.test.ts`.
#
# On pull_request: build only (no deploy) so reviewers can see the
# artifact and confirm the filter didn't drop something it shouldn't.
# On push to main: build + deploy via actions/deploy-pages@v4.
#
# **One-time repo setting required:** Settings → Pages → Source → "GitHub
# Actions". The deploy job will fail until that toggle is flipped.

on:
  push:
    branches: [main]
    paths:
      - 'docs/api/**'
      - 'server/openapi/**'
      - 'server/openapi-filter.ts'
      - 'server/openapi-coverage.ts'
      - 'server/openapi-coverage.test.ts'
      - 'server/routes/**'
      - 'scripts/build-openapi-public.ts'
      - 'scripts/check-openapi-coverage.ts'
      - 'scripts/check-openapi-freshness.ts'
      - 'scripts/openapi-coverage-baseline.json'
      - '.github/workflows/api-docs.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'server/package.json'
      - 'server/package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'docs/api/**'
      - 'server/openapi/**'
      - 'server/openapi-filter.ts'
      - 'server/openapi-coverage.ts'
      - 'server/openapi-coverage.test.ts'
      - 'server/routes/**'
      - 'scripts/build-openapi-public.ts'
      - 'scripts/check-openapi-coverage.ts'
      - 'scripts/check-openapi-freshness.ts'
      - 'scripts/openapi-coverage-baseline.json'
      - '.github/workflows/api-docs.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'server/package.json'
      - 'server/package-lock.json'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build OpenAPI bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 matches the project's `engines.node` (>=22.14.0 <23.0.0).
      # Earlier this workflow ran on Node 20, which silently broke side-effect
      # imports of several route modules — the generator's try/catch swallowed
      # the failures and produced a smaller-than-expected spec that drifted
      # against the committed YAML. Keep this aligned with `package.json`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts --include=dev

      - name: Install server dependencies (for tsx + filter module)
        run: cd server && npm ci --ignore-scripts --include=dev

      # `--ignore-scripts` above skips the root `postinstall` hook
      # (`npm rebuild better-sqlite3`). Many route modules transitively
      # import `server/db.ts`, which loads better-sqlite3's native binding
      # at module-load time. Without the rebuild, the generator's
      # side-effect imports silently fail ("Could not locate the bindings
      # file"), and the emitted spec ends up missing ~half of the
      # registered paths/schemas. Mirrors ci.yml's "Rebuild native
      # modules" step.
      - name: Rebuild better-sqlite3 native binding
        run: cd server && npm rebuild better-sqlite3

      - name: Run filter unit tests
        run: cd server && npx vitest run openapi-filter.test.ts openapi-coverage.test.ts openapi/registry.test.ts

      # Coverage ratchet — fails the build when a new route handler lands
      # without a `registry.registerPath(...)` (or when the per-file baseline
      # in `scripts/openapi-coverage-baseline.json` is exceeded).
      # Acceptance criterion (a) of card 3ed3bfc9.
      - name: Check OpenAPI schema coverage (per-file ratchet)
        run: npm run check:openapi-coverage

      - name: Generate OpenAPI spec from Zod registry
        run: npm run generate:openapi

      # Freshness gate — fails the build when the committed
      # `docs/api/openapi.yaml` doesn't match the generator's output.
      # Forces contributors who change a Zod schema or route to regenerate
      # the spec in the same PR. Acceptance criterion (b) of card 3ed3bfc9.
      #
      # We rely on `git diff --exit-code` (rather than re-running the
      # freshness script) because the previous step has already regenerated
      # the file in place — a diff against HEAD is the cheapest check.
      - name: Check committed openapi.yaml is up to date
        run: |
          if ! git diff --exit-code --stat -- docs/api/openapi.yaml; then
            echo ""
            echo "OpenAPI spec is STALE — docs/api/openapi.yaml does not match the generator output."
            echo "Run \`npm run generate:openapi\` locally and commit the result."
            echo ""
            git --no-pager diff -- docs/api/openapi.yaml | head -100
            exit 1
          fi

      - name: Build filtered bundle (strip x-internal)
        run: cd server && npx tsx ../scripts/build-openapi-public.ts --out ../docs/api/_site

      - name: Smoke-test output
        run: test -f docs/api/_site/openapi.yaml

      - name: Show output for log/debug
        run: |
          ls -la docs/api/_site
          echo "---"
          head -40 docs/api/_site/openapi.yaml

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api/_site

      - name: Upload PR preview artifact (workflow run only — not deployed)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: api-docs-preview
          path: docs/api/_site
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
