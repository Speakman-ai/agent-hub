# Builds the server + Finalize runner images and pushes them to public ECR,
# then optionally SSMs a host to pull the moving tag this run published.
#
# Tag ownership (do not collapse these — two writers of `:main` race and the
# digest gate fails even when the host is healthy):
#   - Deploy DEV Hub from main owns `:main` (dev.agenthub.*).
#   - Release publishes immutable `:vX.Y.Z` (+ `:sha`) and rolls the prod
#     sandbox (agenthub.surveytracker.io) to that tag. It must NOT retag `:main`.
#   - `/etc/agent-hub/image-tag` also retags the in-box finalize-runner image
#     to the same moving tag (user-data run script).
#
# Called by `release-all.yml` after a semver tag is pushed, and by
# `deploy-dev-hub-on-main.yml` on every merge to main. `push-image.yml` is the
# escape hatch for arbitrary refs.
#
# See also: wiki / deployment-guide (docker dev sandbox path).
name: ECR publish and docker dev rollout

on:
  workflow_call:
    inputs:
      git_ref:
        description: >-
          Ref to checkout before build (e.g. refs/tags/v1.2.3 or refs/heads/main).
        required: true
        type: string
      reset_instance:
        description: >-
          When true (with rollout), wipes Agent Hub state on the sandbox before
          restart; see `.github/workflows/push-image.yml` history for behavior.
        required: false
        type: boolean
        default: false
      rollout:
        description: When true, run SSM docker restart after the image push.
        required: false
        type: boolean
        default: true
      version_tag:
        description: >-
          Optional extra immutable tag pushed alongside sha/branch (e.g. refs/tags/v1.2.3).
        required: false
        type: string
        default: ''
      deploy_instance_id:
        description: >-
          EC2 instance id to SSM for rollout. When empty, falls back to
          vars.DOCKER_DEPLOY_INSTANCE_ID (prod sandbox / agenthub.surveytracker.io).
          Deploy DEV Hub from main passes vars.DOCKER_DEPLOY_DEV_INSTANCE_ID
          (dev.agenthub.*) so release rollouts stay on prod.
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      reset_instance:
        description: >-
          Wipe Agent Hub state on the dev sandbox before restart (fresh-setup test).
          Preserves OS, /etc/letsencrypt, and /data/config.json.
        required: false
        type: boolean
        default: false
      rollout:
        description: Restart Agent Hub docker on the dev sandbox after push via SSM.
        required: false
        type: boolean
        default: true
      version_tag:
        description: >-
          Optional extra immutable tag pushed alongside branch/sha (e.g. refs/tags/v1.2.3).
        required: false
        type: string
        default: ''
      deploy_instance_id:
        description: >-
          Optional EC2 instance id override for SSM rollout (else repo Variables).
        required: false
        type: string
        default: ''

# One rollout at a time; cancel superseded manual runs against the same ref.
concurrency:
  group: ecr-publish-docker-dev-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # OIDC: assume AWS role without long-lived keys
  contents: read

defaults:
  run:
    shell: bash

env:
  AWS_REGION: us-east-1 # ECR Public API is us-east-1 only
  # ECR Public registry base. Set repo/org Actions Variable ECR_REGISTRY (e.g.
  # public.ecr.aws/<alias>) to publish under your own registry; the vendor
  # default keeps forks building without extra config. No account-specific
  # identifier is baked in here.
  ECR_PUBLIC_URI: ${{ vars.ECR_REGISTRY || 'public.ecr.aws/h9t4v7h0' }}/agent-hub
  ECR_PUBLIC_RUNNER_URI: ${{ vars.ECR_REGISTRY || 'public.ecr.aws/h9t4v7h0' }}/agent-hub-finalize-runner
  # OIDC role assumed to push images to ECR Public. Set repo/org Actions
  # Variable ECR_PUSH_ROLE_ARN to your account's CI push role ARN, so no
  # account-specific ARN ships in the public tree.
  AWS_ROLE_TO_ASSUME: ${{ vars.ECR_PUSH_ROLE_ARN }}

jobs:
  push:
    name: Build + push image
    runs-on: ubuntu-latest
    # Must fit a COLD (cache-miss) build of BOTH images, not just the usual
    # warm one. Warm builds are ~7s per image because every layer hits the gha
    # cache; but the Finalize runner Dockerfile's `FROM ubuntu:24.04` floats, so
    # whenever Docker Hub republishes that tag every layer invalidates and the
    # runner rebuilds from scratch (~30m+, dominated by the big apt-get layer
    # against a frequently-slow archive.ubuntu.com).
    #
    # At 30m that cold rebuild could not finish, and the failure was
    # SELF-PERPETUATING: `cache-to` only exports after a successful build, so a
    # timed-out run wrote no cache and every retry started cold again. Release
    # run 30917756003 died this way hours after ubuntu:24.04 was republished
    # (base digest 4fbb8e6a -> 561618e2 on 2026-08-04).
    #
    # Keep this well above the cold-build cost; it only binds on the rare
    # cache-miss run and never slows a warm one. Guarded by
    # server/push-image-workflow.test.ts.
    timeout-minutes: 75
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      # The moving tag this run published, for the deploy job's digest assertion.
      moving_tag: ${{ steps.tags.outputs.branch }}
    steps:
      # Reusable workflows inherit the *caller's* github.event_name (e.g.
      # workflow_dispatch when Release invokes us), not "workflow_call". Branching
      # checkout on event_name therefore skipped inputs.git_ref and built the
      # image from pre-bump main — one semver behind the tag Release just cut.
      # Always honor inputs.git_ref when set; push-image.yml passes github.ref.
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR Public
        run: |
          aws ecr-public get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: tags
        env:
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          INPUT_GIT_REF: ${{ inputs.git_ref }}
        run: |
          set -euo pipefail
          SHA_SHORT="$(git rev-parse --short=12 HEAD)"
          sanitize_docker_tag() {
            local raw="$1"
            local s
            s="$(printf '%s' "$raw" | tr -c 'A-Za-z0-9_.-' '-')"
            s="$(printf '%s' "$s" | sed -e 's/^[^A-Za-z0-9]*//' -e 's/[^A-Za-z0-9]*$//')"
            while [[ "$s" == *--* ]]; do s="${s//--/-}"; done
            if [[ -z "$s" ]]; then s="branch"; fi
            printf '%s' "$s"
          }
          # Truncate the sanitized *base* first so the full SHA suffix always
          # remains — truncating the combined string can drop the suffix and
          # re-introduce collisions for long refs.
          unique_docker_tag() {
            local base suffix max_base
            base="$(sanitize_docker_tag "$1")"
            suffix="$2"
            max_base=$((128 - 1 - ${#suffix}))
            if (( max_base < 1 )); then max_base=1; fi
            base="${base:0:max_base}"
            base="$(printf '%s' "$base" | sed -e 's/[^A-Za-z0-9]*$//')"
            if [[ -z "$base" ]]; then base="branch"; fi
            printf '%s' "${base}-${suffix}"
          }
          # Preserve stable tags consumed by Terraform / installs (`:main`,
          # exact semver). Only arbitrary refs get a collision-resistant suffix.
          is_stable_docker_tag() {
            local raw="$1"
            local sanitized
            sanitized="$(sanitize_docker_tag "$raw")"
            [[ "$raw" == "$sanitized" ]] || return 1
            [[ "$raw" == "main" ]] && return 0
            [[ "$raw" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9_.-]+)?$ ]]
          }
          EXTRA_TAG=""
          if [[ -n "$INPUT_VERSION_TAG" ]]; then
            if [[ "$INPUT_VERSION_TAG" == refs/tags/* ]]; then
              EXTRA_TAG="${INPUT_VERSION_TAG#refs/tags/}"
            else
              EXTRA_TAG="$INPUT_VERSION_TAG"
            fi
            if ! is_stable_docker_tag "$EXTRA_TAG"; then
              EXTRA_TAG="$(unique_docker_tag "$EXTRA_TAG" "$SHA_SHORT")"
            fi
          fi
          # Moving tag = the tag THIS publish owns. Reusable workflows inherit
          # the *caller's* GITHUB_REF_NAME, so Release (dispatched from `main`
          # while checking out `refs/tags/vX.Y.Z`) used to retag `:main` and
          # race Deploy DEV Hub from main — both wrote `:main`, each digest
          # gate failed. Precedence: version_tag (Release) → git_ref if it is
          # a heads/tags ref → GITHUB_REF_NAME (push to main).
          MOVING_SRC=""
          if [[ -n "$EXTRA_TAG" ]]; then
            MOVING_SRC="$EXTRA_TAG"
          elif [[ "$INPUT_GIT_REF" == refs/tags/* ]]; then
            MOVING_SRC="${INPUT_GIT_REF#refs/tags/}"
          elif [[ "$INPUT_GIT_REF" == refs/heads/* ]]; then
            MOVING_SRC="${INPUT_GIT_REF#refs/heads/}"
          else
            MOVING_SRC="${GITHUB_REF_NAME:-main}"
          fi
          if is_stable_docker_tag "$MOVING_SRC"; then
            BRANCH="$MOVING_SRC"
          else
            BRANCH="$(unique_docker_tag "$MOVING_SRC" "$SHA_SHORT")"
          fi

          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          {
            echo "docker_tags_multi<<DOCKER_TAGS_EOF"
            echo "${ECR_PUBLIC_URI}:${SHA_SHORT}"
            echo "${ECR_PUBLIC_URI}:${BRANCH}"
            if [[ -n "$EXTRA_TAG" && "$EXTRA_TAG" != "$BRANCH" ]]; then
              echo "${ECR_PUBLIC_URI}:${EXTRA_TAG}"
            fi
            echo "DOCKER_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "runner_tags_multi<<RUNNER_TAGS_EOF"
            echo "${ECR_PUBLIC_RUNNER_URI}:${SHA_SHORT}"
            echo "${ECR_PUBLIC_RUNNER_URI}:${BRANCH}"
            if [[ -n "$EXTRA_TAG" && "$EXTRA_TAG" != "$BRANCH" ]]; then
              echo "${ECR_PUBLIC_RUNNER_URI}:${EXTRA_TAG}"
            fi
            echo "RUNNER_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push server image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.docker_tags_multi }}
          # Vendor control-plane endpoints baked into the client bundle the
          # server image serves. Sourced from repo Variables so nothing
          # account-specific ships in the public tree; empty vars → feature off.
          build-args: |
            VITE_BUG_REPORT_ENDPOINT=${{ vars.VITE_BUG_REPORT_ENDPOINT }}
            VITE_REPLAY_INGEST_ENDPOINT=${{ vars.VITE_REPLAY_INGEST_ENDPOINT }}
            VITE_RELEASE_BUCKET_BASE=${{ vars.VITE_RELEASE_BUCKET_BASE }}
          cache-from: type=gha,scope=agent-hub-server
          cache-to: type=gha,mode=max,scope=agent-hub-server,ignore-error=true

      - name: Set up Node (for runner-agent bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle runner-agent into the runner build context
        # The runner Dockerfile COPYs runner-agent.mjs. esbuild bundles the
        # runner-agent's npm imports (yaml, uuid, …) INTO the single .mjs, so
        # server deps must be installed first — a fresh CI checkout has no
        # node_modules (a previous comment wrongly claimed none was needed; the
        # first release after the fleet code merged failed here on unresolved
        # 'yaml'/'uuid').
        run: |
          cd server
          npm ci
          npx --yes esbuild@0.27.7 finalize/runner-agent-cli.ts \
            --bundle --platform=node --format=esm --target=node22 \
            --banner:js="import{createRequire as __cr}from'module';const require=__cr(import.meta.url);" \
            --outfile=finalize/runner/runner-agent.mjs

      - name: Build + push Finalize runner image
        id: build_runner
        uses: docker/build-push-action@v5
        with:
          context: server/finalize/runner
          file: server/finalize/runner/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.runner_tags_multi }}
          cache-from: type=gha,scope=agent-hub-finalize-runner
          cache-to: type=gha,mode=max,scope=agent-hub-finalize-runner,ignore-error=true

      - name: Summary
        env:
          ST_SHA: ${{ steps.tags.outputs.sha_short }}
          ST_BRANCH: ${{ steps.tags.outputs.branch }}
          # ECR_PUBLIC_URI / ECR_PUBLIC_RUNNER_URI are inherited from workflow env.
        run: |
          {
            echo "### Pushed images"
            echo ""
            echo "**Server**"
            echo "- \`${ECR_PUBLIC_URI}:${ST_SHA}\`"
            echo "- \`${ECR_PUBLIC_URI}:${ST_BRANCH}\`"
            echo ""
            echo "**Finalize runner (DinD)**"
            echo "- \`${ECR_PUBLIC_RUNNER_URI}:${ST_SHA}\`"
            echo "- \`${ECR_PUBLIC_RUNNER_URI}:${ST_BRANCH}\`"
            echo ""
            echo "Pull:"
            echo '```'
            echo "docker pull ${ECR_PUBLIC_URI}:${ST_SHA}"
            echo "docker pull ${ECR_PUBLIC_RUNNER_URI}:${ST_BRANCH}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev-sandbox:
    name: Deploy sandbox (Docker + SSM)
    needs: push
    if: inputs.rollout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    env:
      # Docker rollout target. Prefer an explicit workflow input (so the
      # main→DEV Hub caller can pass DOCKER_DEPLOY_DEV_INSTANCE_ID without
      # stealing release-all's prod sandbox), else DOCKER_DEPLOY_INSTANCE_ID.
      # Never hardcode an instance id in this public tree.
      #   DOCKER_DEPLOY_INSTANCE_ID      prod sandbox (agenthub.surveytracker.io)
      #   DOCKER_DEPLOY_DEV_INSTANCE_ID  DEV Hub (dev.agenthub.*) — set only on
      #                                  the Deploy DEV Hub from main caller
      #   DOCKER_DEPLOY_ROLE_ARN         OIDC role assumed on the target account
      #   DOCKER_DEPLOY_REGION           region of that instance
      # When DOCKER_DEPLOY_ROLE_ARN is unset the ECR push role (ECR_PUSH_ROLE_ARN)
      # is reused, so a single-account setup only needs the push role configured.
      # The image PUSH (above) targets ECR_REGISTRY; this deploy step assumes the
      # target-account role and SSMs that instance. The target box runs the
      # agenthub-server systemd unit and pulls ${ECR_PUBLIC_URI}:${DEPLOY_TAG}
      # (cross-account pull is fine — the registry is public), so the digest
      # assertion still holds.
      AWS_ROLE_TO_ASSUME: ${{ vars.DOCKER_DEPLOY_ROLE_ARN || vars.ECR_PUSH_ROLE_ARN }}
      AWS_DEPLOY_REGION: ${{ vars.DOCKER_DEPLOY_REGION || 'us-east-2' }}
      DEPLOY_INSTANCE_ID: ${{ inputs.deploy_instance_id || vars.DOCKER_DEPLOY_INSTANCE_ID }}
      EXPECTED_DIGEST: ${{ needs.push.outputs.digest }}
      # Assert against the moving tag this run actually published, not a literal
      # `main`. A dispatch on any other ref publishes `<ref-name>` and the target
      # host is pointed at that same tag, so the hardcoded `main` compared an
      # unrelated (usually older) image and the job could only ever fail — the
      # image was live and correct while CI reported a failed rollout. On a main
      # build this resolves to `main`, unchanged.
      DEPLOY_TAG: ${{ needs.push.outputs.moving_tag || 'main' }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_DEPLOY_REGION }}

      - name: Restart Agent Hub on dev EC2 (pull fresh image)
        env:
          RESET_INSTANCE: ${{ inputs.reset_instance }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_INSTANCE_ID" ]; then
            echo "::error::No deploy instance configured. Pass workflow input deploy_instance_id, or set repo Variable DOCKER_DEPLOY_INSTANCE_ID." >&2
            exit 1
          fi
          DATA_ROOT="/var/lib/agent-hub"
          BOOL_RESET="${RESET_INSTANCE,,}"
          # user-data writes agenthub-server-run.sh only at first boot; terraform
          # env sync does not refresh it. Hosts with a pre-image-tag script ignore
          # /etc/agent-hub/image-tag and always pull the baked :main — Release then
          # times out with empty LOCAL_REPO_DIGEST for :vX.Y.Z. Inject the
          # override once when missing (matches agent-hub-user-data.tftpl).
          ENSURE_IMAGE_TAG_OVERRIDE=$(cat <<'ENSURE_EOF'
          ensure_image_tag_override() {
            local script=/usr/local/bin/agenthub-server-run.sh
            if [ ! -f "$script" ]; then
              echo "WARN: $script missing; cannot ensure image-tag override" >&2
              return 0
            fi
            if grep -q '/etc/agent-hub/image-tag' "$script"; then
              return 0
            fi
            echo "Patching $script to honor /etc/agent-hub/image-tag (stale host script)"
            sudo python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("/usr/local/bin/agenthub-server-run.sh")
          text = path.read_text()
          if "/etc/agent-hub/image-tag" in text:
              raise SystemExit(0)
          block = """
          # CI / manual deploy writes the moving tag here before systemctl restart.
          # Override the baked-in image URI so pull-on-start tracks the tag that was
          # just published rather than whatever tag was embedded at host bootstrap.
          if [ -f /etc/agent-hub/image-tag ]; then
            DEPLOY_TAG="$(tr -d '[:space:]' < /etc/agent-hub/image-tag)"
            if [ -n "$DEPLOY_TAG" ]; then
              IMAGE_BASE="${IMAGE_URI%:*}"
              IMAGE_URI="$IMAGE_BASE:$DEPLOY_TAG"
              if [ -n "$RUNNER_IMAGE_URI" ]; then
                RUNNER_BASE="${RUNNER_IMAGE_URI%:*}"
                RUNNER_IMAGE_URI="$RUNNER_BASE:$DEPLOY_TAG"
              fi
            fi
          fi
          """
          m = re.search(r"^RUNNER_IMAGE_URI=.*$", text, re.M) or re.search(
              r"^IMAGE_URI=.*$", text, re.M
          )
          if not m:
              raise SystemExit("could not find IMAGE_URI insertion point in agenthub-server-run.sh")
          path.write_text(text[: m.end()] + "\n" + block + text[m.end() :])
          path.chmod(0o755)
          print("patched", path)
          PY
          }
          ENSURE_EOF
          )
          if [[ "$BOOL_RESET" == "true" ]]; then
            SCRIPT=$(cat <<EOF
          set -euo pipefail
          DATA_ROOT="$DATA_ROOT"
          EXPECTED_DIGEST="$EXPECTED_DIGEST"
          DEPLOY_TAG="$DEPLOY_TAG"
          ${ENSURE_IMAGE_TAG_OVERRIDE}
          if [ -f "\$DATA_ROOT/data/config.json" ]; then
            sudo cp -a "\$DATA_ROOT/data/config.json" /tmp/agent-hub-config.json
          fi
          sudo systemctl stop agenthub-server || true
          sudo docker rm -f agenthub-server 2>/dev/null || true
          sudo rm -rf "\$DATA_ROOT/data" "\$DATA_ROOT/uploads" "\$DATA_ROOT/projects"
          sudo install -d -m 0755 -o 1000 -g 1000 "\$DATA_ROOT/data" "\$DATA_ROOT/uploads" "\$DATA_ROOT/projects"
          if [ -f /tmp/agent-hub-config.json ]; then
            sudo install -m 0600 -o 1000 -g 1000 /tmp/agent-hub-config.json "\$DATA_ROOT/data/config.json"
            sudo rm -f /tmp/agent-hub-config.json
          fi
          sudo install -d -m 0755 /etc/agent-hub
          printf '%s\n' "\$DEPLOY_TAG" | sudo tee /etc/agent-hub/image-tag >/dev/null
          ensure_image_tag_override
          sudo systemctl start agenthub-server
          sudo systemctl is-active agenthub-server

          POLL_TIMEOUT=240
          POLL_INTERVAL=5
          POLL_DEADLINE=\$(( \$(date +%s) + POLL_TIMEOUT ))
          LOCAL_DIGEST=""
          CONTAINER_IMAGE_ID=""
          LOCAL_IMAGE_ID=""
          attempts=0
          while :; do
            attempts=\$(( attempts + 1 ))
            LOCAL_DIGEST=\$(sudo docker image inspect ${ECR_PUBLIC_URI}:\$DEPLOY_TAG \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' 2>/dev/null \
              | grep -oE 'sha256:[a-f0-9]+' | head -1 || true)
            CONTAINER_IMAGE_ID=\$(sudo docker inspect agenthub-server --format '{{.Image}}' 2>/dev/null || true)
            LOCAL_IMAGE_ID=\$(sudo docker image inspect ${ECR_PUBLIC_URI}:\$DEPLOY_TAG --format '{{.Id}}' 2>/dev/null || true)

            digest_ok="false"
            container_ok="false"
            if [ -z "\$EXPECTED_DIGEST" ] || [ "\$LOCAL_DIGEST" = "\$EXPECTED_DIGEST" ]; then
              digest_ok="true"
            fi
            if [ -n "\$CONTAINER_IMAGE_ID" ] && [ -n "\$LOCAL_IMAGE_ID" ] && [ "\$CONTAINER_IMAGE_ID" = "\$LOCAL_IMAGE_ID" ]; then
              container_ok="true"
            fi

            echo "wait_for_deploy attempt=\$attempts digest_ok=\$digest_ok container_ok=\$container_ok local_digest=\$LOCAL_DIGEST"

            if [ "\$digest_ok" = "true" ] && [ "\$container_ok" = "true" ]; then
              break
            fi
            if [ \$(date +%s) -ge \$POLL_DEADLINE ]; then
              echo "wait_for_deploy: timed out after \${POLL_TIMEOUT}s (\$attempts attempts)" >&2
              break
            fi
            sleep "\$POLL_INTERVAL"
          done

          if [ -z "\$EXPECTED_DIGEST" ]; then
            echo "WARN: EXPECTED_DIGEST not provided by workflow; skipping digest assertion." >&2
            echo "OK: agenthub-server restarted after reset (digest assertion skipped)."
            exit 0
          fi

          if [ "\$LOCAL_DIGEST" != "\$EXPECTED_DIGEST" ]; then
            echo "FATAL: host :\$DEPLOY_TAG digest (\$LOCAL_DIGEST) != just-pushed digest (\$EXPECTED_DIGEST)" >&2
            exit 1
          fi

          if [ -n "\$CONTAINER_IMAGE_ID" ] && [ -n "\$LOCAL_IMAGE_ID" ] && [ "\$CONTAINER_IMAGE_ID" != "\$LOCAL_IMAGE_ID" ]; then
            echo "FATAL: running container image (\$CONTAINER_IMAGE_ID) != local :\$DEPLOY_TAG image-id (\$LOCAL_IMAGE_ID)" >&2
            exit 1
          fi

          if [ -z "\$CONTAINER_IMAGE_ID" ] || [ -z "\$LOCAL_IMAGE_ID" ]; then
            echo "FATAL: agenthub-server container not running after \${POLL_TIMEOUT}s" >&2
            exit 1
          fi

          echo "OK: agenthub-server is running the just-pushed image after reset."
          EOF
          )
            COMMENT="CI fresh-setup reset on dev sandbox ${{ github.sha }}"
          else
            SCRIPT=$(cat <<EOF
          set -euo pipefail
          EXPECTED_DIGEST="$EXPECTED_DIGEST"
          DEPLOY_TAG="$DEPLOY_TAG"
          ${ENSURE_IMAGE_TAG_OVERRIDE}
          sudo install -d -m 0755 /etc/agent-hub
          printf '%s\n' "\$DEPLOY_TAG" | sudo tee /etc/agent-hub/image-tag >/dev/null
          ensure_image_tag_override
          sudo systemctl restart agenthub-server
          sudo systemctl is-active agenthub-server

          POLL_TIMEOUT=240
          POLL_INTERVAL=5
          POLL_DEADLINE=\$(( \$(date +%s) + POLL_TIMEOUT ))
          LOCAL_DIGEST=""
          CONTAINER_IMAGE_ID=""
          LOCAL_IMAGE_ID=""
          attempts=0
          while :; do
            attempts=\$(( attempts + 1 ))
            LOCAL_DIGEST=\$(sudo docker image inspect ${ECR_PUBLIC_URI}:\$DEPLOY_TAG \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' 2>/dev/null \
              | grep -oE 'sha256:[a-f0-9]+' | head -1 || true)
            CONTAINER_IMAGE_ID=\$(sudo docker inspect agenthub-server --format '{{.Image}}' 2>/dev/null || true)
            LOCAL_IMAGE_ID=\$(sudo docker image inspect ${ECR_PUBLIC_URI}:\$DEPLOY_TAG --format '{{.Id}}' 2>/dev/null || true)

            digest_ok="false"
            container_ok="false"
            if [ -z "\$EXPECTED_DIGEST" ] || [ "\$LOCAL_DIGEST" = "\$EXPECTED_DIGEST" ]; then
              digest_ok="true"
            fi
            if [ -n "\$CONTAINER_IMAGE_ID" ] && [ -n "\$LOCAL_IMAGE_ID" ] && [ "\$CONTAINER_IMAGE_ID" = "\$LOCAL_IMAGE_ID" ]; then
              container_ok="true"
            fi

            echo "wait_for_deploy attempt=\$attempts digest_ok=\$digest_ok container_ok=\$container_ok local_digest=\$LOCAL_DIGEST"

            if [ "\$digest_ok" = "true" ] && [ "\$container_ok" = "true" ]; then
              break
            fi
            if [ \$(date +%s) -ge \$POLL_DEADLINE ]; then
              echo "wait_for_deploy: timed out after \${POLL_TIMEOUT}s (\$attempts attempts)" >&2
              break
            fi
            sleep "\$POLL_INTERVAL"
          done

          echo "EXPECTED_DIGEST=\$EXPECTED_DIGEST"
          echo "LOCAL_REPO_DIGEST=\$LOCAL_DIGEST"
          echo "LOCAL_IMAGE_ID=\$LOCAL_IMAGE_ID"
          echo "CONTAINER_IMAGE_ID=\$CONTAINER_IMAGE_ID"

          if [ -z "\$EXPECTED_DIGEST" ]; then
            echo "WARN: EXPECTED_DIGEST not provided by workflow; skipping digest assertion." >&2
            echo "OK: agenthub-server restarted (digest assertion skipped)."
            exit 0
          fi

          if [ "\$LOCAL_DIGEST" != "\$EXPECTED_DIGEST" ]; then
            echo "FATAL: host :\$DEPLOY_TAG digest (\$LOCAL_DIGEST) != just-pushed digest (\$EXPECTED_DIGEST)" >&2
            exit 1
          fi

          if [ -n "\$CONTAINER_IMAGE_ID" ] && [ -n "\$LOCAL_IMAGE_ID" ] && [ "\$CONTAINER_IMAGE_ID" != "\$LOCAL_IMAGE_ID" ]; then
            echo "FATAL: running container image (\$CONTAINER_IMAGE_ID) != local :\$DEPLOY_TAG image-id (\$LOCAL_IMAGE_ID)" >&2
            exit 1
          fi

          if [ -z "\$CONTAINER_IMAGE_ID" ] || [ -z "\$LOCAL_IMAGE_ID" ]; then
            echo "FATAL: agenthub-server container not running after \${POLL_TIMEOUT}s" >&2
            exit 1
          fi

          echo "OK: agenthub-server is running the just-pushed image."
          EOF
          )
            COMMENT="CI deploy after ECR push ${{ github.sha }}"
          fi
          PARAMS_JSON=$(printf '%s' "$SCRIPT" | jq -Rcs '{commands: split("\n") | map(select(length > 0))}')
          echo "reset_instance=$RESET_INSTANCE"
          echo "ssm-comment=$COMMENT"
          # The deploy target lives in two places that can drift: this workflow's
          # DOCKER_DEPLOY_INSTANCE_ID repo Variable, and the Terraform
          # ci_ssm_deploy_* inputs that scope the CI role's SSM grant. Replacing
          # the box updates one side and the other keeps naming the dead
          # instance, which surfaces as a bare AccessDenied + exit 254. Translate
          # it into the remediation instead of making the next reader decode IAM.
          SEND_ERR="${RUNNER_TEMP:-/tmp}/ssm-send-command.err"
          if ! CMD_ID="$(aws ssm send-command \
            --region "$AWS_DEPLOY_REGION" \
            --instance-ids "$DEPLOY_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "$COMMENT" \
            --parameters "$PARAMS_JSON" \
            --output text \
            --query 'Command.CommandId' 2>"$SEND_ERR")"; then
            cat "$SEND_ERR" >&2
            if grep -q 'AccessDeniedException' "$SEND_ERR"; then
              echo "::error::ssm:SendCommand denied for $DEPLOY_INSTANCE_ID in $AWS_DEPLOY_REGION. The CI role's SSM grant (Terraform aws_iam_role_policy.github_actions_ecr_push_ssm_dev_deploy) is scoped to different instances. Point ci_ssm_deploy_instance_tags / ci_ssm_deploy_instance_id / ci_ssm_deploy_instance_ids at the same box as DOCKER_DEPLOY_INSTANCE_ID (release) or DOCKER_DEPLOY_DEV_INSTANCE_ID (main→DEV), re-apply Terraform, then re-run this job."
              echo "::error::Reaching this usually means a deploy Variable changed since the last prod Terraform apply — release-all.yml passes DOCKER_DEPLOY_INSTANCE_ID and DOCKER_DEPLOY_DEV_INSTANCE_ID into the plan as TF_VAR_ci_ssm_expected_deploy_instance_ids, and terraform_data.ci_ssm_deploy_target_guard fails the plan when either target is missing. Re-run the release Terraform apply (or apply locally) after fixing the tfvars."
            fi
            exit 1
          fi
          echo "SSM CommandId=$CMD_ID"
          for i in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation \
              --region "$AWS_DEPLOY_REGION" \
              --command-id "$CMD_ID" \
              --instance-id "$DEPLOY_INSTANCE_ID" \
              --query Status \
              --output text || true)"
            echo "poll $i status=$STATUS"
            if [[ "$STATUS" == "Success" ]]; then
              aws ssm get-command-invocation \
                --region "$AWS_DEPLOY_REGION" \
                --command-id "$CMD_ID" \
                --instance-id "$DEPLOY_INSTANCE_ID" \
                --query StandardOutputContent \
                --output text
              exit 0
            fi
            if [[ "$STATUS" == "Failed" ]] || [[ "$STATUS" == "Cancelled" ]] || [[ "$STATUS" == "TimedOut" ]] || [[ "$STATUS" == "Cancelling" ]]; then
              aws ssm get-command-invocation \
                --region "$AWS_DEPLOY_REGION" \
                --command-id "$CMD_ID" \
                --instance-id "$DEPLOY_INSTANCE_ID" \
                --output json
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for SSM" >&2
          exit 1

      - name: Deploy summary
        env:
          RESET_INSTANCE: ${{ inputs.reset_instance }}
        run: |
          {
            echo "### Dev sandbox"
            echo ""
            BOOL_RESET="${RESET_INSTANCE,,}"
            if [[ "$BOOL_RESET" == "true" ]]; then
              echo "**Reset mode** on instance \`$DEPLOY_INSTANCE_ID\`."
            else
              echo "Restarted \`agenthub-server\` on \`$DEPLOY_INSTANCE_ID\` (pull picks up \`:$DEPLOY_TAG\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
