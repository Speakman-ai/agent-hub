services:
  server:
    image: ${AGENT_HUB_SERVER_IMAGE:-public.ecr.aws/h9t4v7h0/agent-hub:main}
    restart: unless-stopped
    user: '0:0'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./.agent-hub-preview/data:/data
      - ./.agent-hub-preview/uploads:/app/server/uploads
    environment:
      - NODE_ENV=production
      - AGENT_HUB_DATA_DIR=/data
      - AGENT_HUB_PORT=3051
      - AGENT_HUB_HOST=0.0.0.0
      - HOME=/data
      - AGENT_HUB_PREVIEW_HEALTH_HOST=${AGENT_HUB_PREVIEW_HEALTH_HOST:-host.docker.internal}
      - AGENT_HUB_PREVIEW_READY_TIMEOUT_MS=${AGENT_HUB_PREVIEW_READY_TIMEOUT_MS:-600000}
      - AGENT_HUB_CODEX_DANGER_BYPASS=${AGENT_HUB_CODEX_DANGER_BYPASS:-true}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:3050}
      # A preview of agent-hub gets NO host docker socket (a preview must not
      # reach the host daemon). Tell the nested Hub so it skips its
      # docker-dependent background reapers instead of spamming docker-socket
      # connection errors every 60 s. The Hub also auto-detects the missing
      # socket; this just makes the intent explicit and skips the probe.
      # See server/docker-availability.ts.
      - AGENT_HUB_DISABLE_DOCKER_FEATURES=1
    expose:
      - '3051'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3051/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Runs the Vite dev server for live HMR against the worktree the Hub
  # bind-mounts at /app (see .agent-hub/preview.json `entryWorkdir`). Assumes
  # subdomain preview mode (app served at base `/`); in path-prefix mode a dev
  # server's absolute URLs don't resolve. See ops/RUNBOOK-subdomain-preview-hmr.md.
  client:
    # :main supplies the Node runtime; the worktree mount overlays /app, so the
    # client source + client/node_modules (incl. vite) come from the session.
    image: ${AGENT_HUB_SERVER_IMAGE:-public.ecr.aws/h9t4v7h0/agent-hub:main}
    working_dir: /app/client
    # `exec` so vite is PID 1 and gets SIGTERM cleanly on `compose down`.
    # AGENT_HUB_PREVIEW=1 switches vite.config.js into HMR-over-proxy mode
    # (proxy /api to the `server` service, bind 0.0.0.0:$FRONTEND_PORT,
    # allowedHosts, HMR ws via the Hub proxy tunnel).
    command: ['sh', '-c', 'exec node_modules/.bin/vite']
    restart: unless-stopped
    environment:
      - AGENT_HUB_PREVIEW=1
      - FRONTEND_PORT=${FRONTEND_PORT:-80}
      # Lets vite.config.js scope server.allowedHosts to `.<base>` (the
      # *.preview.<base> session subdomains) instead of allowing any Host.
      # Inherited from the Hub process; empty in path-prefix/local setups.
      - AGENT_HUB_PREVIEW_SUBDOMAIN_BASE=${AGENT_HUB_PREVIEW_SUBDOMAIN_BASE:-}
    depends_on:
      server:
        condition: service_healthy
    expose:
      - '80'
